async function txAudio(it) {
  let blob = null;
  if (it.file) blob = await getFile(it.file);
  if (!blob && it.url) {
    try { const r = await fetch(it.url); blob = await r.blob(); }
    catch (e) { blob = await grab(it.url, false, 20000); }
  }
  if (!blob) throw new Error('لم أجد ملف الصوت في هذا المتصفح');
  const ab = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let buf;
  try { buf = await ctx.decodeAudioData(ab); }
  catch (e) { ctx.close(); throw new Error('تعذّر فكّ ترميز الصوت — جرّب ملف mp3 أو m4a'); }
  ctx.close();
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const out = await off.startRendering();
  return out.getChannelData(0);
}

/* ===== عامل في الخلفية: التفريغ لا يوقف الصفحة =====
   المتصفّح يشغّل هذا الملف في خيط مستقلّ، فتبقى الصفحة سريعة وأنت تتنقّل. */
const TXW_SRC = `
let pipe=null, name='';
/* خزانة النموذج في قاعدة بيانات المتصفّح — لينزَّل مرّة واحدة فقط،
   حتى حين يُفتح الموقع كملف من الجهاز (وهناك لا تعمل خزانة المتصفّح المعتادة) */
function mdb(){ return new Promise(r=>{ try{
  const q=indexedDB.open('ws_models',1);
  q.onupgradeneeded=()=>{ try{ q.result.createObjectStore('f'); }catch(e){} };
  q.onsuccess=()=>r(q.result); q.onerror=()=>r(null);
}catch(e){ r(null); } }); }
const MCACHE={
  async match(req){ try{
    const k=typeof req==='string'?req:req.url; const d=await mdb(); if(!d) return undefined;
    return await new Promise(r=>{ const q=d.transaction('f','readonly').objectStore('f').get(k);
      q.onsuccess=()=>r(q.result? new Response(q.result):undefined); q.onerror=()=>r(undefined); });
  }catch(e){ return undefined; } },
  async put(req,res){ try{
    const k=typeof req==='string'?req:req.url; const buf=await res.clone().arrayBuffer();
    const d=await mdb(); if(!d) return;
    await new Promise(r=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').put(buf,k);
      t.oncomplete=()=>r(); t.onerror=()=>r(); });
  }catch(e){} }
};
async function load(model,gpu){
  let T=null, opt=null;
  if(gpu){ try{
    T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3');
    T.env.allowLocalModels=false;
    opt={device:'webgpu',dtype:{encoder_model:'fp16',decoder_model_merged:'q4'}};
  }catch(e){ T=null; } }
  if(!T){
    T=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    T.env.allowLocalModels=false;
    opt={quantized:true};
  }
  try{ T.env.useBrowserCache=false; T.env.useCustomCache=true; T.env.customCache=MCACHE; }catch(e){}
  /* خيطٌ واحد: الاستضافات العامّة (مثل صفحات github) لا ترسل ترويسات
     العزل التي تحتاجها الخيوط المتعدّدة، فبدونها يفشل المحرّك أصلًا */
  try{ if(!self.crossOriginIsolated){ T.env.backends.onnx.wasm.numThreads=1; } }catch(e){}
  try{ T.env.backends.onnx.wasm.proxy=false; }catch(e){}
  opt.progress_callback=p=>{ try{ postMessage({t:'dl',p:{status:p.status,loaded:p.loaded,total:p.total}}); }catch(e){} };
  pipe=await T.pipeline('automatic-speech-recognition',model,opt); name=model;
}
onmessage=async e=>{
  const d=e.data||{};
  try{
    if(d.cmd==='probe'){
      const r={worker:true, iso:!!self.crossOriginIsolated, sab:typeof SharedArrayBuffer!=='undefined'};
      try{ const t0=Date.now();
        const T=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
        r.lib=Date.now()-t0; r.libv=(T.env&&T.env.version)||'ok';
      }catch(err){ r.libErr=String((err&&err.message)||err); }
      if(!r.libErr){ try{ const t1=Date.now();
        const res=await fetch('https://huggingface.co/'+d.model+'/resolve/main/config.json');
        r.hfStatus=res.status; r.hf=Date.now()-t1;
      }catch(err){ r.hfErr=String((err&&err.message)||err); } }
      postMessage({t:'probe',id:d.id,r}); return;
    }
    if(d.cmd==='load'){ if(!pipe||name!==d.model) await load(d.model,d.gpu); postMessage({t:'ready',id:d.id}); }
    else if(d.cmd==='run'){
      let out;
      try{ out=await pipe(d.pcm,{language:'arabic',task:'transcribe',return_timestamps:true}); }
      catch(err){ out=await pipe(d.pcm,{language:'arabic',task:'transcribe'}); }
      postMessage({t:'seg',id:d.id,out:{text:out&&out.text||'',
        chunks:((out&&out.chunks)||[]).map(c=>({timestamp:c.timestamp,text:c.text}))}});
    }
  }catch(err){ postMessage({t:'err',id:d.id,m:String((err&&err.message)||err)}); }
};
`;
let txW = null, txWid = 0, txWaiting = {};
function txWorkerStart() {
  if (txW) return txW;
  const url = URL.createObjectURL(new Blob([TXW_SRC], { type: 'text/javascript' }));
  /* عامل كلاسيكيّ لا وحدة: هذا وحده يعمل حين يُفتح الموقع كملف من الجهاز */
  const w = new Worker(url);
  w.onmessage = e => {
    const d = e.data || {};
    if (d.t === 'dl') { if (txW && txW.onDl) txW.onDl(d.p); return; }
    const f = txWaiting[d.id];
    if (!f) return;
    delete txWaiting[d.id];
    if (d.t === 'err') f.rej(new Error(d.m)); else f.res(d);
  };
  w.onerror = () => { try { w.terminate(); } catch (e) {} txW = null; };
  txW = w; return w;
}
function txAsk(msg, transfer, ms) {
  const w = txWorkerStart();
  const id = ++txWid;
  return new Promise((res, rej) => {
    const to = setTimeout(() => {
      if (txWaiting[id]) { delete txWaiting[id]; rej(new Error('انتهت المهلة')); }
    }, ms || 300000);
    txWaiting[id] = { res: r => { clearTimeout(to); res(r); }, rej: e => { clearTimeout(to); rej(e); } };
    try { w.postMessage(Object.assign({ id }, msg), transfer || []); }
    catch (e) { clearTimeout(to); delete txWaiting[id]; rej(e); }
  });
}

/* تحميل النموذج مرّة واحدة، ومع تسريع البطاقة الرسوميّة إن وُجدت */
async function txLoad(model, onp) {
  if (txPipe && txPipeName === model) return txPipe;
  let T = null, opt = { progress_callback: onp };
  const gpu = !!navigator.gpu;
  if (gpu) {
    try {
      T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3');
      T.env.allowLocalModels = false;
      opt.device = 'webgpu'; opt.dtype = { encoder_model: 'fp16', decoder_model_merged: 'q4' };
    } catch (e) { T = null; }
  }
  if (!T) {
    T = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    T.env.allowLocalModels = false;
    opt = { quantized: true, progress_callback: onp };
  }
  try { if (!self.crossOriginIsolated) T.env.backends.onnx.wasm.numThreads = 1; } catch (e) {}
  try { T.env.backends.onnx.wasm.proxy = false; } catch (e) {}
  txPipe = await T.pipeline('automatic-speech-recognition', model, opt);
  txPipeName = model;
  return txPipe;
}
const TXCH = 28, TXOV = 1;            /* طول الدفعة بالثواني، والتداخل */
async function txRun(it, model, resume) {
  if (TXJOB && TXJOB.state !== 'done') { toast('هناك تفريغ يعمل الآن — انتظره أو أوقفه'); return; }
  const card = txProgress('جارٍ تجهيز الصوت…');
  let pcm;
  try { pcm = await txAudio(it); }
  catch (e) { txFail(e); return; }
  const total = Math.max(1, Math.ceil(pcm.length / 16000 / (TXCH - TXOV)));
  const old = resume ? txOf(it.id) : null;
  TXJOB = { itemId: it.id, name: it.name, total, i: (old && old.next) || 0,
    segs: (old && old.segs) || [], state: 'run', model, t0: Date.now() };
  txPill();
  try {
    txSet(2, 'جارٍ تجهيز النموذج…');
    const onDl = p => {
      if (p && p.status === 'progress' && p.total)
        txSet(2 + (p.loaded / p.total) * 8, 'تنزيل النموذج ' + Math.round(p.loaded / p.total * 100) + '٪ (مرّة واحدة)');
    };
    let useW = true, pipe = null;
    try {
      const w = txWorkerStart(); w.onDl = onDl;
      await txAsk({ cmd: 'load', model, gpu: !!navigator.gpu }, null, 600000);
    } catch (e) {
      useW = false;
      try { if (txW) txW.terminate(); } catch (e2) {} txW = null;
      pipe = await txLoad(model, onDl);
    }
    TXJOB.t0 = Date.now();
    while (TXJOB && TXJOB.i < TXJOB.total) {
      if (TXJOB.state === 'pause') { await new Promise(r => setTimeout(r, 400)); continue; }
      const k = TXJOB.i;
      const from = Math.max(0, k * (TXCH - TXOV) * 16000);
      const to = Math.min(pcm.length, from + TXCH * 16000);
      if (from >= pcm.length) break;
      const slice = new Float32Array(pcm.subarray(from, to));
      let out;
      if (useW) {
        try { out = (await txAsk({ cmd: 'run', pcm: slice }, [slice.buffer])).out; }
        catch (e) {
          useW = false;
          try { if (txW) txW.terminate(); } catch (e2) {} txW = null;
          pipe = await txLoad(model, onDl);
          const s2 = new Float32Array(pcm.subarray(from, to));
          try { out = await pipe(s2, { language: 'arabic', task: 'transcribe', return_timestamps: true }); }
          catch (e2) { out = await pipe(s2, { language: 'arabic', task: 'transcribe' }); }
        }
      } else {
        try { out = await pipe(slice, { language: 'arabic', task: 'transcribe', return_timestamps: true }); }
        catch (e) { out = await pipe(slice, { language: 'arabic', task: 'transcribe' }); }
      }
      if (!TXJOB) return;                       /* أُوقف */
      const base = from / 16000;
      const chunks = (out && out.chunks && out.chunks.length) ? out.chunks
        : [{ timestamp: [0, 0], text: (out && out.text) || '' }];
      chunks.forEach(c => {
        const t = (c.text || '').trim();
        if (!t) return;
        const s = base + (c.timestamp && c.timestamp[0] != null ? +c.timestamp[0] : 0);
        const last = TXJOB.segs[TXJOB.segs.length - 1];
        /* لا نحذف إلا التكرار الناتج عن تداخل الدفعتين */
        if (last && last.t === t && Math.abs(s - last.s) <= TXOV + 2) return;
        TXJOB.segs.push({ s: Math.round(s), t });
      });
      TXJOB.i = k + 1;
      saveTx(it.id, { how: 'auto', model: model.split('/').pop(), at: Date.now(),
        segs: TXJOB.segs, next: TXJOB.i, total: TXJOB.total, done: TXJOB.i >= TXJOB.total });
      txSet(10 + (TXJOB.i / TXJOB.total) * 90, 'فُرّغ ' + AR(TXJOB.i) + ' من ' + AR(TXJOB.total) + ' دفعة');
      if (location.hash === '#/i/' + it.id && !document.querySelector('.sheet')) txRefresh(it.id);
      await new Promise(r => setTimeout(r, 0));   /* نفس للمتصفّح: الموقع يبقى سريعًا */
    }
    if (!TXJOB) return;
    saveTx(it.id, { how: 'auto', model: model.split('/').pop(), at: Date.now(),
      segs: TXJOB.segs, next: TXJOB.total, total: TXJOB.total, done: true });
    TXJOB = null; txPill(); closeSheet(); render();
    toast('تمّ التفريغ — محفوظ في صفحة العنصر');
  } catch (e) { txFail(e); }
}
function txMsg(e) {
  const m = String((e && e.message) || e || 'خطأ');
  if (/dynamically imported|Failed to fetch|NetworkError|load.*module/i.test(m))
    return 'تعذّر تنزيل نموذج التفريغ — تأكّد من اتصالك بالإنترنت (يُنزَّل مرّة واحدة ثم يعمل بلا إنترنت).';
  if (/انتهت المهلة/.test(m)) return 'طال الانتظار — جرّب الحجم السريع، أو أعد المحاولة.';
  if (/memory|allocation|OOM/i.test(m)) return 'الذاكرة لم تكفِ — جرّب الحجم السريع، أو قسّم الملف.';
  return m;
}
function txFail(e) {
  const card = document.querySelector('.sheet .sheetcard');
  const msg = txMsg(e);
  if (TXJOB) { TXJOB.state = 'err'; }
  const raw = String((e && e.message) || e || '');
  if (card) card.innerHTML = `<h3>تعذّر التفريغ</h3>
    <p class="mkempty">${esc(msg)}<br>
      ${TXJOB && TXJOB.segs.length ? 'ما فُرّغ قبل العطل محفوظ، ويمكنك إكماله من زر «أكمل التفريغ».' :
        'جرّب حجمًا أصغر، أو تأكّد من الاتصال، أو ألصق النصّ بنفسك.'}</p>
    ${raw && raw !== msg ? `<p class="mkempty" style="font-size:11.5px;direction:ltr;text-align:left">${esc(raw)}</p>` : ''}
    <div class="sheetrow"><button class="btn" data-txdiag="1">${ICON.info} افحص التفريغ</button>
      <button class="btn" onclick="closeSheet()">إغلاق</button></div>
    <div id="txDiag" style="font-size:12px;color:var(--muted);line-height:1.85;margin-top:8px"></div>`;
  else toast('تعذّر التفريغ: ' + msg);
  TXJOB = null; txPill();
}
/* تحديث لوحة التفريغ في مكانها دون إعادة بناء الصفحة */
function txRefresh(id) {
  const box = document.querySelector('.txbox[data-txitem="' + id + '"]');
  const r = findItem(id); if (!r) return;

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-mk]');
  if (b) {
    const k = b.dataset.mk, r = findItem(b.dataset.id); if (!r) return;
    const it = r.it;
    if (k === 'add') {
      const t = nowTime(it);
      if (t == null) { mkSheet(it, { t: 0 }); return; }       /* لا نعرف اللحظة: نسأل */
      if (!marks[it.id]) marks[it.id] = [];
      const near = marks[it.id].find(x => Math.abs((x.t || 0) - t) < 2);
      if (near) { toast('هذه اللحظة معلَّمة سلفًا'); return; }
      marks[it.id].push({ id: uid('m'), t: Math.round(t), e: 0, n: '', c: curColor || 'y', at: Date.now() });
      saveMarks(); toast('علامة عند ' + arTime(t));
      mkRefresh(it.id);
    } else if (k === 'go') {
      const m = (marks[it.id] || []).find(x => x.id === b.dataset.mid); if (!m) return;
      seekItem(it, m.t, m.e);
    } else if (k === 'edit') {
      const m = (marks[it.id] || []).find(x => x.id === b.dataset.mid); if (m) mkSheet(it, m);
    } else if (k === 'tx') txStart(it);
    else if (k === 'padd') {
      const p = nowPage();
      if (p == null) { pgSheet(it, { p: 1 }); return; }
      if (!marks[it.id]) marks[it.id] = [];
      const has = marks[it.id].find(x => x.p === p);
      if (has) { toast('صفحة ' + AR(p) + ' معلَّمة سلفًا'); return; }
      marks[it.id].push({ id: uid('m'), p, n: '', c: curColor || 'y', at: Date.now() });
      saveMarks(); toast('علامة على صفحة ' + AR(p));
      mkRefresh(it.id);
    }
    else if (k === 'pgo') {
      const m = (marks[it.id] || []).find(x => x.id === b.dataset.mid);
      if (m) goPage(m.p || 1);
    } else if (k === 'pedit') {
      const m = (marks[it.id] || []).find(x => x.id === b.dataset.mid);
      if (m) pgSheet(it, m);
    }
    return;
  }
  const x = ev.target.closest('[data-tx]');
  if (x) {
    const k = x.dataset.tx, r = findItem(x.dataset.id); if (!r) return;
    const it = r.it, d = txOf(it.id);
    if (k === 'go') seekItem(it, +x.dataset.t);
    else if (k === 'copy') {
      const t = (d.segs || []).map(s => s.t).join('\n');
      navigator.clipboard.writeText(t).then(() => toast('نُسخ')).catch(() => toast('تعذّر النسخ'));
    } else if (k === 'txt') {
      const head = it.name + '\n' + (r.sec ? r.sec.name : '') + '\n' + new Date().toLocaleDateString('ar-EG') + '\n\n';
      const body = (d.segs || []).map(g => (g.s != null ? mmss(g.s) + '\t' : '') + g.t).join('\n');
      saveBlob(new Blob([head + body], { type: 'text/plain;charset=utf-8' }), it.name + ' — تفريغ.txt', false);
    } else if (k === 'pdf') {
      txPrint(it, d, r);
    } else if (k === 'del') {
      confirmSheet('سيُحذف تفريغ «' + it.name + '».', () => { saveTx(it.id, null); });
    } else if (k === 'edit') txPaste(it);
    else if (k === 'resume') txPick(it, true);
    else if (k === 'mark') {
      const s = (d.segs || [])[+x.dataset.i]; if (!s) return;
      mkSheet(it, { t: s.s || 0, n: esc(s.t) });
    } else if (k === 'quote') {
      const s = (d.segs || [])[+x.dataset.i]; if (!s) return;
      quotes.unshift({ id: uid('q'), t: s.t, src: it.name, c: 0, pin: 0, at: Date.now() });
      saveQuotes(); toast('أُضيف إلى الاقتباسات');
    }
  }
});

          <span class="ulbl">${esc(p.t || partName(p.h))}</span>

        </div>`).join('')}
      </div>
      <div class="sheetrow"><button class="btn pri" data-sn="done">${ICON.chk} تمّ — ابدأ</button></div>`, el => {
      el.addEventListener('click', ev => {
        if (ev.target.closest('[data-sn]')) {
          S.set('setupDone', true); closeSheet(); startBtn(); render();
          toast('مساحتك جاهزة — وكل شيء يُغيَّر من التخصيص');
        }
      });
    });
  }
}


/* ================================================================
   كتاباتي — بوح ومذكّرات وأفكار ومقالات وفوائد وسؤال وجواب
   كلّها في خزانة واحدة، ولكل نوع بابه.
   ================================================================ */
let writes = S.get('writes', null);
if (!writes) {                       /* نقل دفتر البوح القديم كما هو */
  writes = (S.get('boh', []) || []).map(e => ({
    id: e.id || uid('w'), k: 'diary', ttl: e.ttl || '', h: e.h || '',
    m: e.m || '', d: e.d || ymd(new Date()), at: e.at || uidAt(e.id) || Date.now(), ref: ''
  }));
  S.set('writes', writes);
}
const saveWrites = () => S.set('writes', writes);

/* الأنواع: الثابتة، وما يضيفه صاحب المساحة */
const WK_BASE = [['diary', 'مذكّرة', 'boh'], ['idea', 'فكرة', 'mind'], ['article', 'مقال', 'text'],
                 ['note', 'فائدة', 'pen'], ['qa', 'سؤال وجواب', 'quote']];
const wkExtra = () => S.get('wkinds', []);
const WKINDS = () => WK_BASE.concat(wkExtra().map(k => [k, k, 'pen']));
const wkName = k => { const f = WKINDS().find(x => x[0] === k); return f ? f[1] : k; };
const wkIcon = k => { const f = WKINDS().find(x => x[0] === k); return ICON[(f && f[2]) || 'pen']; };
const BOH_KINDS = ['diary', 'idea'];                   /* ما يظهر في بوح */
const NOTE_KINDS = () => WKINDS().map(x => x[0]).filter(k => !BOH_KINDS.includes(k));

/* المزاج — ومنه «أخرى» التي تكتبها بنفسك */
const MOODS = () => ['', 'هادئ', 'شاكر', 'مجتهد', 'متعب', 'مشتاق', 'قلق', 'فرِح'].concat(S.get('moods', []));

function wOf(kinds) { return writes.filter(w => kinds.includes(w.k)).sort((a, b) => (b.at || 0) - (a.at || 0)); }
function wDate(d) { const x = new Date(d); if (isNaN(x)) return '';
  return DAYS[x.getDay()] + ' ' + AR(x.getDate()) + ' ' + MONTHS[x.getMonth()] + ' ' + AR(x.getFullYear()); }

let minds = S.get('minds', []);
const saveMinds = () => S.set('minds', minds);
const MC = ['#0d6e5f', '#a97f2e', '#3c6ea8', '#8a5a9b', '#b05b3c', '#4a7c4e', '#6b6b6b'];
let mSel = null, mPan = { x: 0, y: 0, z: 1 };

function newMind(name) {
  const m = { id: uid('mm'), name: name || 'خريطة جديدة', at: Date.now(),
    nodes: [{ id: 'root', p: null, t: name || 'الفكرة الأساسية', c: 0, x: 0, y: 0 }] };
  minds.unshift(m); saveMinds(); return m;
}
const findMind = id => minds.find(m => m.id === id);
const kidsOf = (m, id) => m.nodes.filter(n => n.p === id);
const isShut = n => !!n.z;                       /* مطويّ */
const kidsShown = (m, n) => isShut(n) ? [] : kidsOf(m, n.id);
/* كل ما تحت عقدة — لإخفائه حين تُطوى */
function underOf(m, id) {
  const out = []; const walk = i => kidsOf(m, i).forEach(k => { out.push(k.id); walk(k.id); });
  walk(id); return out;
}
function hiddenSet(m) {
  const hid = {};
  m.nodes.forEach(n => { if (isShut(n)) underOf(m, n.id).forEach(i => hid[i] = 1); });
  return hid;
}

/* ترتيب تلقائيّ — لكل عقدة أن تنشر فروعها بجانبها (أفقيّ) أو تحتها (عموديّ) */
const NW = 150, NH = 40, HGAP = 42, VSIB = 12, VGAP = 46, HSIB = 14;
const edir = (m, n) => n.d || m.dir || 'h';
function layout(m) {
  const root = m.nodes.find(n => !n.p) || m.nodes[0];
  if (!root) return;
  const seen = {};
  const measure = n => {
    if (seen[n.id]) return; seen[n.id] = 1;            /* حماية من حلقة */
    const ks = kidsShown(m, n);
    ks.forEach(measure);
    if (!ks.length) { n._w = NW; n._h = NH; return; }
    if (edir(m, n) === 'h') {
      const h = ks.reduce((a, k) => a + k._h, 0) + VSIB * (ks.length - 1);
      n._w = NW + HGAP + Math.max(...ks.map(k => k._w));
      n._h = Math.max(NH, h);
    } else {
      const w = ks.reduce((a, k) => a + k._w, 0) + HSIB * (ks.length - 1);
      n._w = Math.max(NW, w);
      n._h = NH + VGAP + Math.max(...ks.map(k => k._h));
    }
  };
  const place = (n, x, y) => {
    const ks = kidsShown(m, n);
    if (edir(m, n) === 'h') {
      n._x = x; n._y = y + (n._h - NH) / 2;
      const tot = ks.reduce((a, k) => a + k._h, 0) + VSIB * (ks.length - 1);
      let cy = y + (n._h - tot) / 2;
      ks.forEach(k => { place(k, x + NW + HGAP, cy); cy += k._h + VSIB; });
    } else {
      n._x = x + (n._w - NW) / 2; n._y = y;
      const tot = ks.reduce((a, k) => a + k._w, 0) + HSIB * (ks.length - 1);
      let cx = x + (n._w - tot) / 2;
      ks.forEach(k => { place(k, cx, y + NH + VGAP); cx += k._w + HSIB; });
    }
  };
  measure(root); place(root, 0, 0);
  const hid = hiddenSet(m);
  let row = 0;
  m.nodes.forEach(n => { n._hid = !!hid[n.id];
    if (!n._hid && n._x == null) { n._x = 0; n._y = (row++) * (NH + VSIB); } });
}
function mindBounds(m) {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  m.nodes.filter(n => !n._hid && n._x != null).forEach(n => {
    const x = n.fx != null ? n.fx : n._x, y = n.fy != null ? n.fy : n._y;
    x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x + NW + 10); y2 = Math.max(y2, y + NH);
  });
  return { x1, y1, w: Math.max(320, x2 - x1 + 40), h: Math.max(220, y2 - y1 + 40) };
}

/* لوحة الخرائط داخل صفحة الفوائد */

  const list=minds.slice(0,8);
  return `<section class="fieldset" style="margin:0 16px 14px">
    <div class="mkhead"><b>${ICON.mind} خرائطي الذهنية</b>
      <span style="flex:1"></span>
      ${helpBtn('mind')}
      <button class="btn pri" style="padding:7px 12px" data-mm="new">${ICON.plus} خريطة</button></div>
    ${list.length? `<div class="mklist">${list.map(m=>`
      <a class="mkrow" href="#/mind/${m.id}" style="text-decoration:none">
        <span class="mktime" style="background:var(--acc-soft);color:var(--acc)">${AR(m.nodes.length)}</span>
        <span class="mktext"><b style="font-size:13.5px">${esc(m.name)}</b>
          ${m.sec&&findSec(m.sec)?`<small style="display:block;font-size:11.5px;color:var(--muted)">${esc(findSec(m.sec).name)}</small>`:''}</span>
      </a>`).join('')}</div>
      ${minds.length>8?`<p class="mkempty">وغيرها ${AR(minds.length-8)}…</p>`:''}`
      : `<p class="mkempty">شجّر فكرة: عقدة في الوسط وفروع تتشعّب، واربط خريطة بأخرى.</p>`}
  </section>`;
}
/* ---------- القوائم ---------- */
function vMinds() {
  const name = partName('#/mind') || 'خرائطي الذهنية';
  return `${head(name, `${helpBtn('mind')}<button class="chip" data-mm="new">${ICON.plus} خريطة جديدة</button>`)}
  <p style="color:var(--muted);font-size:12.5px;line-height:1.9;margin:-4px 16px 12px">
    فكرةٌ في الوسط وفروعٌ تتشعّب منها — اضغط أي عقدة لتضيف تحتها أو تسمّيها أو تلوّنها، واسحبها حيث شئت.</p>
  ${minds.length ? `<div class="grid">${minds.map(m => `
    <a class="tile" href="#/mind/${m.id}"><div class="ic">${ICON.mind}</div>
      <div><b>${esc(m.name)}</b><small>${AR(m.nodes.length)} عقدة${m.sec&&findSec(m.sec)?' · '+esc(findSec(m.sec).name):''}</small></div></a>`).join('')}</div>`
    : `<div class="empty">لا خرائط بعد.<br><button class="btn pri" data-mm="new" style="margin-top:10px">${ICON.plus} أنشئ أول خريطة</button></div>`}`;
}
function vMind(id) {
  const m = findMind(id);
  if (!m) return `<div class="empty">الخريطة غير موجودة.</div>`;
  layout(m);
  const b = mindBounds(m);
  return `<a class="back" href="#/mind">${ICON.back} ${esc(partName('#/mind') || 'خرائطي')}</a>
  <div class="mindbar">
    <b>${esc(m.name)}</b>
    <span style="flex:1"></span>
    <button class="chip" data-mm="rename" data-id="${m.id}">${ICON.pen} الاسم</button>
    <button class="chip" data-mm="png" data-id="${m.id}">${ICON.dl} صورة</button>
    <button class="chip" data-mm="dir" data-id="${m.id}">${(m.dir||'h')==='h'?'⇠ الفروع بجانب':'⇣ الفروع تحت'}</button>
    <button class="chip" data-mm="foldall" data-id="${m.id}">اطوِ الكل</button>
    <button class="chip" data-mm="openall" data-id="${m.id}">افتح الكل</button>
    <button class="chip" data-mm="fit" data-id="${m.id}">توسيط</button>
    <button class="chip danger" data-mm="delmap" data-id="${m.id}">حذف</button>
  </div>
  <div class="mindwrap" id="mindWrap" data-id="${m.id}">
    <div class="mindcanvas" id="mindCv" style="width:${b.w}px;height:${b.h}px">
      <svg class="mindsvg" width="${b.w}" height="${b.h}">${mindLines(m, b)}</svg>
      ${m.nodes.filter(n => !n._hid && n._x != null).map(n => mindNode(m, n, b)).join('')}
    </div>
  </div>
  <p class="mkempty" style="padding:0 16px">اضغط العقدة لتفتح أدواتها، واسحبها لتحرّكها.
    وزرّ الاتجاه أعلاه يقلب الخريطة كلّها — والفروع بجانب أصلها أو تحته — ولكل عقدة أن تخالف الخريطة من أدواتها.</p>`;
}
function nodeXY(n, b) {
  return { x: (n.fx != null ? n.fx : n._x) - b.x1 + 20, y: (n.fy != null ? n.fy : n._y) - b.y1 + 20 };
}
function mindLines(m, b) {
  return m.nodes.filter(n => n.p && !n._hid && n._x != null).map(n => {
    const par = m.nodes.find(x => x.id === n.p); if (!par || par._hid) return '';
    const a = nodeXY(par, b), c = nodeXY(n, b);
    const col = MC[par.c || 0];
    if (edir(m, par) === 'v') {
      /* الفرع تحت أصله: خطّ نازل */
      const ax = b.w - (a.x + NW / 2), ay = a.y + NH;
      const cx = b.w - (c.x + NW / 2), cy = c.y;
      const my = (ay + cy) / 2;
      return `<path d="M${ax} ${ay} C ${ax} ${my}, ${cx} ${my}, ${cx} ${cy}"
        fill="none" stroke="${col}" stroke-width="2" opacity=".5"/>`;
    }
    /* الفرع بجانب أصله: خطّ جانبيّ (من اليمين إلى اليسار) */
    const ax = b.w - a.x - NW, ay = a.y + NH / 2;
    const cx = b.w - c.x, cy = c.y + NH / 2;
    const mx = (ax + cx) / 2;
    return `<path d="M${ax} ${ay} C ${mx} ${ay}, ${mx} ${cy}, ${cx} ${cy}"
      fill="none" stroke="${col}" stroke-width="2" opacity=".5"/>`;
  }).join('');
}
function mindNode(m, n, b) {
  const p = nodeXY(n, b);
  const root = !n.p;
  const kids = kidsOf(m, n.id).length;
  const lk = n.lk ? findMind(n.lk) : null;
  return `<div class="mnode ${root ? 'root' : ''}" data-nid="${n.id}"
    style="right:${p.x}px;top:${p.y}px;--nc:${MC[n.c || 0]}">
    <span>${lk ? '⧉ ' : ''}${esc(n.t || '…')}</span>
    ${kids ? `<button class="mfold" data-fold="${n.id}">${isShut(n) ? '+' + AR(kids) : '−'}</button>` : ''}
  </div>`;
}

/* ---------- أدوات العقدة ---------- */
function nodeSheet(mid, nid) {
  const m = findMind(mid); if (!m) return;
  const n = m.nodes.find(x => x.id === nid); if (!n) return;
  sheet(`<h3>العقدة</h3>
    <div class="field"><label>النصّ</label><input type="text" id="nT" value="${esc(n.t || '')}"></div>
    <div class="pal" style="margin:10px 0">${MC.map((c, i) =>
      `<button data-nc="${i}" style="background:${c};${i === (n.c || 0) ? 'border-color:var(--ink)' : ''}"></button>`).join('')}</div>
    <div class="field" style="margin-top:4px"><label>اتجاه فروع هذه العقدة</label>
      <div class="segs" id="nDir">
        <button class="seg ${!n.d ? 'on' : ''}" data-nd="">كالخريطة</button>
        <button class="seg ${n.d === 'h' ? 'on' : ''}" data-nd="h">بجانبها</button>
        <button class="seg ${n.d === 'v' ? 'on' : ''}" data-nd="v">تحتها</button>
      </div></div>
    <div class="sheetrow">
      <button class="btn pri" data-nn="add">${ICON.plus} فرع منها</button>
      ${n.p ? `<button class="btn" data-nn="sib">${ICON.plus} فرع شقيق</button>` : ''}
      <button class="btn" data-nn="save">${ICON.chk} حفظ</button>
      ${n.p ? `<button class="danger" data-nn="del">حذف</button>` : ''}
    </div>
    <div class="sheetrow" style="margin-top:6px">
      ${kidsOf(m, n.id).length ? `<button class="btn" data-nn="fold">${isShut(n) ? 'افتح ما تحتها' : 'اطوِ ما تحتها'}</button>` : ''}
      <button class="btn" data-nn="link">${ICON.mind} ${n.lk ? 'غيّر الخريطة المرتبطة' : 'اربطها بخريطة'}</button>
      <button class="btn" data-nn="tree">${ICON.plus} اجعلها تشجيرًا مستقلًّا</button>
    </div>
    <div class="sheetrow" style="margin-top:6px">
      <button class="btn" data-nn="note">${ICON.pen} اجعلها فائدة</button>
      <button class="btn" data-nn="reset">أعد ترتيبها تلقائيًّا</button>
      <button class="btn" onclick="closeSheet()">إغلاق</button>
    </div>`, el => {
    let col = n.c || 0, ndir = n.d || '';
    el.addEventListener('click', ev => {
      const db = ev.target.closest('[data-nd]');
      if (db) { ndir = db.dataset.nd;
        el.querySelectorAll('[data-nd]').forEach(x => x.classList.toggle('on', x === db)); return; }
      const cb = ev.target.closest('[data-nc]');
      if (cb) { col = +cb.dataset.nc;
        el.querySelectorAll('[data-nc]').forEach(x => x.style.borderColor = (x === cb ? 'var(--ink)' : 'transparent')); return; }
      const b = ev.target.closest('[data-nn]'); if (!b) return;
      const k = b.dataset.nn;
      const t = el.querySelector('#nT').value.trim();
      n.t = t || n.t; n.c = col;
      if (ndir) n.d = ndir; else delete n.d;
      if (k === 'add') { m.nodes.push({ id: uid('n'), p: n.id, t: 'فرع', c: col }); }
      else if (k === 'sib') { m.nodes.push({ id: uid('n'), p: n.p, t: 'فرع', c: col }); }
      else if (k === 'del') {
        const kill = new Set([n.id]);
        let grew = true;
        while (grew) { grew = false;
          m.nodes.forEach(x => { if (x.p && kill.has(x.p) && !kill.has(x.id)) { kill.add(x.id); grew = true; } }); }
        m.nodes = m.nodes.filter(x => !kill.has(x.id));
      } else if (k === 'reset') { m.nodes.forEach(x => { delete x.fx; delete x.fy; }); }
      else if (k === 'note') {
        quotes.unshift({ id: uid('q'), t: n.t, src: m.name, c: 0, pin: 0, ts: Date.now() });
        saveQuotes(); toast('أُضيفت إلى الاقتباسات');
      }
      else if (k === 'fold') { n.z = !n.z; }
      else if (k === 'link') { saveMinds(); closeSheet(); linkSheet(m.id, n.id); return; }
      else if (k === 'tree') {
        /* الفرع يصير خريطة قائمة بذاتها، وتبقى العقدة بابًا إليها */
        const kill = underOf(m, n.id);
        const sub = { id: uid('mm'), name: n.t || 'تشجير', at: Date.now(), dir: m.dir || 'h', sec: m.sec || '',
          nodes: [{ id: 'root', p: null, t: n.t || 'تشجير', c: n.c || 0 }] };
        const map = { [n.id]: 'root' };
        kill.forEach(id => map[id] = uid('n'));
        kill.forEach(id => { const o = m.nodes.find(x => x.id === id); if (!o) return;
          sub.nodes.push({ id: map[id], p: map[o.p] || 'root', t: o.t, c: o.c, d: o.d, lk: o.lk }); });
        m.nodes = m.nodes.filter(x => !kill.includes(x.id));
        n.lk = sub.id; delete n.z;
        minds.unshift(sub); saveMinds(); closeSheet(); render();
        toast('صار تشجيرًا مستقلًّا — والعقدة بابه'); return;
      }
      saveMinds(); closeSheet(); render();
    });
  });
}

/* ربط عقدة بخريطة أخرى */
function linkSheet(mid, nid) {
  const m = findMind(mid); if (!m) return;
  const n = m.nodes.find(x => x.id === nid); if (!n) return;
  sheet(`<h3>اربط العقدة بخريطة</h3>
    <p class="mkempty">تصير العقدة بابًا: ضغطة تفتح الخريطة الأخرى، فتترابط أفكارك بلا تكرار.</p>
    <div class="rows" style="display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto">
      ${n.lk ? `<button class="tile" data-lk=""><div class="ic">${ICON.chk}</div><div><b>فكّ الارتباط</b></div></button>` : ''}
      ${minds.filter(x => x.id !== mid).map(x => `<button class="tile" data-lk="${x.id}">
        <div class="ic">${ICON.mind}</div><div><b>${esc(x.name)}</b><small>${AR(x.nodes.length)} عقدة</small></div></button>`).join('')}
      <button class="tile" data-lk="__new"><div class="ic">${ICON.plus}</div>
        <div><b>خريطة جديدة باسم العقدة</b></div></button>
    </div>`, el => {
    el.addEventListener('click', ev => {
      const b = ev.target.closest('[data-lk]'); if (!b) return;
      const v = b.dataset.lk;
      if (v === '__new') { const nm = newMind(n.t || 'خريطة'); nm.sec = m.sec || ''; n.lk = nm.id; }
      else n.lk = v || '';
      saveMinds(); closeSheet(); render();
      toast(n.lk ? 'ارتبطت' : 'فُكّ الارتباط');
    });
  });
}
/* ---------- السحب ---------- */
function bindMind() {
  const wrap = document.getElementById('mindWrap'); if (!wrap) return;
  const mid = wrap.dataset.id, m = findMind(mid); if (!m) return;
  const b = mindBounds(m);
  /* الخريطة العموديّة أصلها في الوسط — فنوسّط النظر إليه */
  if ((m.dir || 'h') === 'v') {
    const max = wrap.scrollWidth - wrap.clientWidth;
    if (max > 0) { wrap.scrollLeft = -max / 2; if (wrap.scrollLeft === 0) wrap.scrollLeft = max / 2; }
  }
  let drag = null;
  wrap.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.mfold')) return;          /* زرّ الطيّ ليس سحبًا */
    const el = ev.target.closest('.mnode'); if (!el) return;
    const n = m.nodes.find(x => x.id === el.dataset.nid); if (!n) return;
    drag = { el, n, sx: ev.clientX, sy: ev.clientY, moved: false,
      x0: (n.fx != null ? n.fx : n._x), y0: (n.fy != null ? n.fy : n._y) };
    el.setPointerCapture(ev.pointerId);
  });
  wrap.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
    drag.moved = true;
    drag.n.fx = drag.x0 - dx;          /* اتجاه اليمين إلى اليسار */
    drag.n.fy = drag.y0 + dy;
    const p = nodeXY(drag.n, b);
    drag.el.style.right = p.x + 'px'; drag.el.style.top = p.y + 'px';
    const svg = document.querySelector('.mindsvg'); if (svg) svg.innerHTML = mindLines(m, b);
  });
  const up = ev => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) { saveMinds(); return; }
    if (d.n.lk && findMind(d.n.lk)) { location.hash = '#/mind/' + d.n.lk; return; }
    nodeSheet(mid, d.n.id);
  };
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', () => { drag = null; });
}

/* ---------- تصدير صورة ---------- */
function mindPNG(mid) {
  const m = findMind(mid); if (!m) return;
  layout(m);
  const b = mindBounds(m), S2 = 2;
  const cv = document.createElement('canvas');
  cv.width = b.w * S2; cv.height = b.h * S2;
  const x = cv.getContext('2d');
  x.scale(S2, S2);
  x.fillStyle = '#fbf9f4'; x.fillRect(0, 0, b.w, b.h);
  /* الخطوط */
  m.nodes.filter(n => n.p).forEach(n => {
    const par = m.nodes.find(y => y.id === n.p); if (!par) return;
    const a = nodeXY(par, b), c = nodeXY(n, b);
    x.beginPath();
    if (edir(m, par) === 'v') {
      const ax = b.w - (a.x + NW / 2), ay = a.y + NH;
      const cx = b.w - (c.x + NW / 2), cy = c.y, my = (ay + cy) / 2;
      x.moveTo(ax, ay); x.bezierCurveTo(ax, my, cx, my, cx, cy);
    } else {
      const ax = b.w - a.x - NW, ay = a.y + NH / 2;
      const cx = b.w - c.x, cy = c.y + NH / 2, mx = (ax + cx) / 2;
      x.moveTo(ax, ay); x.bezierCurveTo(mx, ay, mx, cy, cx, cy);
    }
    x.strokeStyle = MC[par.c || 0]; x.globalAlpha = .5; x.lineWidth = 2; x.stroke(); x.globalAlpha = 1;
  });
  /* العقد */
  m.nodes.forEach(n => {
    const p = nodeXY(n, b), w = NW, h = NH;
    const px = b.w - p.x - w, py = p.y;
    x.fillStyle = MC[n.c || 0];
    rrect(x, px, py, w, h, 10); x.fill();
    x.fillStyle = '#fff';
    x.font = (n.p ? '600 13px' : '800 15px') + ' Tajawal, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    let t = n.t || '';
    while (x.measureText(t).width > w - 16 && t.length > 3) t = t.slice(0, -2);
    if (t !== n.t) t += '…';
    x.fillText(t, px + w / 2, py + h / 2);
  });
  cv.toBlob(bl => { if (bl) saveBlob(bl, (m.name || 'خريطة') + '.png', true); }, 'image/png');
}

/* ---------- الأحداث ---------- */
document.addEventListener('click', ev => {
  const f = ev.target.closest('[data-fold]');
  if (f) { ev.preventDefault(); ev.stopPropagation();
    const wrap = document.getElementById('mindWrap'); if (!wrap) return;
    const m = findMind(wrap.dataset.id); if (!m) return;
    const n = m.nodes.find(x => x.id === f.dataset.fold); if (!n) return;
    n.z = !n.z; saveMinds(); render(); return; }
  const sm = ev.target.closest('[data-secmind]');
  if (sm) { const sec = findSec(sm.dataset.secmind); if (!sec) return;

    m.nodes.forEach(n => { if (n.p && kidsOf(m, n.id).length) n.z = 1; });

  } else if (k === 'openall') {
    const m = findMind(b.dataset.id); if (!m) return;
    m.nodes.forEach(n => delete n.z); saveMinds(); render();
  } else if (k === 'png') mindPNG(b.dataset.id);
  else if (k === 'fit') {
    const m = findMind(b.dataset.id); if (!m) return;
    m.nodes.forEach(n => { delete n.fx; delete n.fy; }); saveMinds(); render();
  }
});


/* ================================================================
   التأريخ والإنجازات — سجلّ لكل ما صنعتَه، ولوحة لما أنجزته
   ================================================================ */

/* الوقت مستخرَج من المعرّف نفسه، فحتى القديم له تاريخ */
function uidAt(id) {
  const m = /([0-9a-z]{8})[0-9a-z]{3}$/.exec(String(id || ''));
  if (!m) return 0;
  const t = parseInt(m[1], 36);
  return (t > 1483228800000 && t < 4102444800000) ? t : 0;   /* بين ٢٠١٧ و٢١٠٠ */
}
let nat = S.get('nat', {});                 /* متى كُتبت كل فائدة */
const saveNat = () => S.set('nat', nat);
function touchNote(id) {
  const n = nat[id] || {};
  if (!n.a) n.a = Date.now();
  n.u = Date.now(); nat[id] = n; saveNat();
}
const dayKey = t => ymd(new Date(t));

/* ---------- جمع كل الأحداث ---------- */
function timeline() {
  const ev = [];
  const add = (k, t, title, sub, hash) => { if (t) ev.push({ k, t, title, sub: sub || '', hash: hash || '#/' }); };
  const KD = done();

  allItems().forEach(r => {
    const it = r.it, where = r.sec.name + (r.sub ? ' · ' + r.sub.name : '');
    add('item', it.ts || uidAt(it.id), it.name, 'أضفته إلى ' + where, '#/i/' + it.id);
    const d = KD[it.id];
    if (d) add('done', typeof d === 'number' ? d : (it.ts || uidAt(it.id)), it.name, 'أتممتَه', '#/i/' + it.id);
    const nt = notes[it.id];
    if (nt) add('note', (nat[it.id] && nat[it.id].a) || it.ts || uidAt(it.id), it.name,
      noteText(nt).slice(0, 90), '#/i/' + it.id);
  });
  tree.forEach(s => add('sec', uidAt(s.id), s.name, 'قسم جديد في مكتبتك', '#/s/' + s.id));

  const H = S.get('hl', {});
  Object.keys(H).forEach(key => (H[key] || []).forEach(h => {
    const id = String(key).split(':')[0], r = findItem(id);
    add('hl', uidAt(h.id), r ? r.it.name : 'تظليل',
      (h.txt || noteText(h.n || '') || 'موضع مظلَّل').slice(0, 90), r ? '#/i/' + id : '#/notes');
  }));
  quotes.forEach(q => add('quote', q.ts || q.at || uidAt(q.id), noteText(q.t).slice(0, 80), q.src || 'اقتباس', '#/quotes'));
  Object.keys(marks || {}).forEach(id => (marks[id] || []).forEach(m => {
    const r = findItem(id);
    add('mark', m.at || uidAt(m.id), r ? r.it.name : 'علامة',
      (m.p ? 'صفحة ' + AR(m.p) : arTime(m.t || 0)) + (noteText(m.n || '') ? ' — ' + noteText(m.n).slice(0, 70) : ''),
      '#/i/' + id);
  }));
  const TX = S.get('tx', {});
  Object.keys(TX).forEach(id => { const r = findItem(id);
    add('tx', TX[id].at, r ? r.it.name : 'تفريغ', 'فرّغتَه — ' + AR((TX[id].segs || []).length) + ' مقطعًا', '#/i/' + id); });
  (typeof writes !== 'undefined' ? writes : []).forEach(e =>
    add('boh', e.at || uidAt(e.id), e.ttl || wkName(e.k), noteText(e.h || '').slice(0, 90),
      BOH_KINDS.includes(e.k) ? '#/boh' : '#/notes'));
  (typeof minds !== 'undefined' ? minds : []).forEach(m =>
    add('mind', m.at || uidAt(m.id), m.name, AR((m.nodes || []).length) + ' عقدة', '#/mind/' + m.id));
  (cards || []).forEach(c => add('card', c.ts || uidAt(c.id), 'بطاقة', (c.t || c.src || '').slice(0, 70), '#/cards'));

  /* المهام المنجَزة — تواريخها محفوظة بيومها */
  Object.keys(plan.done || {}).forEach(k => {
    const ids = Object.keys(plan.done[k] || {});
    if (!ids.length) return;
    const t = new Date(k + 'T12:00:00').getTime();
    ids.forEach(id => {
      const task = (plan.tasks || []).find(x => x.id === id);
      add('task', t, task ? task.title : 'مهمة', 'أنجزتَها', '#/plan');
    });
  });
  (plan.goals || []).forEach(g => {
    const st = g.steps || [];
    if (st.length && st.every(x => x.done)) add('goal', uidAt(g.id), g.title, 'اكتمل هدفك', '#/plan/goals');
  });
  return ev.sort((a, b) => b.t - a.t);
}
const TKIND = { item: ['أضفت', 'lib'], done: ['أتممت', 'chk'], note: ['فائدة', 'pen'], hl: ['تظليل', 'pen'],
  quote: ['اقتباس', 'quote'], mark: ['علامة', 'pin'], tx: ['تفريغ', 'text'], boh: ['بوح', 'boh'],
  mind: ['خريطة', 'mind'], card: ['بطاقة', 'card'], task: ['مهمة', 'cal'], goal: ['هدف', 'star'], sec: ['قسم', 'lib'] };

/* ---------- إحصاء وسلاسل ---------- */
function stats() {
  const ev = timeline();
  const days = {};
  ev.forEach(e => { const k = dayKey(e.t); days[k] = (days[k] || 0) + 1; });
  /* السلسلة: أيام متتالية فيها أثر */
  let cur = 0, best = 0, run = 0;
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < 400; i++) {
    const k = ymd(d);
    if (days[k]) { run++; best = Math.max(best, run); if (i === cur) cur = run; }
    else { if (i === 0) { /* اليوم فارغ: تُحسب السلسلة من الأمس */ } else run = 0; }
    if (!days[k] && i > 0 && cur === 0 && run === 0 && i > 1) { /* لا شيء */ }
    d.setDate(d.getDate() - 1);
  }
  /* حساب السلسلة الحالية بدقّة */
  cur = 0; const t = new Date(); t.setHours(12, 0, 0, 0);
  if (!days[ymd(t)]) t.setDate(t.getDate() - 1);
  while (days[ymd(t)]) { cur++; t.setDate(t.getDate() - 1); }
  const wk = Date.now() - 7 * 864e5;
  const inWk = k => ev.filter(e => e.k === k && e.t >= wk).length;
  const KD = done(), items = allItems();
  /* صفحات قرأتها وساعات سمعتها */
  const PP = S.get('ppos', {}), PS = S.get('pos', {});
  let pages = 0, secsHeard = 0;
  items.forEach(r => {
    const it = r.it;
    if (it.type === 'pdf') {
      const q = PP[it.id] || {};
      let n = Math.max(q.max || 0, q.p || 0);
      if (KD[it.id] && q.n) n = q.n;
      pages += n || 0;
    } else if (it.type === 'audio' || it.type === 'video') {
      if (KD[it.id] && it.dur) secsHeard += it.dur;
      else secsHeard += Math.min(PS[it.id] || 0, it.dur || PS[it.id] || 0);
    }
  });
  return { ev, days, cur, best, pages, hours: secsHeard / 3600,
    doneN: items.filter(r => KD[r.it.id]).length, itemsN: items.length,
    notesN: Object.keys(notes).length,
    hlN: Object.values(S.get('hl', {})).reduce((a, x) => a + (x || []).length, 0),
    week: { note: inWk('note'), hl: inWk('hl'), done: inWk('done'), task: inWk('task'), boh: inWk('boh') } };
}
const BADGES = [
  ['أوّل خطوة', s => s.itemsN >= 1, 'أضفت أوّل عنصر'],
  ['قارئ', s => s.doneN >= 1, 'أتممت أوّل عنصر'],
  ['مواظب', s => s.doneN >= 10, 'أتممت عشرة'],
  ['مجتهد', s => s.doneN >= 50, 'أتممت خمسين'],
  ['قيّد العلم', s => s.notesN >= 10, 'عشر فوائد'],
  ['خزانة فوائد', s => s.notesN >= 100, 'مئة فائدة'],
  ['مظلِّل', s => s.hlN >= 50, 'خمسون تظليلًا'],
  ['سبعة أيّام', s => s.best >= 7, 'سلسلة أسبوع'],
  ['شهر كامل', s => s.best >= 30, 'سلسلة ثلاثين يومًا'],
  ['مفرِّغ', s => Object.keys(S.get('tx', {})).length >= 1, 'فرّغت مقطعًا'],
  ['رسّام أفكار', s => (typeof minds !== 'undefined' ? minds.length : 0) >= 1, 'أنشأت خريطة'],
  ['بائح', s => (typeof writes !== 'undefined' ? writes.filter(w => BOH_KINDS.includes(w.k)).length : 0) >= 5, 'خمس تدوينات'],
  ['مئة صفحة', s => s.pages >= 100, 'قرأت مئة صفحة'],
  ['ألف صفحة', s => s.pages >= 1000, 'قرأت ألف صفحة'],
  ['عشر ساعات', s => s.hours >= 10, 'سمعت عشر ساعات']
];

/* ---------- خانة الإنجازات (داخل المكتبة وفي التأريخ) ---------- */
function achBox(full) {
  const s = stats();
  const pct = s.itemsN ? Math.round(s.doneN / s.itemsN * 100) : 0;
  const got = BADGES.filter(b => { try { return b[1](s); } catch (e) { return false; } });
  return `<section class="achbox">
    <div class="achtop">
      <div class="ring" style="--p:${pct}"><span>${AR(pct)}٪</span></div>
      <div class="achnum">
        <b>${AR(s.doneN)} من ${AR(s.itemsN)}</b>
        <small>أتممتَه من مكتبتك</small>
      </div>
      <div class="achnum">
        <b>${AR(s.cur)} ${s.cur === 1 ? 'يوم' : 'أيام'}</b>
        <small>سلسلتك الآن · أطولها ${AR(s.best)}</small>
      </div>
      ${s.pages ? `<div class="achnum"><b>${AR(s.pages)} صفحة</b><small>قرأتها</small></div>` : ''}
      ${s.hours >= 0.02 ? `<div class="achnum"><b>${s.hours >= 1 ? AR(s.hours.toFixed(1)).replace('.', '٫') + ' ساعة' : AR(Math.round(s.hours * 60)) + ' دقيقة'}</b><small>سمعتها</small></div>` : ''}
      ${full ? '' : `<a class="chip" href="#/time">التأريخ كلّه</a>
        <button class="ibtn" data-achx="1" title="أخفِ خانة الإنجاز">×</button>`}
    </div>
    ${adv()?heatStrip(s.days):''}
    <div class="achwk">
      <span>هذا الأسبوع:</span>
      ${[['فائدة', s.week.note], ['تظليل', s.week.hl], ['إتمام', s.week.done], ['مهمة', s.week.task], ['بوح', s.week.boh]]
        .filter(x => x[1]).map(([t, n]) => `<i>${AR(n)} ${t}</i>`).join('') || '<i>لم تبدأ بعد — ابدأ بشيء صغير</i>'}
    </div>
    ${got.length && adv() ? `<div class="badges">${BADGES.map(b => {
      const on = got.includes(b);
      return `<span class="abadge ${on ? 'on' : ''}" title="${esc(b[2])}">${esc(b[0])}</span>`;
    }).join('')}</div>` : ''}
  </section>`;
}
function heatStrip(days) {
  const cells = [];
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < 119; i++) {                     /* ١٧ أسبوعًا */
    const k = ymd(d), n = days[k] || 0;
    cells.push(`<i class="h${n ? (n > 6 ? 4 : n > 3 ? 3 : n > 1 ? 2 : 1) : 0}" title="${k} · ${AR(n)}"></i>`);
    d.setDate(d.getDate() - 1);
  }
  return `<div class="heat">${cells.join('')}</div>`;
}

let tkFilter = 'all', tkMore = 120;
function vTime() {

    : `<div class="empty">لا شيء في هذا التصنيف بعد.</div>`}`;
}
function dayName(k) {
  const d = new Date(k + 'T12:00:00');
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'اليوم';
  if (diff === 1) return 'أمس';
  if (diff === 2) return 'قبل يومين — ' + DAYS[d.getDay()];
  if (diff < 7) return 'قبل ' + AR(diff) + ' أيام — ' + DAYS[d.getDay()];
  return DAYS[d.getDay()] + ' ' + AR(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + AR(d.getFullYear());
}

function rdEnter(box) {
  box = box || document.getElementById('pdfbox'); if (!box) return;
  RD.box = box; RD.on = true;
  box.classList.add('full');
  document.body.classList.add('reading');
  document.body.classList.remove('bars');
  rdBars(); layoutPdf(box, { keep: true });
  rdTip('اضغط على الصفحة لتظهر الأدوات');
}
/* العودة إلى وضع القراءة بعد إعادة بناء الصفحة — بلا وميض ولا قفزة */
function rdReenter(box) {
  RD.box = box; RD.on = true;
  box.classList.add('full');
  document.body.classList.add('reading');
  rdBars();
  layoutPdf(box, { restore: true });
}
function rdExit() {
  const box = RD.box || document.getElementById('pdfbox');
  RD.on = false;
  document.body.classList.remove('reading', 'bars');
  if (box) { box.classList.remove('full'); layoutPdf(box, { keep: true }); }
}
function rdToggleBars() {
  if (!RD.on) return;
  const on = !document.body.classList.contains('bars');
  document.body.classList.toggle('bars', on);
  if (on) rdBars();
}
/* ضغطة على الصفحة تُظهر الأدوات وتُخفيها — ولا تتعارض مع التظليل */
document.addEventListener('click', ev => {
  if (!RD.on) return;
  if (ev.target.closest('.rdtop,.rdbot,.sheet,.seltool,.hrect,mark.hl,.rdtip')) return;
  const box = ev.target.closest('.pdfbox'); if (!box) return;
  if (drawOn) return;                      /* أثناء التظليل لا نزعجه */
  rdToggleBars();
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-rd]'); if (!b) return;
  const k = b.dataset.rd, box = RD.box || document.getElementById('pdfbox');
  const it = box ? (findItem(box.dataset.item) || {}).it : null;
  if (k === 'exit') { rdExit(); return; }
  if (k === 'draw') {
    const t = document.getElementById('drawTgl'); if (t) t.click();
    rdBars(); rdTip(drawOn ? 'التظليل يعمل — مرّر على السطر' : 'أُوقف التظليل');
    return;
  }
  if (k === 'bm') {
    const add = document.querySelector('.pdfnav [data-mk="padd"]');
    if (add) add.click(); else if (it) {
      const p = nowPage();
      if (p != null) { if (!marks[it.id]) marks[it.id] = [];
        if (!marks[it.id].some(x => x.p === p)) { marks[it.id].push({ id: uid('m'), p, n: '', c: curColor || 'y', at: Date.now() }); saveMarks(); }
        rdTip('علامة على صفحة ' + AR(p)); }
    }
    return;
  }
  if (k === 'jump') { const j = document.getElementById('pgNow'); if (j) j.click(); return; }
  if (k === 'page') { rdPageNotes(); return; }
  if (k === 'more') { rdMore(); return; }
});
/* فوائد هذه الصفحة وتظليلاتها */
function rdPageNotes() {
  const box = RD.box || document.getElementById('pdfbox'); if (!box) return;
  const id = box.dataset.item, p = nowPage() || 1;
  const list = (S.get('hl', {})[id] || []).filter(h => h.t === 'pdf' && h.p === p);
  const mk = (marks[id] || []).filter(m => m.p === p);
  sheet(`<h3>صفحة ${AR(p)}</h3>
    ${list.length ? `<div class="mklist">${list.map(h => `
      <div class="mkrow" style="--mc:${HCOL[h.c] || HCOL.y}">
        <span class="mktime">تظليل</span>
        <div class="mktext">${h.n ? noteHtml(h.n) : '<i>بلا فائدة</i>'}</div>
        <button class="lnk" data-rdh="${h.id}">${ICON.pen}</button>
      </div>`).join('')}</div>` : '<p class="mkempty">لا تظليل في هذه الصفحة بعد.</p>'}
    ${mk.length ? `<p class="mkempty">وفيها ${AR(mk.length)} علامة مرجعية.</p>` : ''}
    <div class="sheetrow">
      <button class="btn pri" data-rdn="note">${ICON.pen} فائدة على الصفحة</button>
      <button class="btn" onclick="closeSheet()">إغلاق</button></div>`, el => {
    el.addEventListener('click', ev => {
      const h = ev.target.closest('[data-rdh]');
      if (h) { closeSheet(); openHl(id, h.dataset.rdh); return; }
      const n = ev.target.closest('[data-rdn]');
      if (n) { closeSheet(); rdPageNote(id, p); }
    });
  });
}
/* فائدة مرتبطة بالصفحة نفسها */
function rdPageNote(id, p) {
  if (!marks[id]) marks[id] = [];
  let m = marks[id].find(x => x.p === p);
  if (!m) { m = { id: uid('m'), p, n: '', c: curColor || 'y', at: Date.now() }; marks[id].push(m); saveMarks(); }
  pgSheet(findItem(id).it, m);
}
function rdMore() {
  const box = RD.box || document.getElementById('pdfbox');
  const id = box ? box.dataset.item : '';
  const r = id ? findItem(id) : null;
  sheet(`<h3>أدوات القراءة</h3>
    <div class="rows" style="display:flex;flex-direction:column;gap:8px">
      <button class="tile" data-rdm="marks"><div class="ic">${ICON.bm}</div>
        <div><b>علاماتي المرجعية</b><small>${AR(((marks[id] || []).length))} علامة</small></div></button>
      <button class="tile" data-rdm="wide"><div class="ic">${ICON.ext}</div>
        <div><b>عرض الصفحة</b><small>ملء العرض أو مريح للقراءة</small></div></button>
      <button class="tile" data-rdm="theme"><div class="ic">${ICON.pen}</div>
        <div><b>لون الصفحة</b><small>أبيض · شامواه · ليليّ</small></div></button>
      <button class="tile" data-rdm="exit"><div class="ic">${ICON.back}</div>
        <div><b>خروج من القراءة</b><small>العودة إلى صفحة الملف</small></div></button>
    </div>`, el => {
    el.addEventListener('click', ev => {
      const b = ev.target.closest('[data-rdm]'); if (!b) return;
      const k = b.dataset.rdm;
      closeSheet();
      if (k === 'exit') rdExit();
      else if (k === 'marks') { rdExit(); setTimeout(() => {
        const s = document.querySelector('.mkbox'); if (s) s.scrollIntoView({ behavior: 'smooth' }); }, 300); }
      else if (k === 'wide') {
        const w = !S.get('rdwide', false); S.set('rdwide', w);
        document.body.classList.toggle('rdwide', w);
        if (box) layoutPdf(box, { keep: true });
        rdTip(w ? 'ملء العرض' : 'عرض مريح');
      } else if (k === 'theme') {
        const cur = root.dataset.theme || 'light';
        const i = THEMES.findIndex(x => x[0] === cur);
        const nx = THEMES[(i + 1) % THEMES.length];
        setTheme(nx[0]); rdTip(nx[1]);
      }
    });
  });
}


/* ================= قوالب البطاقات ================= */
const CF={  /* أسماء الخطوط */
  almarai:'"Almarai",sans-serif', tajawal:'"Tajawal",sans-serif', cairo:'"Cairo",sans-serif',
  amiri:'"Amiri",serif', ruqaa:'"Aref Ruqaa",serif', kufi:'"Reem Kufi",sans-serif',
  messiri:'"El Messiri",sans-serif', changa:'"Changa",sans-serif', markazi:'"Markazi Text",serif',
  notokufi:'"Noto Kufi Arabic",sans-serif', rakkas:'"Rakkas",serif', lalezar:'"Lalezar",cursive',
  readex:'"Readex Pro",sans-serif', plex:'"IBM Plex Sans Arabic",sans-serif',
  alex:'"Alexandria",sans-serif', kufam:'"Kufam",sans-serif', sch:'"Scheherazade New",serif',
  ruqaaink:'"Aref Ruqaa Ink",serif', nastaliq:'"Noto Nastaliq Urdu",serif', katibeh:'"Katibeh",serif',
  mirza:'"Mirza",serif', gulzar:'"Gulzar",serif', qahiri:'"Qahiri",serif', jomhuria:'"Jomhuria",serif',
  marhey:'"Marhey",sans-serif', vibes:'"Vibes",serif', blaka:'"Blaka",serif', lateef:'"Lateef",serif',
  amiriq:'"Amiri Quran",serif', harmattan:'"Harmattan",sans-serif', mada:'"Mada",sans-serif',
  baloo:'"Baloo Bhaijaan 2",sans-serif', rubik:'"Rubik",sans-serif'
};
function shade2(hex,amt){ const c=hex.replace('#','');
  let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  const f=v=>Math.max(0,Math.min(255,Math.round(v+amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function wrapT(ctx,text,maxW){
  const out=[];
  for(const para of String(text).split(/\n/)){
    const words=para.trim().split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(''); continue; }
    let cur=[];
    for(const w of words){
      const t=cur.concat(w).join(' ');
      if(cur.length&&ctx.measureText(t).width>maxW){ out.push(cur.join(' ')); cur=[w]; }
      else cur.push(w);
    }
    out.push(cur.join(' '));
  }
  return out;
}
/* يكبّر الخط حتى يملأ الصندوق */
function fitT(ctx,text,bw,bh,opt){
  const o=Object.assign({max:120,min:14,lh:1.6,weight:800,fam:CF.almarai},opt||{});
  for(let s=o.max;s>=o.min;s--){
    ctx.font=`${o.weight} ${s}px ${o.fam}`;
    const lines=wrapT(ctx,text,bw), lh=s*o.lh;
    const widest=lines.reduce((m,l)=>Math.max(m,ctx.measureText(l).width),0);
    if(lines.length*lh<=bh&&widest<=bw) return {s,lines,lh};
  }
  ctx.font=`${o.weight} ${o.min}px ${o.fam}`;
  return {s:o.min,lines:wrapT(ctx,text,bw),lh:o.min*o.lh};
}
function drawT(ctx,fit,x,y,w,opt){
  const o=Object.assign({align:'center',color:'#111',weight:800,fam:CF.almarai,valign:'top',h:0},opt||{});
  ctx.font=`${o.weight} ${fit.s}px ${o.fam}`;
  ctx.fillStyle=o.color; ctx.direction='rtl'; ctx.textBaseline='alphabetic';
  let yy=y+fit.s;
  if(o.valign==='middle') yy=y+(o.h-fit.lines.length*fit.lh)/2+fit.s;
  ctx.textAlign=o.align==='center'?'center':(o.align==='right'?'right':'left');
  const ax=o.align==='center'? x+w/2 : (o.align==='right'? x+w : x);
  fit.lines.forEach(l=>{ ctx.fillText(l,ax,yy); yy+=fit.lh; });
  return yy;
}
function quoteMark(ctx,x,y,size,color,close){
  ctx.save(); ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`900 ${size}px Georgia,"Times New Roman",serif`;
  ctx.fillText(close?'”':'“',x,y); ctx.restore();
}
function noise2(ctx,W,H,a){
  const n=ctx.createImageData(90,90);
  for(let i=0;i<n.data.length;i+=4){ const v=200+Math.random()*55;
    n.data[i]=n.data[i+1]=n.data[i+2]=v; n.data[i+3]=a; }
  const t=document.createElement('canvas'); t.width=t.height=90;
  t.getContext('2d').putImageData(n,0,0);
  const p=ctx.createPattern(t,'repeat');
  ctx.save(); ctx.fillStyle=p; ctx.fillRect(0,0,W,H); ctx.restore();
}
function rrect(ctx,x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circleImg(ctx,img,cx,cy,r,ring){
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.closePath(); ctx.clip();
  if(img) ctx.drawImage(img,cx-r,cy-r,r*2,r*2); else { ctx.fillStyle='#d8d2c6'; ctx.fillRect(cx-r,cy-r,r*2,r*2); }
  ctx.restore();
  if(ring){ ctx.save(); ctx.strokeStyle=ring; ctx.lineWidth=r*0.07; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke(); ctx.restore(); }
}
function cover(ctx,img,x,y,w,h){
  if(!img){ ctx.fillStyle='#cfc8bb'; ctx.fillRect(x,y,w,h); return; }
  const r=Math.max(w/img.width,h/img.height), iw=img.width*r, ih=img.height*r;
  ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}

{id:'capsule', n:'كبسولة الصورة', ratio:1, photo:1, logo:1, draw(ctx,W,H,d,img,logo){
  ctx.fillStyle='#e6ded3'; ctx.fillRect(0,0,W,H); noise2(ctx,W,H,26);
  ctx.save(); ctx.globalAlpha=.25; const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.5,'#ded5c8'); g.addColorStop(1,'#ffffff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
  /* الكبسولة */
  const cw=W*0.27, ch=H*0.62, cx=W*0.10, cy=H*0.18, r=cw/2;
  ctx.save(); rrect(ctx,cx,cy,cw,ch,r); ctx.clip();
  if(img) cover(ctx,img,cx,cy,cw,ch);
  else { const gg=ctx.createLinearGradient(cx,cy,cx,cy+ch);
    gg.addColorStop(0,'#f6a641'); gg.addColorStop(1,'#5a2f1a'); ctx.fillStyle=gg; ctx.fillRect(cx,cy,cw,ch); }
  ctx.restore();
  /* اللوجو */
  const lx=W*0.86, ly=H*0.13;
  if(logo){ const lw=W*0.16, lh2=lw*(logo.height/logo.width||0.55);
    ctx.drawImage(logo,lx-lw/2,ly-lh2/2,lw,lh2); }
  else if(d.brand){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl'; ctx.textBaseline='middle';
    ctx.fillStyle=d.logoColor||'#7a2d1c';
    ctx.font=`700 ${W*(d.logoSize||0.075)}px ${CF[d.logoFont]||CF.ruqaa}`;
    ctx.fillText(d.brand,lx,ly); ctx.restore(); }
  if(d.tagline){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl';
    ctx.fillStyle=d.logoColor||'#7a2d1c'; ctx.font=`700 ${W*0.024}px ${CF.cairo}`;
    ctx.fillText(d.tagline,lx,ly+H*0.075); ctx.restore(); }
  /* النص */
  const bw=W*0.5, bx=W*0.38, by=H*0.34, bh=H*0.34;
  const f=fitT(ctx,d.text,bw,bh,{max:W*0.045,min:11,lh:1.85,weight:400,fam:CF.plex});
  drawT(ctx,f,bx,by,bw,{align:'right',color:'#2a1f18',weight:400,fam:CF.plex,valign:'middle',h:bh});
  /* شريط الاسم */
  if(d.sub||d.author){
    const pw=W*0.34, px=W*0.56, py=H*0.845, ph=H*0.045;
    ctx.fillStyle='#2f241c'; rrect(ctx,px,py,pw,ph,ph*0.18); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`800 ${W*0.028}px ${CF.cairo}`;
    ctx.textAlign='center'; ctx.direction='rtl'; ctx.textBaseline='middle';
    ctx.fillText(d.sub||'',px+pw/2,py+ph/2);
    ctx.textBaseline='alphabetic';
    if(d.author){ ctx.fillStyle='#2f241c'; ctx.font=`700 ${W*0.026}px ${CF.cairo}`;
      ctx.fillText(d.author,px+pw/2,py+ph+H*0.045); }
  }
}}

function renderTpl(cv,tplId,d,img){
  const t=TPLS.find(x=>x.id===tplId)||TPLS[0];
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  t.draw(ctx,cv.width,cv.height,d,img);
  return t;
}
/* ============ عائلة «الورقي» — خلفية ورقية + لوجو أعلى اليمين + شريط أسفل ============ */
function paperBG(ctx,W,H,tone){
  ctx.fillStyle=tone||'#e9e2d8'; ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(.5,'rgba(0,0,0,.05)'); g.addColorStop(1,'rgba(255,255,255,.4)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  noise2(ctx,W,H,26);
}
function logoTR(ctx,W,H,d,logo,x,y){
  x=x==null?W*0.86:x; y=y==null?H*0.12:y;
  const col=d.logoColor||d.acc||'#7a2d1c';
  if(logo){ const lw=W*(d.logoSize||0.15), lh=lw*(logo.height/logo.width||.6);
    ctx.drawImage(logo,x-lw/2,y-lh/2,lw,lh); }
  else if(d.brand){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl'; ctx.textBaseline='middle';
    ctx.fillStyle=col; ctx.font=`700 ${W*(d.logoSize||0.075)}px ${CF[d.logoFont]||CF.ruqaa}`;
    ctx.fillText(d.brand,x,y); ctx.restore(); }
  if(d.tagline){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl'; ctx.fillStyle=col;
    ctx.font=`700 ${W*0.024}px ${CF.cairo}`; ctx.fillText(d.tagline,x,y+H*0.072); ctx.restore(); }
}
function labelBox(ctx,W,H,d,right){
  if(!d.sub&&!d.author) return;
  const pw=W*0.30, px=right?W*0.62:W*0.08, py=H*0.855, ph=H*0.042;
  ctx.fillStyle=d.labelBg||'#3a2a22'; rrect(ctx,px,py,pw,ph,ph*0.16); ctx.fill();
  ctx.save(); ctx.textAlign='center'; ctx.direction='rtl'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font=`800 ${W*0.026}px ${CF.cairo}`;
  ctx.fillText(d.sub||'',px+pw/2,py+ph/2); ctx.restore();
  if(d.author){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl';
    ctx.fillStyle='#3a2a22'; ctx.font=`700 ${W*0.024}px ${CF.cairo}`;
    ctx.fillText(d.author,px+pw/2,py+ph+H*0.042); ctx.restore(); }
}

{id:'glass', n:'بطاقة زجاجية', ratio:1, photo:1, logo:1, draw(ctx,W,H,d,img,logo){
  if(img) cover(ctx,img,0,0,W,H); else { paperBG(ctx,W,H,d.paper||'#cfc9bd'); }
  ctx.fillStyle='rgba(240,236,228,.45)'; ctx.fillRect(0,0,W,H);
  /* حوافّ ورقية ممزّقة */
  const tear=(yBase,dir)=>{ ctx.beginPath(); ctx.moveTo(0,dir>0?0:H); 
    for(let x=0;x<=W;x+=W/22){ ctx.lineTo(x, yBase+dir*Math.sin(x/W*11)*H*0.012 + (Math.random()-.5)*H*0.006); }
    ctx.lineTo(W,dir>0?0:H); ctx.closePath(); ctx.fillStyle=d.paper||'#e9e2d8'; ctx.fill(); };
  tear(H*0.09,1); tear(H*0.91,-1);
  const cx=W*0.10, cy=H*0.19, cw=W*0.80, chh=H*0.62;

  ctx.fillStyle='rgba(255,255,255,.34)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=W*0.003; ctx.stroke(); ctx.restore();
  quoteMark(ctx,W*0.78,H*0.28,W*0.12,'#fff',true);
  const bw=cw*0.86,bx=cx+cw*0.07,by=cy+chh*0.18,bh=chh*0.6;
  const f=fitT(ctx,d.text,bw,bh,{max:W*0.04,min:10,lh:1.95,weight:400,fam:CF[d.font]||CF.amiri});
  drawT(ctx,f,bx,by,bw,{align:'center',color:d.ink||'#211d18',weight:400,fam:CF[d.font]||CF.amiri,valign:'middle',h:bh});
  if(d.sub){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl'; ctx.fillStyle='#4a453c';

  logoTR(ctx,W,H,d,logo,W*0.12,H*0.06);
}},
{id:'echo', n:'كلمة مكرّرة', ratio:1, photo:1, draw(ctx,W,H,d,img){
  paperBG(ctx,W,H,d.paper||'#e6e6e4');

  if(d.author){ ctx.save(); ctx.textAlign='center'; ctx.direction='rtl'; ctx.fillStyle='#3a3a3a';
    ctx.font=`800 ${W*0.032}px ${CF.cairo}`; ctx.fillText(d.author,W/2,H*0.85); ctx.restore(); }
}},

{id:'portrait', n:'نص وصورة الشيخ', ratio:4/5, photo:1, draw(ctx,W,H,d,img){

function drawImgIn(ctx,im,x,y,w,h,round,pan){
  ctx.save();
  if(round) rrect(ctx,x,y,w,h, round===1? Math.min(w,h)/2 : Math.min(w,h)*round);
  else ctx.rect(x,y,w,h);
  ctx.clip();
  if(im){
    const z=(pan&&pan.z)||1;
    const r=Math.max(w/im.width,h/im.height)*z, iw=im.width*r, ih=im.height*r;
    const px=(pan&&pan.x!=null)?pan.x:0.5, py=(pan&&pan.y!=null)?pan.y:0.5;
    ctx.drawImage(im, x+(w-iw)*px, y+(h-ih)*py, iw, ih);
  } else { ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(x,y,w,h); }
  ctx.restore();
}
async function c2Draw(cv,st){
  st=st||C2;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const im=await imgOf(st.img), lg=await imgOf(st.logo);
  const fr=(st===C2)? frameOf() : (st.frame||FRAME[st.tpl]||null);
  if(st.tpl==='free'){
    ctx.fillStyle=st.d.paper||'#14211e'; ctx.fillRect(0,0,W,H);
    if(im) drawImgIn(ctx,im,0,0,W,H,0,st.imgPan);
    if(st.d.dim) { ctx.fillStyle=`rgba(0,0,0,${st.d.dim})`; ctx.fillRect(0,0,W,H); }
  } else {
    const t=tplOf(st.tpl);
    const bleed=!fr;
    try{ t.draw(ctx,W,H,blankD(st.d), bleed? im : null, null); }catch(e){}
    if(fr&&im) drawImgIn(ctx,im,fr[0]*W,fr[1]*H,fr[2]*W,fr[3]*H,fr[4],st.imgPan);
  }
  if(lg){ const L=(st===C2)? logoBoxOf() : (st.logoBox||LOGOF[st.tpl]||[0.78,0.06,0.16]);
    const lw=L[2]*W, lh=lw*(lg.height/lg.width||0.6);
    ctx.drawImage(lg,L[0]*W,L[1]*H,lw,lh); }
  (st.layers||[]).forEach(L=>drawLayer(ctx,W,H,L));
}
function layerFont(L,W){ return `${L.italic?'italic ':''}${L.bold?800:400} ${W*(L.size||20)/400}px ${famOf(L.font||'cairo')}`; }
function layerBox(ctx,W,H,L){
  ctx.font=layerFont(L,W);
  const lines=wrapT(ctx,L.t||' ',W*(L.w||0.8));
  const fs=W*(L.size||20)/400, lh=fs*(L.lh||1.75);
  const widest=lines.reduce((m,l)=>Math.max(m,ctx.measureText(l).width),0);
  const bw=Math.max(widest,W*0.04), bh=lines.length*lh;
  const al=L.align||'center';
  const ax=W*(L.x!=null?L.x:0.5);
  const x= al==='right'? ax-bw : (al==='left'? ax : ax-bw/2);
  return {lines,fs,lh,bw,bh,x,y:H*(L.y!=null?L.y:0.4),ax};
}
function drawLayer(ctx,W,H,L){
  const b=layerBox(ctx,W,H,L);
  ctx.save(); ctx.direction='rtl'; ctx.textBaseline='alphabetic';
  if(L.band){ ctx.fillStyle=L.band; ctx.fillRect(b.x-W*0.014,b.y-b.fs*0.22,b.bw+W*0.028,b.bh+b.fs*0.3); }
  if(L.shadow){ ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=W*0.012; ctx.shadowOffsetY=W*0.004; }
  ctx.font=layerFont(L,W); ctx.fillStyle=L.color||'#ffffff';
  ctx.textAlign=L.align||'center';
  let y=b.y+b.fs;
  b.lines.forEach(l=>{ ctx.fillText(l,b.ax,y); y+=b.lh; });
  ctx.restore();
  return b;
}

  if(!force&&popBusy()){ el.classList.toggle('on',C2.sel!=null); return; }
  el.innerHTML=popHTML();
  el.classList.toggle('on',C2.sel!=null);
}
/* ---------- إطار التحديد فوق البطاقة ---------- */
function drawSelBox(){
  const ov=document.getElementById('c2ov'), cv=document.getElementById('c2cv');
  if(!ov||!cv) return; ov.innerHTML='';
  if(C2.sel==null) return;
  const W=cv.width,H=cv.height, ctx=cv.getContext('2d');
  let x,y,w,h;
  if(C2.sel==='img'){ const f=frameOf(); if(!f){ x=0;y=0;w=1;h=1; } else { x=f[0];y=f[1];w=f[2];h=f[3]; } }
  else if(C2.sel==='logo'){ const L=logoBoxOf(); x=L[0];y=L[1];w=L[2];h=L[2]*0.6; }
  else { const L=C2.layers[C2.sel]; if(!L) return; const b=layerBox(ctx,W,H,L);
    x=b.x/W; y=b.y/H; w=b.bw/W; h=b.bh/H; }
  const d=document.createElement('div'); d.className='selbox';
  d.style.cssText=`left:${x*100}%;top:${y*100}%;width:${w*100}%;height:${h*100}%`;
  ov.appendChild(d);
}
async function c2Render(keepPop){
  const cv=document.getElementById('c2cv'); if(!cv) return;
  const {W,H}=c2Size(); cv.width=W; cv.height=H;
  await c2Draw(cv,C2);
  drawSelBox();
  /* لا نعيد بناء لوحة الأدوات وأنت تكتب فيها — وإلا اختفى الكيبورد */
  if(!keepPop) showPop();
}
/* حارسٌ عامّ: لا يُعاد بناء لوحة فيها حقل تكتب فيه */
function popBusy(){
  const el=document.getElementById('lpop'), a=document.activeElement;
  return !!(el&&a&&el.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function c2Thumbs(){

  const im=await imgOf(C2.img);
  document.querySelectorAll('[data-thumb]').forEach(cv=>{

      t.draw(ctx,cv.width,cv.height,blankD(C2.d), fr?null:im, null);
      if(fr&&im) drawImgIn(ctx,im,fr[0]*cv.width,fr[1]*cv.height,fr[2]*cv.width,fr[3]*cv.height,fr[4],C2.imgPan);

        {t:i===0?'نصّ البطاقة يظهر هنا':'سطر',x:a[0],y:a[1],w:a[2],align:a[3],size:a[4],font:a[5],color:a[6],bold:!!a[7]}));

/* ---------- السحب والاختيار ---------- */
function hitTest(px,py){
  const cv=document.getElementById('c2cv'); const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  for(let i=(C2.layers||[]).length-1;i>=0;i--){
    const b=layerBox(ctx,W,H,C2.layers[i]);
    if(px*W>=b.x-14&&px*W<=b.x+b.bw+14&&py*H>=b.y-14&&py*H<=b.y+b.bh+14) return i;
  }
  if(C2.logo){ const L=logoBoxOf(); const lw=L[2], lh=L[2]*0.6;
    if(px>=L[0]&&px<=L[0]+lw&&py>=L[1]&&py<=L[1]+lh) return 'logo'; }
  if(C2.img){ const f=frameOf();
    if(!f) return 'img';
    if(px>=f[0]&&px<=f[0]+f[2]&&py>=f[1]&&py<=f[1]+f[3]) return 'img'; }
  return null;
}
function bindFreeDrag(){
  const cv=document.getElementById('c2cv'); if(!cv) return;
  cv.style.touchAction='none';
  let drag=null;
  const rel=e=>{ const r=cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };
  cv.addEventListener('pointerdown',e=>{
    const p=rel(e); const hit=hitTest(p.x,p.y);
    if(hit==null){ C2.sel=null; saveC2(); drawSelBox(); showPop(); return; }
    C2.sel=hit;
    if(hit==='img'){ const f=frameOf();
      drag={k:'img',ox:p.x,oy:p.y,f:f?f.slice():null,pan:Object.assign({},C2.imgPan)}; }
    else if(hit==='logo'){ const L=logoBoxOf(); drag={k:'logo',ox:p.x-L[0],oy:p.y-L[1]}; }
    else { const L=C2.layers[hit]; drag={k:'layer',i:hit,ox:p.x-L.x,oy:p.y-L.y}; }
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    drawSelBox(); showPop(); e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(!drag) return; const p=rel(e);
    if(drag.k==='layer'){ const L=C2.layers[drag.i];
      L.x=Math.max(0.02,Math.min(0.98,p.x-drag.ox)); L.y=Math.max(0,Math.min(0.97,p.y-drag.oy)); }
    else if(drag.k==='logo'){ const L=logoBoxOf().slice();
      L[0]=Math.max(0,Math.min(0.97,p.x-drag.ox)); L[1]=Math.max(0,Math.min(0.97,p.y-drag.oy));
      C2.logoBox=L; }
    else if(drag.k==='img'){
      const dx=p.x-drag.ox, dy=p.y-drag.oy;
      if(C2.panMode||!drag.f){
        C2.imgPan={x:Math.max(0,Math.min(1,(drag.pan.x||0.5)-dx*1.4)),
                   y:Math.max(0,Math.min(1,(drag.pan.y||0.5)-dy*1.4)), z:drag.pan.z||1};
      } else {
        const f=drag.f.slice();
        f[0]=Math.max(-0.1,Math.min(1-f[2]*0.3,drag.f[0]+dx));
        f[1]=Math.max(-0.1,Math.min(1-f[3]*0.3,drag.f[1]+dy));
        C2.frame=f;
      }
    }
    c2Render(); e.preventDefault();
  });
  const end=()=>{ if(drag){ drag=null; saveC2(); } };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
}
function pickFile(accept){
  /* المُدخل لا بدّ أن يكون داخل الصفحة ليعمل على الهاتف وداخل الإطارات */
  return new Promise(res=>{
    let i=document.getElementById('c2pick');
    if(!i){ i=document.createElement('input'); i.type='file'; i.id='c2pick';
      i.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;inset-block-start:0';
      document.body.appendChild(i); }
    i.value=''; i.accept=accept||'';
    let done=false;
    const fin=()=>{ if(done) return; done=true; i.onchange=null; res(i.files&&i.files[0]?i.files[0]:null); };
    i.onchange=fin;
    addEventListener('focus',()=>setTimeout(()=>{ if(!done&&!(i.files&&i.files.length)) fin(); },900),{once:true});
    i.click();
  });
}
