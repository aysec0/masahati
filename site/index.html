/* ---------- السحب والترتيب: ارفع وأنزل بإصبعك ---------- */
let SORT = null;
function bindSort() {
  document.querySelectorAll('[data-sortlist]').forEach(list => {
    if (list.dataset.sorted) return;
    list.dataset.sorted = '1';
    list.querySelectorAll('[data-sortid]').forEach(row => {
      const h = row.querySelector('.grip');
      if (h) h.addEventListener('pointerdown', ev => sortStart(ev, list, row));
    });
  });
}
function sortStart(ev, list, row) {
  ev.preventDefault();
  const rows = [...list.querySelectorAll('[data-sortid]')];
  const r = row.getBoundingClientRect();
  SORT = { list, row, rows, startY: ev.clientY, top: r.top, h: r.height, moved: false };
  row.classList.add('sorting');
  row.style.zIndex = 30;
  document.body.classList.add('sorting');
  addEventListener('pointermove', sortMove, { passive: false });
  addEventListener('pointerup', sortEnd);
  addEventListener('pointercancel', sortEnd);
}
function sortMove(ev) {
  if (!SORT) return;
  ev.preventDefault();
  const dy = ev.clientY - SORT.startY;
  if (Math.abs(dy) > 3) SORT.moved = true;
  SORT.row.style.transform = `translateY(${dy}px)`;
  const mid = SORT.top + dy + SORT.h / 2;
  let target = null;
  SORT.rows.forEach(x => {
    if (x === SORT.row) return;
    const b = x.getBoundingClientRect();
    if (mid > b.top && mid < b.bottom) target = x;
  });
  if (target) {
    const b = target.getBoundingClientRect();
    const before = mid < b.top + b.height / 2;
    const anchor = before ? target : target.nextSibling;
    /* لا نعيد الحساب إلّا إذا تغيّر الترتيب فعلًا —
       وإلّا ألغينا ما تحرّكتَه فلا يتقدّم السحب أبدًا */
    if (anchor !== SORT.row && anchor !== SORT.row.nextSibling) {
      SORT.row.style.transform = '';
      SORT.list.insertBefore(SORT.row, anchor);
      const nr = SORT.row.getBoundingClientRect();
      SORT.top = nr.top; SORT.startY = ev.clientY;
      SORT.rows = [...SORT.list.querySelectorAll('[data-sortid]')];
    }
  }
}
function sortEnd() {
  removeEventListener('pointermove', sortMove);
  removeEventListener('pointerup', sortEnd);
  removeEventListener('pointercancel', sortEnd);
  if (!SORT) return;
  const { list, row, moved } = SORT;
  row.style.transform = ''; row.style.zIndex = '';
  row.classList.remove('sorting');
  document.body.classList.remove('sorting');
  SORT = null;
  if (!moved) return;
  const order = [...list.querySelectorAll('[data-sortid]')].map(x => x.dataset.sortid);
  applyOrder(list.dataset.sortlist, order);
}
function applyOrder(kind, order) {
  const by = (arr, key) => order.map(id => arr.find(x => x[key || 'id'] === id)).filter(Boolean)
    .concat(arr.filter(x => !order.includes(x[key || 'id'])));
  if (kind === 'secs') { tree = by(tree); saveTree(); toast('رُتّبت أقسامك'); }
  else if (kind.startsWith('items:')) {
    const sid = kind.slice(6);
    const sec = findSec(sid);
    if (sec) { sec.items = by(sec.items || []); saveTree(); }
    else { /* قسم فرعيّ */
      tree.forEach(s => (s.subs || []).forEach(u => { if (u.id === sid) { u.items = by(u.items || []); } }));
      saveTree();
    }
    toast('رُتّبت');
  }
  else if (kind.startsWith('subs:')) {
    const sec = findSec(kind.slice(5));
    if (sec) { sec.subs = by(sec.subs || []); saveTree(); toast('رُتّبت'); }
  }
  else if (kind === 'goals') { plan.goals = by(plan.goals); savePlan(); toast('رُتّبت أهدافك'); }
  else if (kind === 'prios') { plan.prios = by(plan.prios); savePlan(); toast('رُتّبت أولوياتك'); }
  else if (kind === 'quotes') { quotes = by(quotes); saveQuotes(); toast('رُتّب جدارك'); }
  render();
}

   تشجير الأهداف والأولويات، وربطها بالمقرَّرات والمهام، وورد القرآن
   ================================================================ */

/* ---------- الشجرة: كل عنصر قد يكون له أصلٌ (up) ---------- */
function treeOf(list) {
  const ids = new Set(list.map(x => x.id));
  const roots = list.filter(x => !x.up || !ids.has(x.up));
  const kids = id => list.filter(x => x.up === id);
  const out = [];
  const walk = (x, d) => { out.push({ x, d }); kids(x.id).forEach(k => walk(k, d + 1)); };
  roots.forEach(r => walk(r, 0));
  return out;
}
function subtreeIds(list, id) {
  const s = new Set([id]); let grew = true;
  while (grew) { grew = false; list.forEach(x => { if (x.up && s.has(x.up) && !s.has(x.id)) { s.add(x.id); grew = true; } }); }
  return s;
}
/* نسبة الهدف: خطواته، ومهامه المنجزة اليوم، ومقرّراته المنجزة، وأهدافه الفرعية */
function goalPct(g, seen) {
  seen = seen || new Set(); if (seen.has(g.id)) return 0; seen.add(g.id);
  const parts = [];
  const st = g.steps || [];
  if (st.length) parts.push(st.filter(s => s.done).length / st.length);
  const secs = tree.filter(s => s.goal === g.id);
  if (secs.length) {
    const KD = done();
    const items = allItems().filter(r => secs.some(s => s.id === r.sec.id));
    if (items.length) parts.push(items.filter(r => KD[r.it.id]).length / items.length);
  }
  const subs = plan.goals.filter(x => x.up === g.id);
  subs.forEach(x => parts.push(goalPct(x, seen) / 100));
  if (!parts.length) return g.pct || 0;
  return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100);
}

/* ================= ورد القرآن =================
   مهمّة من نوع «تلاوة»: عدد صفحات كلّ يوم، مربوطة بملفّ المصحف،
   تعرف أين وقفت من موضع قراءتك نفسه، وكم بقي لك اليوم وإلى الختمة. */
const QURAN_PAGES = 604;
function wirdOf() { return plan.wird || null; }
function quranItem() {
  const w = wirdOf();
  if (w && w.item) { const r = findItem(w.item); if (r) return r.it; }
  const r = allItems().find(x => x.it.quran && x.it.file)
    || allItems().find(x => x.it.quran || /قرآن|القرآن|مصحف|المصحف/.test(x.it.name || ''));
  return r ? r.it : null;
}
/* أين وصلت: آخر صفحة قرأتها في ملفّ المصحف */
function wirdAt() {
  const it = quranItem(); if (!it) return (wirdOf() || {}).at || 1;
  const pos = ppos[it.id];
  const p = pos && (pos.p || pos.page);
  return Math.max(1, +p || (wirdOf() || {}).at || 1);
}
function wirdToday() {
  const w = wirdOf(); if (!w) return null;
  const k = ymd(new Date());
  const at = wirdAt();
  if (!w.log) w.log = {};
  if (!w.log[k]) w.log[k] = { from: at };
  const from = w.log[k].from;
  const read = Math.max(0, at - from);
  const goal = w.daily || 5;
  const total = w.total || QURAN_PAGES;
  const left = Math.max(0, total - at + 1);
  const days = Math.ceil(left / goal);
  return { from, at, read, goal, left, days, done: read >= goal, total };
}
function wirdCard() {
  const w = wirdOf();
  const it = quranItem();
  if (!w) return `<div class="pcardx wird">
    <div class="daytop"><div><b>ورد القرآن</b><small>عددُ صفحاتٍ كلّ يوم، ويتابعك أين وصلت وكم بقي</small></div></div>
    <div class="sheetrow" style="margin:0"><button class="btn pri" data-wd="setup">${ICON.plus} ابدأ وردك</button></div></div>`;
  const d = wirdToday();
  const pct = Math.min(100, Math.round(d.read / d.goal * 100));
  return `<div class="pcardx wird ${d.done ? 'ok' : ''}">
    <div class="daytop">
      <div><b>ورد القرآن</b>
        <small>${d.done ? 'أتممت وردك اليوم — بارك الله فيك' : `بقي لك اليوم ${AR(Math.max(0, d.goal - d.read))} من ${AR(d.goal)} صفحات`}</small></div>
      <div class="ring" style="--p:${pct}"><span>${AR(pct)}٪</span></div>
    </div>
    <div class="wirdrow">
      <span>وصلت: <b>صفحة ${AR(d.at)}</b></span>
      <span>بقي للختمة: <b>${AR(d.left)}</b> صفحة</span>
      <span>تختم بعد <b>${AR(d.days)}</b> يومًا</span>
    </div>
    <div class="sheetrow" style="margin:10px 0 0">
      ${it ? `<a class="btn pri" href="#/i/${it.id}" data-wd="go">${ICON.pdf} اقرأ الآن من صفحة ${AR(d.at)}</a>`
           : `<button class="btn pri" data-wd="pick">${ICON.pdf} اربط ملفّ المصحف</button>`}
      <button class="btn" data-wd="setup">تعديل</button>
    </div></div>`;
}
function wirdSetup() {
  const w = wirdOf() || { daily: 5, at: 1, total: QURAN_PAGES };
  const pdfs = allItems().filter(r => r.it.type === 'pdf');
  sheet(`<h3>ورد القرآن</h3>
    <div class="two">
      <div class="field"><label>كم صفحة كلّ يوم؟</label>
        <input type="number" id="wdD" min="1" max="60" value="${w.daily || 5}"></div>
      <div class="field"><label>أبدأ من صفحة</label>
        <input type="number" id="wdA" min="1" max="${QURAN_PAGES}" value="${wirdAt()}"></div>
    </div>
    <div class="field"><label>ملفّ المصحف</label>
      <select id="wdI"><option value="">— لم أرفعه بعد —</option>
        ${pdfs.map(r => `<option value="${r.it.id}" ${(quranItem() || {}).id === r.it.id ? 'selected' : ''}>${esc(r.it.name)}</option>`).join('')}
      </select></div>
    <p class="mkempty">يُقاس وردك من موضع قراءتك نفسه في الملفّ: كلّما قرأت تقدّم وحده، بلا أن تسجّل شيئًا.
      ويظهر في جدولك وفي صفحتك الأولى.</p>
    <div class="sheetrow"><button class="btn pri" data-wd="save">${ICON.chk} حفظ</button>
      ${wirdOf() ? '<button class="danger" data-wd="off">إيقاف الورد</button>' : ''}
      <button class="btn" onclick="closeSheet()">إغلاق</button></div>`, el => {
    el.addEventListener('click', ev => {
      const b = ev.target.closest('[data-wd]'); if (!b) return;
      if (b.dataset.wd === 'off') { delete plan.wird; savePlan(); closeSheet(); render(); return; }
      if (b.dataset.wd !== 'save') return;
      const nw = Object.assign(wirdOf() || { log: {} }, {
        daily: Math.max(1, +el.querySelector('#wdD').value || 5),
        at: Math.max(1, +el.querySelector('#wdA').value || 1),
        item: el.querySelector('#wdI').value || '',
        total: QURAN_PAGES
      });
      /* نبدأ عدّ اليوم من الصفحة التي كتبتها */
      nw.log = nw.log || {}; nw.log[ymd(new Date())] = { from: nw.at };
      if (nw.item) { const r = findItem(nw.item); if (r) { r.it.quran = true; saveTree();
        if (!ppos[nw.item] || (ppos[nw.item].p || 0) < nw.at) { ppos[nw.item] = Object.assign({}, ppos[nw.item] || {}, { p: nw.at, o: 0 }); S.set('ppos', ppos); } } }
      plan.wird = nw; savePlan(); closeSheet(); render(); toast('ورد القرآن جاهز');
    });

document.addEventListener('click', ev => {

/* ================= المصحف الشريف: حاضرٌ في كل مساحة =================
   لا نحشو ملفًّا بمئتي ميجابايت داخل الموقع — فكلّ من يفتحه سيُنزّله قبل أن يرى شيئًا.
   بل يظهر المصحف أوّل المكتبة، ويُجلب مرّة واحدة إلى الجهاز ثمّ يعمل بلا إنترنت:
   من ملفّ «quran.pdf» بجانب الموقع إن رفعته إلى استضافتك، أو ترفعه أنت من جهازك. */
const QURAN_ID = 'quran';
function quranEnsure() {
  if (S.get('quranHide', false)) return;
  const has = allItems().some(r => r.it.id === QURAN_ID);
  if (has) return;
  let sec = tree.find(s => s.id === 'secQuran');
  if (!sec) { sec = { id: 'secQuran', name: 'المصحف', items: [], subs: [], pinTop: true }; tree.unshift(sec); }
  sec.items.unshift({ id: QURAN_ID, type: 'pdf', name: 'المصحف الشريف', quran: true, author: 'مصحف المدينة' });
  saveTree();
}
function quranHide(on) {
  S.set('quranHide', !!on);
  if (on) { tree = tree.filter(s => s.id !== 'secQuran'); saveTree(); }
  else quranEnsure();
  render();
}
/* بلا ملفّ بعد: نحاول «quran.pdf» بجانب الموقع، وإلّا نطلبه */
async function quranFetchLocal() {
  try {
    if (!/^https?:$/.test(location.protocol)) return false;
    const r = await fetch('quran.pdf', { method: 'GET' });
    if (!r.ok) return false;
    const ct = r.headers.get('content-type') || '';
    if (/html/i.test(ct)) return false;
    const blob = await r.blob();
    if (blob.size < 4000) return false;
    /* تأكّد أنّه PDF فعلًا لا صفحة خطأ */
    try { const head = await blob.slice(0, 5).text(); if (head !== "%PDF-") return false; } catch (e) {}
    const key = 'fquran';
    await putFile(key, new Blob([blob], { type: 'application/pdf' }));
    const it = (findItem(QURAN_ID) || {}).it; if (!it) return false;
    it.file = key; it.size = blob.size; saveTree();
    return true;
  } catch (e) { return false; }
}
function quranEmpty(it) {
  return `<div class="pcardx" style="margin:14px 16px">

      ارفعه من جهازك، أو ضع ملفًّا اسمه <b dir="ltr">quran.pdf</b> بجانب الموقع في استضافتك فيُجلب تلقائيًّا.</p>
    <div class="sheetrow" style="margin:0">

      <button class="btn" data-qr="hide">أخفِ المصحف من مكتبتي</button>
    </div></div>`;
}

  }
});

  let est=''; try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); est=mb(e.usage||0)+' من '+mb(e.quota||0); } }catch(e){}

/* ---------- الرسم: لا يرميك إلى الأعلى، ولا يضيّع صفحتك في الملف ---------- */
const _mhRender = render;
render = function () {
  const h = location.hash || '#/';
  const same = h === MH.lastHash;
  const y = window.scrollY;
  try { const box = document.getElementById('pdfbox'); if (box && box.__pdf) savePdfNow(box); } catch (e) {}
  _mhRender.apply(this, arguments);
  MH.lastHash = h;
  if (same && y > 0) { scrollTo({ top: y }); requestAnimationFrame(() => scrollTo({ top: y })); }
  MH.routes.forEach(r => { try { if (r.after && r.test(h)) r.after(h); } catch (e) { console.error(e); } });

};

/* ---------- استعادة موضع الملف: نثبّته حتى تستقرّ الصفحات تحته ---------- */
restorePdf = function (box) {
  const sv = ppos[box.dataset.item]; if (!sv || sv.p < 1) return;
  const want = () => {
    const h = box.querySelector(`.pg[data-p="${sv.p}"]`); if (!h) return null;
    return Math.max(0, h.offsetTop + (sv.o || 0) * h.offsetHeight - 8);
  };
  const t0 = want(); if (t0 == null) return;
  box.scrollTop = t0;
  let n = 0, user = false;
  const stop = () => { user = true; };
  box.addEventListener('wheel', stop, { once: true, passive: true });
  box.addEventListener('touchstart', stop, { once: true, passive: true });
  box.addEventListener('pointerdown', stop, { once: true, passive: true });
  const pin = () => {
    if (user || !box.isConnected) return;
    const w = want(); if (w != null && Math.abs(box.scrollTop - w) > 2) box.scrollTop = w;
    if (++n < 18) setTimeout(pin, 120);
  };
  setTimeout(pin, 120);
  if (sv.p > 1) {
    const tip = document.createElement('div'); tip.className = 'resume';
    tip.textContent = 'تابعت من صفحة ' + AR(sv.p); box.prepend(tip);
    setTimeout(() => tip.classList.add('fade'), 2600); setTimeout(() => tip.remove(), 3300);
  }
};

/* ---------- سهما الشريط السفلي: يسارًا لما بقي، ويمينًا لما فات ---------- */
function mhTabArrows() {
  const tb = document.getElementById('tabbar'); if (!tb) return;
  let L = document.getElementById('tbL'), R = document.getElementById('tbR');
  if (!L) {
    L = document.createElement('button'); L.id = 'tbL'; L.className = 'tbarrow l'; L.setAttribute('aria-label', 'بقيّة الأقسام');
    L.innerHTML = MHI.next;
    R = document.createElement('button'); R.id = 'tbR'; R.className = 'tbarrow r'; R.setAttribute('aria-label', 'رجوع إلى أوّل الأقسام');
    R.innerHTML = MHI.prev;
    document.body.append(L, R);
    L.onclick = () => tb.scrollBy({ left: -tb.clientWidth * 0.75, behavior: 'smooth' });
    R.onclick = () => tb.scrollBy({ left: tb.clientWidth * 0.75, behavior: 'smooth' });
    tb.addEventListener('scroll', mhTabArrowsSync, { passive: true });
    addEventListener('resize', mhTabArrowsSync);
  }
  mhTabArrowsSync();
}
function mhTabArrowsSync() {
  const tb = document.getElementById('tabbar'), L = document.getElementById('tbL'), R = document.getElementById('tbR');
  if (!tb || !L) return;
  const shown = getComputedStyle(tb).display !== 'none' && tb.offsetParent !== null;
  const over = tb.scrollWidth - tb.clientWidth > 8;
  const x = Math.abs(tb.scrollLeft);
  const atStart = x < 6, atEnd = x + tb.clientWidth >= tb.scrollWidth - 6;
  L.classList.toggle('on', shown && over && !atEnd);
  R.classList.toggle('on', shown && over && !atStart);
}

    if (!blob) blob = await grab(it.url, false, 30000);

  if (!blob) throw new Error('لم أجد ملف الصوت في هذا المتصفح');
  return blob;

  return h[0] === 0xFF && (h[1] & 0xE0) === 0xE0 && (h[1] & 0x06) !== 0;      /* إطار MPEG صوتيّ */

/* ================================================================
   التظليل بالسحب، والضغطة الواحدة تُظهر الأدوات — لا «طرفًا أوّل» يعلّقك
   (كانت الضغطة الواحدة تضع علامة نابضة وتنتظر ضغطةً ثانية، ولا تفتح شيئًا)
   ================================================================ */
bindLayer = function (layer, key, page) {
  let st = null, box = null, cur = null;
  const rel = e => { const b = layer.getBoundingClientRect();
    return { x: Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), y: Math.max(0, Math.min(1, (e.clientY - b.top) / b.height)) }; };
  const start = () => {
    st.live = true;
    try { layer.setPointerCapture(st.id); } catch (_) {}
    box = document.createElement('div'); box.className = 'hrect';
    box.style.cssText = `left:${st.p.x * 100}%;top:${st.p.y * 100}%;width:0;height:0;background:color-mix(in srgb,${HCOL[curColor]} 60%,transparent)`;
    layer.appendChild(box);
  };
  layer.addEventListener('pointerdown', e => {
    if (!layer.classList.contains('draw')) return;
    if (e.target.classList.contains('hrect')) return;
    if (e.button != null && e.button !== 0) return;
    st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, p: rel(e), mouse: e.pointerType === 'mouse', live: false, moved: false };
    if (st.mouse) e.preventDefault();
  });
  layer.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.live) {
      if (Math.abs(dx) < (st.mouse ? 4 : 9) && Math.abs(dy) < (st.mouse ? 4 : 9)) return;
      st.moved = true;
      if (!st.mouse && Math.abs(dy) > Math.abs(dx)) { st = null; return; }   /* الإصبع للأعلى والأسفل = تمرير */
      start();
    }
    const q = rel(e);
    cur = { x: Math.min(st.p.x, q.x), y: Math.min(st.p.y, q.y), w: Math.abs(q.x - st.p.x), h: Math.abs(q.y - st.p.y) };
    box.style.left = cur.x * 100 + '%'; box.style.top = cur.y * 100 + '%';
    box.style.width = cur.w * 100 + '%'; box.style.height = Math.max(cur.h, 0.012) * 100 + '%';
    e.preventDefault();
  });
  const fin = e => {
    if (!st) return; const s = st; st = null;
    if (s.live) {
      if (box) box.remove(); box = null;
      if (cur) {
        /* سحبٌ أفقيّ على سطرٍ واحد: نعطيه ارتفاع سطر */
        if (cur.h < 0.012) { cur.y -= 0.009; cur.h = 0.024; }
        if (cur.w < 0.015) toast('التظليل صغير جدًا — اسحب أطول قليلًا');
        else { addHl(key, { t: 'pdf', p: page, x: cur.x, y: cur.y, w: cur.w, h: cur.h, at: Date.now() });
          paintRects(layer, key, page); toast('ظُلِّل — اضغطه لتكتب فائدة'); }
      }
      cur = null; return;
    }
    if (s.moved) return;                                     /* كان تمريرًا */
    /* ضغطةٌ واحدة: أظهر الأدوات مباشرة */
    mhHlTap(e || { clientX: s.x0, clientY: s.y0 });
  };
  layer.addEventListener('pointerup', fin);
  layer.addEventListener('pointercancel', () => { if (box) { box.remove(); box = null; } st = null; cur = null; });
};
try { clearCorner = function () { document.querySelectorAll('.hmark').forEach(x => x.remove()); document.querySelectorAll('.hlayer.waiting').forEach(x => x.classList.remove('waiting')); tapCorner = null; }; } catch (e) {}

/* الضغطة الواحدة أثناء التظليل */

/* ---------- تحريك وتكبير وتدوير بمقابض واضحة ---------- */
function wallBind(el, cv) {
  const id = el.dataset.wc, q = () => quotes.find(x => x.id === id);

  let base = null, moved = false;

      return; }

    else if (kind === 'rot') { const cx = r.left + r.width / 2, cy = r.top + r.height / 2;

    else { act = 'move'; base = { x: e.clientX, y: e.clientY, ex: r.left - cr.left, ey: r.top - cr.top, cw: cr.width, ch: cr.height }; }

/* ================================================================
   التذكير — ثلاثة أعطال أُصلحت:
   ١) الذكر لا يظهر أبدًا: كان فحص المهامّ يسبقه ويُرجع «بقي كذا من مهامك» كلّ مرّة.
   ٢) لمسة واحدة على التذكير كانت تُسكت كل شيء نصف ساعة — ومعه أذان الصلاة.
   ٣) تنبيه الصلاة يضيع إن كانت نافذةٌ مفتوحة لحظتها: يُعلَّم «مقروءًا» قبل أن يظهر.
   وأُضيف: إشعار النظام، واستدراك ما فات حين تعود، وتصدير الأوقات إلى تقويم الهاتف
   لتنبّهك حتى والموقع مغلق.
   ================================================================ */
hideHint = function () {
  const e = document.getElementById('nowhint'); if (e) e.classList.remove('on');
  clearTimeout(hintHideT);
};
function mhHint(html, cls, ms, force) {
  if (!force) {
    if (!plan.hint.on) return false;
    if (typeof uiOn === 'function' && !uiOn('hint')) return false;
    if (Date.now() < (S.get('hintOff', 0) || 0)) return false;
    if (document.querySelector('.mhmodal')) return false;
  }
  const e = hintEl();
  e.className = 'nowhint ' + (cls || '');
  e.innerHTML = html + '<i class="x">×</i>';
  requestAnimationFrame(() => e.classList.add('on'));
  clearTimeout(hintHideT);
  hintHideT = setTimeout(() => e.classList.remove('on'), ms || Math.max(4, +plan.hint.secs || 5) * 1000);
  return true;
}
showHint = function (html, cls, ms) { return mhHint(html, cls, ms, false); };

/* الذكر والفائدة: كلٌّ في موعده، ولا تقطعه المهامّ */
let mhZk = 0;
hintTick = function () {
  if (mhZk++ % 3 === 2) { const m = museHint(); if (m && showHint(m, 'muse')) return; }
  zikrHint();
};
zikrHint = function () {
  if (plan.hint.zikr === false) return;
  zIdx = (zIdx + 1) % AZKAR.length;
  showHint(`<b>ذِكر</b><span>${esc(AZKAR[zIdx])}</span>`, 'muse', Math.max(5, +plan.hint.secs || 5) * 1000);
};

/* المهامّ: تنبيه قبلها بدقائق، وتنبيه عند بدئها — مرّة واحدة لكلّ منهما */
function mhTaskWatch() {
  try {
    const { cur, nxt } = nowNext();
    const seen = S.get('taskSeen', {}), day = ymd(new Date());
    Object.keys(seen).forEach(k => { if (!k.startsWith(day)) delete seen[k]; });
    if (cur) { const k = day + ':now:' + cur.t.id + ':' + cur.s;
      if (!seen[k] && showHint(`<b>الآن</b><span>${esc(cur.t.title)}</span><small>حتى ${clock(cur.e)}</small>`, 'task', 8000)) { seen[k] = 1; try { beep(1); } catch (e) {} } }
    if (nxt) { const before = +plan.hint.before || 10, d = nxt.s - nowMin(), k = day + ':pre:' + nxt.t.id + ':' + nxt.s;
      if (d <= before && d > 0 && !seen[k] && showHint(`<b>بعد ${AR(Math.max(1, Math.round(d)))} دقيقة</b><span>${esc(nxt.t.title)}</span><small>${clock(nxt.s)}</small>`, 'task', 8000)) seen[k] = 1; }
    S.set('taskSeen', seen);
  } catch (e) {}
}

/* ---------- الصلاة: تنبيهٌ لا يضيع ---------- */
function mhPrayCheck(catchUp) {
  try {
    if (plan.hint.pray === false) return;
    const m = prayTimes(new Date()); if (!m) return;
    const n = nowMin(), k = ymd(new Date());
    const seen = S.get('praySeen', {});
    Object.keys(seen).forEach(x => { if (!x.startsWith(k)) delete seen[x]; });
    const pre = +plan.hint.prayPre || 0;
    PRAY.forEach(([key, name]) => {
      if (key === 'sunrise') return;
      const t = m[key]; if (t == null) return;
      const id = k + ':' + key;
      const win = catchUp ? 30 : 20;
      if (n >= t && n < t + win && !seen[id]) {
        const late = Math.round(n - t);
        const body = late >= 2 ? `دخل وقت صلاة ${name} منذ ${AR(late)} دقيقة` : `حان وقت صلاة ${name}`;
        mhHint(`<b>الصلاة</b><span>${body}</span><small>${clock(t)}</small>`, 'pray', 15000, true);
        seen[id] = 1; S.set('praySeen', seen);
        try { beep(3); } catch (e) {}
        mhNotify('حان وقت صلاة ' + name, clock(t) + ' — ' + (site.name || 'مساحتي'), 'pray-' + key);
        try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
      }
      if (pre > 0) {
        const pid = k + ':pre:' + key;
        if (n >= t - pre && n < t && !seen[pid]) {
          seen[pid] = 1; S.set('praySeen', seen);
          mhHint(`<b>قريبًا</b><span>بعد ${AR(Math.round(t - n))} دقائق صلاة ${name}</span><small>${clock(t)}</small>`, 'pray', 9000, true);
        }
      }
    });
  } catch (e) {}
}
prayWatch = function () { mhPrayCheck(false); };
function mhNotify(title, body, tag) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible' && document.hasFocus()) return;   /* الشريط العلويّ يكفي */
    const opt = { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', renotify: true, vibrate: [300, 150, 300] };
    if (navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.ready.then(r => r.showNotification(title, opt)).catch(() => { new Notification(title, opt); });
    else new Notification(title, opt);
  } catch (e) {}
}

/* ---------- تصدير أوقات الصلاة إلى تقويم الهاتف: تنبّهك والموقع مغلق ---------- */
function mhPrayICS(days) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Masahati//Pray//AR', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:أوقات الصلاة'];
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const p2 = n => String(n).padStart(2, '0');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  for (let i = 0; i < days; i++) {
    const d = new Date(d0.getTime() + i * 86400000);
    const m = prayTimes(d); if (!m) continue;
    PRAY.forEach(([key, name]) => {
      if (key === 'sunrise' || m[key] == null) return;
      const mm = Math.round(m[key]), dt = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}T${p2(Math.floor(mm / 60))}${p2(mm % 60)}00`;
      L.push('BEGIN:VEVENT', `UID:${ymd(d)}-${key}@masahati`, `DTSTAMP:${stamp}`, `DTSTART:${dt}`, 'DURATION:PT15M',
        `SUMMARY:صلاة ${name}`, 'TRANSP:TRANSPARENT',
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:حان وقت صلاة ${name}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    });
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

/* تنزيل سورة */
async function mhQariGet(rid, n, silent) {
  const rec = QARIS.find(r => r.id === rid); if (!rec) return false;
  const row = document.querySelector(`[data-sr="${rid}:${n}"]`);
  if (row) row.classList.add('getting');
  try {
    let blob = null; try { const r = await fetch(mhQariUrl(rec, n)); if (r.ok) blob = await r.blob(); } catch (e) {}
    if (!blob) blob = await grab(mhQariUrl(rec, n), false, 60000);
    if (!blob || blob.size < 2000) throw new Error('فارغ');
    const key = 'qf_' + rid + '_' + n; await putFile(key, blob);
    mhQari[rid] = mhQari[rid] || {}; mhQari[rid][n] = key; saveQari();
    /* اربطها بالمكتبة الصوتية للقارئ */
    mhQariLib(rec, n, key, blob.size);
    if (!silent && location.hash === '#/qari/' + rid) render();
    return true;
  } catch (e) { if (row) row.classList.remove('getting'); if (!silent) toast('تعذّر تنزيل السورة — تحقّق من الاتصال'); return false; }
}
function mhQariLib(rec, n, key, size) {
  const secId = 'secQari_' + rec.id;
  const sec = mhSecEnsure(secId, 'صوتيّات: ' + rec.n, { qari: rec.id });
  if (sec.items.some(x => x.surah === n)) return;
  sec.items.push({ id: uid('i'), type: 'audio', name: 'سورة ' + SURAS[n - 1], surah: n, file: key, size, mime: 'audio/mpeg', reciter: rec.n });
  sec.items.sort((a, b) => (a.surah || 0) - (b.surah || 0));
  saveTree();
}
document.addEventListener('click', async ev => {
  const g = ev.target.closest('[data-qget]');
  if (g) { const [rid, n] = g.dataset.qget.split(':'); g.textContent = '…'; await mhQariGet(rid, +n); return; }
  const d = ev.target.closest('[data-qdel]');
  if (d) { const [rid, n] = d.dataset.qdel.split(':'); const key = (mhQari[rid] || {})[n];
    if (key) dropFile(key); delete mhQari[rid][n]; saveQari();

    render(); return; }
  const p = ev.target.closest('[data-qplay]');
  if (p) { const [rid, n] = p.dataset.qplay.split(':'); const key = (mhQari[rid] || {})[+n];
    if (!key) return; const b = await getFile(key); const rec = QARIS.find(r => r.id === rid);
    if (b) mhPlayBlob(b, 'سورة ' + SURAS[+n - 1], rec.n); return; }
  const all = ev.target.closest('[data-qall]');

    const b = await getFile(mhQariHave(rid)[have[0]]); const rec = QARIS.find(r => r.id === rid);

/* تنزيل المصحف كاملًا: سورةً بعد سورة، ويمكن إيقافه */
let mhQariJob = null;
async function mhQariAll(rid) {
  if (mhQariJob) { mhQariJob.stop = true; return; }
  const rec = QARIS.find(r => r.id === rid); const st = document.getElementById('qAllSt');
  const have = mhQariHave(rid);
  const todo = []; for (let n = 1; n <= 114; n++) if (!have[n]) todo.push(n);
  if (!todo.length) { if (st) st.textContent = 'المصحف كامل عندك ✓'; return; }
  mhQariJob = { rid, stop: false };
  const btn = document.querySelector(`[data-qall="${rid}"]`); if (btn) btn.textContent = 'إيقاف التنزيل';
  let done = 0;
  for (const n of todo) {
    if (mhQariJob.stop) break;
    if (st) st.textContent = `أنزّل سورة ${SURAS[n - 1]}… (${AR(done + 1)} من ${AR(todo.length)})`;
    const ok = await mhQariGet(rid, n, true); if (ok) done++;
    const row = document.querySelector(`[data-sr="${rid}:${n}"]`);
    if (row && ok) { row.classList.remove('getting'); row.classList.add('have');
      row.innerHTML = `<span class="surano">${AR(n)}</span><button class="surplay" data-qplay="${rid}:${n}">${MHI.play}</button>

  }
  const stopped = mhQariJob.stop; mhQariJob = null;
  if (btn) btn.textContent = ICON.dl.replace(/^/, '') + ' نزّل المصحف كاملًا', btn.innerHTML = `${ICON.dl} نزّل المصحف كاملًا`;

}

    </div>
    <div class="vsec"><div class="vsec-h"><b>${MHI.key} كلمات المرور</b><button class="mhico" data-vadd="pw">${ICON.plus}</button></div>
      ${V.pw.length ? V.pw.map((p, i) => `<div class="vpw"><div class="vpw-t"><b>${esc(p.site || 'موقع')}</b>
        <button class="lnk danger" data-vdel="pw:${i}">${MHI.trash}</button></div>
        <div class="vrow"><span class="vlbl">الإيميل</span><span class="vval">${esc(p.email || '—')}</span><button class="lnk" data-vcopyb="${esc(p.email || '')}">${MHI.copy}</button></div>
        <div class="vrow"><span class="vlbl">كلمة السرّ</span><span class="vval" id="vp${i}">••••••••</span>
          <button class="lnk" data-vpwreveal="${i}">${MHI.eye}</button><button class="lnk" data-vcopyb="${esc(p.pass || '')}">${MHI.copy}</button></div>
        ${p.note ? `<div class="mhnote" style="margin:2px 0 0">${esc(p.note)}</div>` : ''}</div>`).join('')
      : '<p class="mhnote">اسم الموقع والإيميل وكلمة السرّ — اضغط +</p>'}
    </div>
    <div class="vsec"><div class="vsec-h"><b>${MHI.id} ملفّاتي</b><button class="mhico" data-vadd="file">${ICON.plus}</button></div>
      <p class="mhnote" style="margin:0 0 8px">صورة الجواز والرخصة والفيزة… تُحفظ مشفّرة الوصول في جهازك.</p>
      ${V.files.length ? `<div class="vfiles">${V.files.map((f, i) => `<figure class="vfile" data-vfopen="${i}">
        ${/^image/.test(f.mime) ? `<img data-vimg="${esc(f.key)}" alt="">` : `<span class="vfico">${ICON.pdf}</span>`}
        <figcaption>${esc(f.name)}<button class="lnk danger" data-vdel="file:${i}">×</button></figcaption></figure>`).join('')}</div>` : ''}
    </div>
    <div class="sheetrow" style="margin:0 16px">
      <button class="btn" data-vlk="set">${MHI.lock} ${V.lock ? 'تغيير القفل أو إزالته' : 'اقفل الخزنة بكلمة سرّ'}</button>
    </div>`;
}, () => {
  document.querySelectorAll('[data-vimg]').forEach(async im => { const u = await fileURL(im.dataset.vimg); if (u) im.src = u; });
});
document.addEventListener('click', async ev => {
  if (ev.target.closest('[data-vaultopen]')) { location.hash = '#/vault'; return; }
  const lk = ev.target.closest('[data-vlk]');
  if (lk) {
    if (lk.dataset.vlk === 'open') { const v = document.getElementById('vPw').value;
      if (mhHash(v) === mhVault.lock) { mhVaultOpen = true; render(); } else toast('كلمة السرّ غير صحيحة'); return; }
    if (lk.dataset.vlk === 'set') { mhVaultLockSheet(); return; }
  }
  const add = ev.target.closest('[data-vadd]');
  if (add) { mhVaultAdd(add.dataset.vadd); return; }
  const cp = ev.target.closest('[data-vcopyb]'); if (cp) { mhCopy(cp.dataset.vcopyb, 'نُسخ'); return; }
  const rv = ev.target.closest('[data-vreveal]'); if (rv) { const f = mhVault.fields[+rv.dataset.vreveal];
    rv.previousElementSibling.previousElementSibling.textContent = f.v; rv.remove(); return; }
  const pr = ev.target.closest('[data-vpwreveal]'); if (pr) { const el = document.getElementById('vp' + pr.dataset.vpwreveal);
    el.textContent = mhVault.pw[+pr.dataset.vpwreveal].pass || '—'; return; }
  const dl = ev.target.closest('[data-vdel]');
  if (dl) { const [t, i] = dl.dataset.vdel.split(':');
    confirmSheet('يُحذف هذا العنصر من خزنتك.', () => {
      if (t === 'file') { const f = mhVault.files[+i]; if (f) dropFile(f.key); mhVault.files.splice(+i, 1); }
      else if (t === 'pw') mhVault.pw.splice(+i, 1); else mhVault.fields.splice(+i, 1);
      saveVault();
    }); return; }
  const fo = ev.target.closest('[data-vfopen]');
  if (fo && !ev.target.closest('[data-vdel]')) { const f = mhVault.files[+fo.dataset.vfopen]; const u = await fileURL(f.key);
    if (/^image/.test(f.mime)) showImg(u, f.name); else window.open(u, '_blank'); return; }
});
function mhVaultAdd(kind) {
  if (kind === 'field') {
    const preset = ['الاسم الكامل', 'رقم الجواز', 'رقم الهوية', 'رقم الهاتف', 'تاريخ الميلاد', 'رقم الآيبان'];
    mhModal(`<div class="mhvhead"><b>معلومة</b><span style="flex:1"></span><button class="lnk" data-mhx="1">إغلاق</button></div>
      <div class="chips">${preset.map(p => `<button class="chip" data-vpreset="${esc(p)}">${p}</button>`).join('')}</div>
      <div class="field"><label>العنوان</label><input type="text" id="vk" dir="rtl" placeholder="مثلًا: رقم الجواز"></div>
      <div class="field"><label>القيمة</label><input type="text" id="vv" dir="rtl"></div>
      <label class="mhvlive"><button class="usw" data-vsecret></button><span>أخفِها افتراضيًّا (••••)</span></label>
      <div class="sheetrow"><button class="btn pri" data-vsave="1">${ICON.chk} احفظ</button></div>`, m => {
      let secret = false;
      m.addEventListener('click', e => {
        const pr = e.target.closest('[data-vpreset]'); if (pr) { m.querySelector('#vk').value = pr.dataset.vpreset; m.querySelector('#vv').focus(); return; }
        if (e.target.closest('[data-vsecret]')) { secret = !secret; e.target.closest('[data-vsecret]').classList.toggle('on', secret); return; }
        if (e.target.closest('[data-vsave]')) { const k = m.querySelector('#vk').value.trim(), v = m.querySelector('#vv').value.trim();
          if (!k || !v) { toast('أكمل الحقلين'); return; } mhVault.fields.push({ k, v, secret }); saveVault(); m.close(); render(); }
      });
    });
  } else if (kind === 'pw') {
    mhModal(`<div class="mhvhead"><b>${MHI.key} كلمة مرور</b><span style="flex:1"></span><button class="lnk" data-mhx="1">إغلاق</button></div>
      <div class="field"><label>اسم الموقع أو التطبيق (اختياري)</label><input type="text" id="pS" dir="rtl" placeholder="مثلًا: بريدي"></div>
      <div class="field"><label>الإيميل أو اسم المستخدم</label><input type="text" id="pE" dir="ltr"></div>
      <div class="field"><label>كلمة السرّ</label><input type="text" id="pP" dir="ltr"></div>
      <div class="field"><label>ملاحظة (اختياري)</label><input type="text" id="pN" dir="rtl"></div>
      <div class="sheetrow"><button class="btn pri" data-vsave="1">${ICON.chk} احفظ</button></div>`, m => {
      m.querySelector('[data-vsave]').onclick = () => {
        mhVault.pw.push({ site: m.querySelector('#pS').value.trim(), email: m.querySelector('#pE').value.trim(),
          pass: m.querySelector('#pP').value, note: m.querySelector('#pN').value.trim() });
        saveVault(); m.close(); render();
      };
    });
  } else if (kind === 'file') {
    mhPickFile('image/*,application/pdf').then(async f => {
      if (!f) return;
      const isImg = /^image/.test(f.type);
      const blob = isImg ? await shrinkImg(f, 1800) : f;
      const key = uid('vf'); await putFile(key, blob);
      mhVault.files.push({ key, name: f.name, mime: f.type }); saveVault(); render();
    });
  }
}
function mhVaultLockSheet() {
  mhModal(`<div class="mhvhead"><b>${MHI.lock} قفل الخزنة</b><span style="flex:1"></span><button class="lnk" data-mhx="1">إغلاق</button></div>
    <p class="mhnote">القفل يمنع الفضول العابر. وهو ليس تشفيرًا قويًّا — لا تعتمد عليه لأسرار خطيرة.</p>
    <div class="field"><label>كلمة سرّ جديدة (اتركها فارغة لإزالة القفل)</label><input type="password" id="vPw" dir="ltr"></div>
    <div class="field"><label>أعِدها</label><input type="password" id="vPw2" dir="ltr"></div>
    <div class="sheetrow"><button class="btn pri" data-vsavelk="1">${ICON.chk} احفظ</button></div>`, m => {
    m.querySelector('[data-vsavelk]').onclick = () => {
      const a = m.querySelector('#vPw').value, b = m.querySelector('#vPw2').value;
      if (a !== b) { toast('الكلمتان غير متطابقتين'); return; }
      mhVault.lock = a ? mhHash(a) : ''; mhVaultOpen = true; saveVault(); m.close(); render();
      toast(a ? 'أُقفلت الخزنة' : 'أُزيل القفل');
    };
  });
}
/* زرّ الخزنة داخل بوح */
mhAfter(h => {
  if (h !== '#/boh') return;
  const view = document.getElementById('view'); if (!view || view.querySelector('.vaultcard')) return;
  const head0 = view.querySelector('.sechead') || view.querySelector('p');
  const d = document.createElement('a'); d.className = 'pcardx vaultcard'; d.href = '#/vault';
  d.style.cssText = 'margin:0 16px 12px;display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit';
  d.innerHTML = `<span class="mhico" style="pointer-events:none">${MHI.lock}</span>
    <div style="flex:1"><b style="font-size:13.5px">خزنتي — معلوماتي وملفّاتي الشخصية</b>
    <small style="display:block;color:var(--muted);font-size:11.5px">جواز، هاتف، كلمات مرور، صور وثائق — في جهازك وحده</small></div>${ICON.back}`;
  if (head0) head0.after(d); else view.querySelector('article,div')?.prepend(d);
});
/* الخزنة تدخل النسخة الشاملة */
const _mhBkKeys2 = bkFileKeys;
bkFileKeys = function () {
  const keys = new Set(_mhBkKeys2());
  (mhVault.files || []).forEach(f => keys.add(f.key));
  return [...keys];
};
