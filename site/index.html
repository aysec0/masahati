/* ================= النسخة الاحتياطية الكاملة =================
   نسختان:
   1) نسخة المساحة (.json) — كل ما في هذا الجهاز من إعدادات ومحتوى: الأقسام
      وأسماؤها وترتيبها، الفوائد والتظليلات والاقتباسات والكتابات والمذكّرات
      والخرائط الذهنية والعلامات المرجعية والتفريغ والجدول والأهداف والأولويات
      والمهام وأوقات الصلاة والبطاقات والمفضّلة والتأريخ والإنجازات وكل تخصيصٍ
      اخترته. ما لا تحمله: الملفات المرفوعة نفسها (PDF/صوت/فيديو/صور).
   2) نسخة شاملة (.mspace) — كلّ ما سبق ومعه الملفات المرفوعة بذاتها،
      في ملفٍ واحد يُستعاد في أي جهاز فيعود كل شيء كما تركته.

   صيغة الملف الشامل (ثنائيّة، تُكتب تدفّقًا فلا تُرهق ذاكرة الجهاز):
     "MSHBK001"  ثمانية أحرف
     ثمانية أرقام  = طول ترويسة JSON بالبايت
     ترويسة JSON  = {v, ls:{...}, files:[{k,type,size}]}
     ثم بايتات الملفات متتابعةً بالترتيب نفسه.
*/
const BK_MAGIC = 'MSHBK001';

function lsAll() {
  const o = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.slice(0, 3) === 'ws_') o[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return o;
}
/* كل مفاتيح الملفات المذكورة في المساحة: المقرّرات وصور الجدار والصورة الشخصية */
function bkFileKeys() {
  const keys = new Set();
  try {
    (tree || []).forEach(s => {
      (s.items || []).forEach(it => { if (it.file) keys.add(it.file); });
      (s.subs || []).forEach(u => (u.items || []).forEach(it => { if (it.file) keys.add(it.file); }));
    });
  } catch (e) {}
  try { (quotes || []).forEach(q => { if (q.img) keys.add(q.img); }); } catch (e) {}
  try { if (site && site.avatar) keys.add(site.avatar); } catch (e) {}
  try { (cards || []).forEach(c => {
    if (c.img) keys.add(c.img); if (c.logo) keys.add(c.logo);
    if (c.free && c.free.imgKey) keys.add(c.free.imgKey);
    if (c.free && c.free.layers) c.free.layers.forEach(l => { if (l.imgKey) keys.add(l.imgKey); });
  }); } catch (e) {}
  /* أي مفتاح آخر مخزَّن في الكتابات أو العلامات */
  try {
    const raw = JSON.stringify([S.get('writes', []), S.get('marks', {}), S.get('minds', [])]);
    (raw.match(/"(f|wq|av|im)[a-z0-9]{4,}"/gi) || []).forEach(m => keys.add(m.replace(/"/g, '')));
  } catch (e) {}
  return [...keys];
}
function bkPad8(n) { return String(n).padStart(8, '0'); }

async function bkSize() {
  let bytes = 0, n = 0;
  for (const k of bkFileKeys()) { const b = await getFile(k); if (b) { bytes += b.size || 0; n++; } }
  return { bytes, n };
}

/* ---------- تصدير ---------- */
async function bkExport(withFiles) {
  const name = (site.name || 'مساحتي').replace(/[\\/:*?"<>|]/g, '');
  const stamp = ymd(new Date());
  if (!withFiles) {
    const head = { v: 2, at: Date.now(), ls: lsAll(), files: [] };
    await saveBlob(new Blob([JSON.stringify(head)], { type: 'application/json' }),
      `${name}-${stamp}.json`, false);
    return;
  }
  toast('جارٍ تجميع الملفات…');
  const parts = [], meta = [];
  for (const k of bkFileKeys()) {
    const b = await getFile(k);
    if (!b) continue;
    meta.push({ k, type: b.type || '', size: b.size || 0 });
    parts.push(b);
  }
  const head = JSON.stringify({ v: 2, at: Date.now(), ls: lsAll(), files: meta });
  const hb = new TextEncoder().encode(head);
  const blob = new Blob([BK_MAGIC, bkPad8(hb.length), hb, ...parts], { type: 'application/octet-stream' });
  await saveBlob(blob, `${name}-${stamp}.mspace`, false);
}

/* ---------- استيراد ---------- */
async function bkRead(file) {
  const first = await file.slice(0, 16).text();
  if (first.slice(0, 8) === BK_MAGIC) {
    const hlen = +first.slice(8, 16);
    const head = JSON.parse(await file.slice(16, 16 + hlen).text());
    return { head, body: file.slice(16 + hlen) };
  }
  const d = JSON.parse(await file.text());
  return { head: d, body: null };
}
async function bkImport(file, mode) {
  const { head, body } = await bkRead(file);
  /* الصيغة القديمة: {site,tree,quotes,notes,hls,fav,cards} */
  if (!head.ls) {
    const old = head;
    if (old.site) S.set('site', old.site);
    if (old.tree) S.set('tree', old.tree);
    if (old.quotes) S.set('quotes', old.quotes);
    if (old.notes) S.set('notes', old.notes);
    if (old.hls) S.set('hls', old.hls);
    if (old.fav) S.set('fav', old.fav);
    if (old.cards) S.set('cards', old.cards);
    return { keys: 7, files: 0, miss: 0 };
  }
  if (mode === 'replace') {
    try {
      const drop = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i); if (k && k.slice(0, 3) === 'ws_') drop.push(k);
      }
      drop.forEach(k => localStorage.removeItem(k));
    } catch (e) {}
  }
  let keys = 0;
  Object.keys(head.ls || {}).forEach(k => {
    try { localStorage.setItem(k, head.ls[k]); keys++; } catch (e) {}
  });
  let files = 0, miss = 0;
  if (body && (head.files || []).length) {
    let off = 0;
    for (const f of head.files) {
      const slice = body.slice(off, off + f.size, f.type || '');
      off += f.size;
      try { await putFile(f.k, slice); files++; } catch (e) { miss++; }
    }
  } else if ((head.files || []).length) miss = head.files.length;
  return { keys, files, miss };
}

/* ---------- اللوحة ---------- */
function bkSheet() {
  sheet(`<h3>النسخة الاحتياطية</h3>
    <p class="mkempty" style="line-height:1.95">مساحتك محفوظة في متصفّح هذا الجهاز وحده.
      خذ منها نسخة متى شئت، واستعدها في أيّ جهاز فيعود كلّ شيء كما تركته.</p>
    <div class="pcardx" style="margin:10px 0 0;padding:12px">
      <b style="font-size:13.5px">نسخة شاملة — كلّ شيء ومعه ملفاتك</b>
      <p class="hintp" style="margin:6px 0 9px">الأقسام والفوائد والتظليلات والاقتباسات والكتابات
        والخرائط والعلامات والتفريغ والجدول والأهداف والمهام والبطاقات والتأريخ وكلّ تخصيصاتك —
        ومعها ملفات المقرّرات نفسها (PDF وصوت وفيديو وصور).</p>
      <div class="sheetrow" style="margin:0">
        <button class="btn pri" data-bkp="full">${ICON.dl} نسخة شاملة</button>
        <span class="empty2s" id="bkSz">…</span></div>
    </div>
    <div class="pcardx" style="margin:10px 0 0;padding:12px">
      <b style="font-size:13.5px">نسخة المساحة — بلا الملفات</b>
      <p class="hintp" style="margin:6px 0 9px">كلّ ما سبق إلّا ملفات المقرّرات، فتكون صغيرة
        سريعة تصلح للنقل السريع بين أجهزتك.</p>
      <div class="sheetrow" style="margin:0">
        <button class="btn" data-bkp="lite">${ICON.dl} تصدير</button></div>
    </div>
    <div class="pcardx" style="margin:10px 0 0;padding:12px">
      <b style="font-size:13.5px">استعادة</b>
      <p class="hintp" style="margin:6px 0 9px">اختر ملف النسخة (.mspace أو .json).
        «دمج» يُبقي ما عندك ويضيف إليه، و«استبدال» يمسح ما في هذا الجهاز ويضع النسخة مكانه.</p>
      <div class="sheetrow" style="margin:0">
        <button class="btn" data-bkp="merge">${ICON.plus} دمج</button>
        <button class="btn" data-bkp="replace">${ICON.refresh} استبدال</button></div>
    </div>
    <div class="sheetrow"><button class="btn" data-bkp="diag">${ICON.info} فحص التخزين</button>
      <button class="btn" onclick="closeSheet()">إغلاق</button></div>
    <div id="bkOut" style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:10px"></div>`, el => {
    bkSize().then(s => { const e = el.querySelector('#bkSz');
      if (e) e.textContent = s.n ? `${AR(s.n)} ملفًا · ${mb(s.bytes)}` : 'لا ملفات بعد'; });
    el.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-bkp]'); if (!b) return;
      const a = b.dataset.bkp, out = el.querySelector('#bkOut');
      if (a === 'full' || a === 'lite') {
        out.textContent = 'جارٍ التجهيز…';
        try { await bkExport(a === 'full'); out.textContent = 'تمّ — احفظ الملف في مكان تعود إليه.'; }
        catch (e) { out.innerHTML = '<b style="color:#b4472e">تعذّر التصدير</b> — قد تكون النسخة أكبر من طاقة المتصفّح؛ جرّب «بلا الملفات».'; }
        return;
      }
      if (a === 'diag') { out.textContent = 'جارٍ الفحص…';
        const s = await bkSize();
        const all = bkFileKeys().length;
        out.innerHTML = `الملفات المذكورة: <b>${AR(all)}</b> — الموجودة فعلًا: <b>${AR(s.n)}</b>`
          + (all - s.n ? ` — <b style="color:#b4472e">مفقودة: ${AR(all - s.n)}</b>` : '')
          + `<br>حجم المحفوظ: <b>${mb(s.bytes)}</b>`;
        return;
      }
      /* استعادة */
      const inp = document.createElement('input');
      /* بلا تضييق: بعض المتصفّحات تحفظ الملف باسمٍ بلا امتداد، والصيغة تُعرَف من داخله */
      inp.type = 'file';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        out.textContent = 'جارٍ الاستعادة…';
        try {
          const r = await bkImport(f, a);
          out.innerHTML = `تمّت الاستعادة — <b>${AR(r.keys)}</b> من الإعدادات والمحتوى`
            + (r.files ? ` و<b>${AR(r.files)}</b> ملفًا` : '')
            + (r.miss ? ` — <b style="color:#b4472e">${AR(r.miss)}</b> لم تُستعد (النسخة بلا ملفات)</b>` : '')
            + '<br>سيُعاد تحميل الصفحة…';
          setTimeout(() => location.reload(), 1200);
        } catch (e) { out.innerHTML = '<b style="color:#b4472e">ملف غير صالح</b> — تأكّد أنّه ملف نسخة من «مساحتي».'; }
      };
      inp.click();
    });
  });
}


/* ================= التطبيق: تثبيت وتحديث وعمل بلا إنترنت ================= */
const APP_VER='2.3.1';
let pwaPrompt=null;
const isStandalone=()=>{ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } };
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); pwaPrompt=e;
  try{ if((location.hash||'#/')==='#/' && !document.querySelector('.pwastrip') && !document.querySelector('.sheet')) render(); }catch(_){} });
addEventListener('appinstalled',()=>{ pwaPrompt=null; S.set('pwaHide',true); toast('ثُبّت مساحتي على جهازك'); });
function installStrip(){
  try{
    if(S.get('pwaHide',false) || isStandalone() || !matchMedia('(max-width:819px)').matches) return '';
    if(!pwaPrompt && !isIOS()) return '';
    return `<div class="pwastrip"><span class="ic">${ICON.pin}</span>
      <div><b>ثبّت مساحتي على هاتفك</b><small>يفتح كتطبيق، ويعمل حتى بلا إنترنت</small></div>
      <button class="btn pri" style="min-height:34px;padding:6px 11px;font-size:12px" data-pwa="install">تثبيت</button>
      <button class="x" data-pwa="hide" aria-label="إخفاء">✕</button></div>`;
  }catch(e){ return ''; }
}
function iosInstallSheet(){
  sheet(`<h3>ثبّت مساحتي على آيفون</h3>
    <div class="helplist">
      <div class="helprow"><b>١ — افتح الموقع في سفاري</b><span>التثبيت لا يعمل من متصفح آخر على آيفون.</span></div>
      <div class="helprow"><b>٢ — اضغط زرّ المشاركة</b><span>المربّع الذي يخرج منه سهم، أسفل الشاشة.</span></div>
      <div class="helprow"><b>٣ — «إضافة إلى الشاشة الرئيسية»</b><span>ثم «إضافة» في الأعلى — وستجد أيقونة مساحتي بين تطبيقاتك.</span></div>
    </div>
    <div class="sheetrow"><button class="btn" onclick="closeSheet()">فهمت</button></div>`);
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-pwa]'); if(!b) return;
  const k=b.dataset.pwa;
  if(k==='hide'){ S.set('pwaHide',true); const s=b.closest('.pwastrip'); if(s) s.remove(); return; }
  if(k==='install'){
    if(isStandalone()){ toast('مساحتي مثبّت بالفعل على هذا الجهاز'); return; }
    if(pwaPrompt){ try{ pwaPrompt.prompt(); const r=await pwaPrompt.userChoice; if(r&&r.outcome==='accepted') pwaPrompt=null; }catch(e){} return; }
    if(isIOS()){ iosInstallSheet(); return; }
    sheet(`<h3>التثبيت على الجهاز</h3>
      <p class="mkempty">افتح الموقع في كروم أو إدج، ثم من قائمة المتصفح (⋮) اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.
      ${/^https?:$/.test(location.protocol)?'':'<br><br>التثبيت يحتاج أن يكون الموقع مرفوعًا على عنوان إنترنت (https).'}</p>
      <div class="sheetrow"><button class="btn" onclick="closeSheet()">فهمت</button></div>`);
    return;
  }
  if(k==='check') hostCheck();
});
async function hostCheck(){
  const out=document.getElementById('hostOut'); if(!out) return;
  const rows=[]; const ok=(t,g,d)=>rows.push(`<div style="display:flex;gap:8px;align-items:flex-start"><span style="flex:none">${g?'✅':'⚠️'}</span><span><b>${t}</b>${d?' — '+d:''}</span></div>`);
  out.innerHTML='جارٍ الفحص…';
  const https=location.protocol==='https:';
  ok('عنوان آمن (https)', https, https? location.host : (location.protocol==='http:'?'الموقع يُفتح بلا تشفير — فعّل شهادة SSL من لوحة الاستضافة':'الموقع مفتوح كملف من الجهاز — التثبيت والتطبيق يحتاجان رفعه على استضافة'));
  let sw=false; try{ sw=!!(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration()); }catch(e){}
  ok('العمل بلا إنترنت', sw, sw?'مفعّل — الموقع يفتح ولو انقطع الاتصال':'غير مفعّل بعد — أعد تحميل الصفحة مرّة');
  ok('مثبّت كتطبيق', isStandalone(), isStandalone()?'':'اضغط «ثبّت على الجهاز»');
  let px=false, pxMsg='';
  if(/^https?:$/.test(location.protocol)){
    try{ const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
      const base=location.pathname.replace(/[^/]*$/,'');
      const r=await fetch(base+'api/tg.php?url='+encodeURIComponent('https://t.me/s/telegram'),{signal:ctl.signal}); clearTimeout(to);
      const t=await r.text(); px=r.ok&&/tgme/.test(t); pxMsg=px?'يعمل من استضافتك — جلب تيليجرام سريع وموثوق':('الردّ: '+r.status+' — تأكّد أن مجلد api مرفوع وأن PHP مفعّل');
    }catch(e){ pxMsg='لم يردّ — تأكّد أن مجلد api مرفوع بجانب index.html'; }
  } else pxMsg='يعمل بعد الرفع على الاستضافة';
  ok('وسيط تيليجرام الخاص', px, pxMsg);
  let fonts=false; try{ await document.fonts.ready; fonts=document.fonts.check('16px "IBM Plex Sans Arabic"')||document.fonts.check('16px "Amiri"'); }catch(e){}
  ok('الخطوط العربية', fonts, fonts?'محمَّلة':'لم تُحمَّل — تحقّق من الاتصال بالإنترنت');
  let persist=null; try{ if(navigator.storage&&navigator.storage.persisted) persist=await navigator.storage.persisted(); }catch(e){}
  ok('تخزين دائم للملفات', persist!==false, persist===null?'المتصفح لا يفصح':(persist?'المتصفح لن يحذف ملفاتك تلقائيًا':'قد يحذف المتصفح الملفات عند ضيق المساحة — ثبّت التطبيق أو أنشئ نسخة كاملة'));
  let est=''; try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); est=mb(e.usage||0)+' من '+mb(e.quota||0); } }catch(e){}
  if(est) ok('المساحة المستعملة', true, est);
  out.innerHTML=rows.join('');
}
/* عامل الخدمة: يجعل الموقع يفتح بلا إنترنت ويحدّث نفسه بهدوء */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller) updToast(); }); });
    }).catch(()=>{});
  });
}
function updToast(){
  if(document.querySelector('.updtoast.upd')) return;
  const t=document.createElement('div'); t.className='updtoast upd';
  t.innerHTML=`<span>نسخة جديدة من مساحتي جاهزة</span><button>حدّث الآن</button><button class="x" aria-label="لاحقًا">✕</button>`;
  t.querySelector('button').onclick=()=>location.reload();
  t.querySelector('.x').onclick=()=>t.remove();
  document.body.appendChild(t);
}
addEventListener('offline',()=>toast('انقطع الإنترنت — مكتبتك وملفاتك تعمل كما هي'));
addEventListener('online',()=>toast('عاد الاتصال'));

applyTheme();
try{buildNav();}catch(e){}
try{startHints();}catch(e){}
render();

</script>
