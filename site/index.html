<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d6e5f">
<meta name="description" content="مساحتي — مكتبتك الشخصية: دروسك وملفاتك وفوائدك وجدولك في مكان واحد، تعمل على هاتفك وحاسوبك وتحفظ كل شيء في جهازك.">
<meta name="application-name" content="مساحتي">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مساحتي">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="مساحتي — مكتبتي الشخصية">
<meta property="og:description" content="دروسك وملفاتك وفوائدك وجدولك في مكان واحد.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/og.jpg">
<title>مساحتي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontsCore" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<script id="pdfjs" src="lib/pdf.min.js" defer></script>
<style>
:root{
  --acc:#0d6e5f;
  --bg:#f7f5f0; --bg2:#efece4; --card:#fff; --ink:#1d2321; --muted:#6c7471;
  --line:#e4dfd4; --acc-soft:#e7f1ef; --gold:#a97f2e; --gold-soft:#f6efdd;
  --shadow:0 1px 2px rgba(24,38,34,.05), 0 8px 24px -12px rgba(24,38,34,.18);
  --radius:18px;
  --ui:'IBM Plex Sans Arabic','Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
  --serif:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --disp:'Aref Ruqaa','Amiri',serif;
  --side:256px;
  --safeb:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101413; --bg2:#171c1a; --card:#191f1d; --ink:#e9eae7; --muted:#99a29e;
    --line:#293230; --acc-soft:#14302b; --gold:#d9b463; --gold-soft:#2a2418;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#101413; --bg2:#171c1a; --card:#191f1d; --ink:#e9eae7; --muted:#99a29e;
  --line:#293230; --acc-soft:#14302b; --gold:#d9b463; --gold-soft:#2a2418;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
}
/* شامواه: ورق مصفرّ يريح العين */
:root[data-theme="sepia"]{
  --bg:#f2e8d5; --bg2:#ebdfc7; --card:#faf3e4; --ink:#3b3226; --muted:#7d705c;
  --line:#ddcfb4; --acc-soft:#e3ecdf; --gold:#96702a; --gold-soft:#f0e3c6;
  --shadow:0 1px 2px rgba(80,60,30,.07), 0 8px 22px -14px rgba(80,60,30,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;
  direction:rtl;-webkit-text-size-adjust:100%;overflow-wrap:anywhere;
  padding-bottom:calc(150px + var(--safeb))}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--line)}
.hwrap{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none;box-shadow:var(--shadow);font-family:var(--disp)}
.brand b{font-size:15.5px;font-weight:800;display:block;line-height:1.25}
.logo.haspic{background-size:cover;background-position:center;color:transparent;font-size:0}
.avprev{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--acc-soft);color:var(--acc);font-weight:800;font-size:17px;
  background-size:cover;background-position:center;border:1px solid var(--line)}
.brand span{font-size:11.5px;color:var(--muted)}
.hbtns{margin-inline-start:auto;display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--card);transition:.15s}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on svg{fill:var(--gold);stroke:var(--gold)}
@media(max-width:520px){
  .hwrap{padding:9px 12px;gap:8px}
  #brandTag{display:none}
  .hbtns{gap:4px}
  .iconbtn{width:34px;height:34px;border-radius:10px}
  .iconbtn svg{width:17px;height:17px}
}
@media(max-width:360px){ .iconbtn{width:31px;height:31px} .iconbtn svg{width:16px;height:16px} }
nav.top{display:none;border-bottom:1px solid var(--line);background:var(--bg)}
nav.top .in{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:2px;flex-wrap:wrap}
nav.top a{padding:11px 13px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
nav.top a.on{color:var(--acc);border-color:var(--acc);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}

/* ---------- home ---------- */
.hero{border-radius:24px;padding:26px 20px;margin-bottom:18px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 92%,#000),color-mix(in srgb,var(--acc) 55%,#000));
  color:#fff;box-shadow:var(--shadow)}
.hero::after{content:'';position:absolute;inset:0;opacity:.14;pointer-events:none;
  background:radial-gradient(circle at 80% 10%,#fff,transparent 45%),
             repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 22px)}
.hero h1{position:relative;font-family:var(--disp);font-size:34px;margin:0 0 6px;line-height:1.35;text-wrap:balance}
.hero .contbtn{position:relative;z-index:2}
.hero p{position:relative;margin:0;opacity:.92;font-size:14px;line-height:1.9;max-width:60ch}
.hstats{position:relative;display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.hstats span{font-size:11.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  padding:5px 11px;border-radius:99px}
.hstats b{font-weight:800}

.wall{position:relative;border-radius:22px;padding:18px 14px 22px;margin-bottom:20px;
  background:var(--bg2);border:1px solid var(--line);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1px);
  background-size:14px 14px}
.wall .rope{height:2px;background:color-mix(in srgb,var(--ink) 22%,transparent);margin:6px 8px 20px;border-radius:2px}
.notes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.note{position:relative;max-width:min(300px,90vw);min-width:120px;padding:18px 14px 12px;border-radius:4px;
  font-family:var(--serif);line-height:1.9;color:#2a2622;cursor:pointer;flex:0 1 auto;
  box-shadow:0 10px 20px -10px rgba(0,0,0,.45);transition:.18s}
.note:hover{transform:translateY(-3px) rotate(0deg)!important}
.note::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:#c05d4a;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.note small{display:block;margin-top:10px;font-family:var(--ui);font-size:10.5px;opacity:.6}
.contbtn{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;
  padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:800;backdrop-filter:blur(4px)}
.contbtn svg{width:17px;height:17px;stroke:currentColor;fill:currentColor;stroke-width:0}
.contbtn:hover{background:rgba(255,255,255,.28)}
.wallempty{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px;line-height:2}

.sechead{display:flex;align-items:baseline;gap:8px;margin:26px 0 12px}
.sechead h2{font-size:17px;margin:0;font-weight:800}
.sechead .ln{flex:1;height:1px;background:var(--line)}
.sechead a,.sechead button{font-size:12.5px;color:var(--acc);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);display:flex;gap:11px;align-items:center;transition:.15s}
.tile:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.tile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--acc-soft);color:var(--acc);font-weight:800}
.tile .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.tile b{display:block;font-size:14.5px;font-weight:700}
.tile small{color:var(--muted);font-size:11.5px}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px;box-shadow:var(--shadow);transition:.15s;position:relative}
.row:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.badge{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center}
.badge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.b-pdf{background:var(--gold-soft);color:var(--gold)}
.b-audio{background:var(--acc-soft);color:var(--acc)}
.b-video{background:#fde9e4;color:#c0553a}
.b-youtube{background:#ffe3e3;color:#c33}
.b-text{background:#e8ecfb;color:#4257a8}
.b-link{background:#e7f3ff;color:#2f6ea8}
.b-img{background:#eaf7ec;color:#3b8a53}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-video{background:#33211c;color:#e08a6d}
  :root:not([data-theme="light"]) .b-text{background:#1c2236;color:#8ea0e8}
  :root:not([data-theme="light"]) .b-youtube{background:#341d1d;color:#e08080}
  :root:not([data-theme="light"]) .b-link{background:#17293a;color:#7fb2e0}
  :root:not([data-theme="light"]) .b-img{background:#17301f;color:#7cc48f}}
:root[data-theme="dark"] .b-video{background:#33211c;color:#e08a6d}
:root[data-theme="dark"] .b-text{background:#1c2236;color:#8ea0e8}
:root[data-theme="dark"] .b-youtube{background:#341d1d;color:#e08080}
:root[data-theme="dark"] .b-link{background:#17293a;color:#7fb2e0}
:root[data-theme="dark"] .b-img{background:#17301f;color:#7cc48f}
.rmeta{min-width:0;flex:1}
.rmeta b{display:block;font-size:14.5px;font-weight:700;line-height:1.45}
.rmeta .s{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pill.note{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.playbtn{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--acc);color:#fff;box-shadow:0 4px 12px -4px var(--acc)}
.playbtn svg{width:16px;height:16px;fill:currentColor;stroke:none}
.favbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--bg2);color:var(--muted);flex:none}
.favbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.favbtn.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.favbtn.on svg{fill:var(--gold)}
.rowdone{position:absolute;inset-inline-start:-1px;top:14px;bottom:14px;width:3px;border-radius:99px;background:var(--acc)}

/* ---------- detail / viewers ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:12px;font-weight:700}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.phead{padding:16px}
.phead .kind{font-size:11.5px;font-weight:700;color:var(--acc);margin-bottom:5px}
.phead h1{font-size:21px;margin:0 0 5px;line-height:1.35;text-wrap:balance}
.phead p{margin:0;color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:13px;font-size:13px;
  font-weight:700;border:1px solid var(--line);background:var(--bg2);transition:.15s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.gold{background:var(--gold);color:#fff;border-color:transparent}
.btn:hover{filter:brightness(1.05)}
.viewer{width:100%;height:min(76vh,760px);border:0;border-top:1px solid var(--line);background:var(--bg2);display:block}
video.viewer{height:auto;max-height:74vh;background:#000}
.fallback{padding:14px 16px;border-top:1px solid var(--line);display:none;flex-direction:column;gap:10px;
  font-size:12.5px;color:var(--muted);line-height:1.9;background:var(--bg2)}
.fallback>div:first-child{display:flex;gap:9px;align-items:flex-start}
.fallback svg{width:17px;height:17px;flex:none;margin-top:3px;stroke:currentColor;fill:none;stroke-width:1.8}
.fallback.show{display:flex}
.vtools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 16px 0;font-size:12.5px;color:var(--muted)}
.vtools .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.vtools .chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.vtools .vhint{flex:1 1 100%;font-size:11.5px;line-height:1.75;margin-top:2px}
.ytswitch{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 16px 0;font-size:12.5px;color:var(--muted)}
.ytswitch .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none}
.ytswitch .chip.on{background:var(--acc);color:#fff;border-color:transparent}
.ytswitch .chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.fallback.always{display:flex}
.fallback.warn{background:var(--gold-soft);color:var(--ink);border-top-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.tgframe{height:520px;background:var(--bg2)}
.pdftools{display:flex;gap:8px;align-items:center;padding:11px 16px 0;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.drawtip{display:none;margin:9px 16px 0;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.75;
  background:var(--gold-soft);color:#6b5113;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.drawtip.on{display:block}
.tgl{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);font-size:13px;font-weight:700}
.tgl.on{background:var(--gold);color:#fff;border-color:transparent}
.tgl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.swatches{display:flex;gap:6px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line) inset;flex:none;padding:0}
.swatch.on{border-color:var(--ink)}
.pdfbox{position:relative;border-top:1px solid var(--line);background:var(--bg2);max-height:min(76vh,780px);
  overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:12px}
.pdfbox.full{position:fixed;inset:0;z-index:100;max-height:none;border-radius:0;
  padding:10px 10px calc(14px + var(--safeb));background:var(--bg)}
body.reading .pdfbox.full{padding:8px 12px}
body.rdwide .pdfbox.full{padding-inline:0}
body.reading .pdfbox.full .pg{box-shadow:none;border-radius:4px}
@media(min-width:820px){ body.reading:not(.rdwide) .pdfbox.full .pg{max-width:780px;margin:0 auto} }
.pdfbox .pg{width:100%;flex:0 0 auto;background:#fff;border-radius:8px;overflow:hidden;position:relative;
  box-shadow:0 2px 10px -4px rgba(0,0,0,.35)}
.pdfbox .pg canvas{display:block;width:100%;height:auto}
.pdfmsg{padding:24px 14px;text-align:center;color:var(--muted);font-size:13px}
.resume{position:sticky;top:6px;z-index:5;align-self:center;background:var(--acc);color:#fff;font-size:12px;
  font-weight:700;padding:6px 13px;border-radius:99px;box-shadow:var(--shadow);transition:opacity .5s}
.resume.fade{opacity:0}
.fsbar{position:fixed;top:0;inset-inline:0;z-index:101;display:none;align-items:center;gap:10px;
  padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.fsbar.on{display:none}
/* ===== بيئة القراءة ===== */
body.reading{overflow:hidden}
.rdtop,.rdbot{position:fixed;inset-inline:0;z-index:110;display:none;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);
  align-items:center;gap:4px;padding:8px 10px}
.rdtop{top:0;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.rdbot{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  flex-direction:column;gap:6px}
body.reading.bars .rdtop,body.reading.bars .rdbot{display:flex}
.rdtop .rb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:none;border:0;color:var(--ink);cursor:pointer}
.rdtop .rb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rdtop .rb.on{background:var(--acc-soft);color:var(--acc)}
.rdtop .rt{flex:1;min-width:0;font-size:13px;font-weight:700;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.rdbot input[type=range]{width:100%}
.rdbot .rdpg{font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.rdbot .rdrow{display:flex;align-items:center;gap:10px;width:100%}
.rdhl{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.rdhl .swatch{width:24px;height:24px}
.rdtip{position:fixed;z-index:109;inset-inline:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
.rdtip.on{opacity:1}
.rdtip span{background:rgba(20,26,24,.82);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px}
.hlayer{position:absolute;inset:0;pointer-events:none}
.hlayer.draw{pointer-events:auto;touch-action:pan-y;cursor:crosshair}
.hmark{position:absolute;width:20px;height:20px;margin:-10px -10px 0 0;border-radius:50%;

  pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.65}}
.hrect{position:absolute;border-radius:5px;mix-blend-mode:multiply;pointer-events:auto;cursor:pointer;border:1px solid rgba(0,0,0,.12)}
.hrect.has{outline:2px solid var(--gold);outline-offset:-1px}
mark.hl{background:var(--hc,#ffe27a);color:#16201d;border-radius:3px;padding:0 1px;cursor:pointer;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hl.has{box-shadow:inset 0 -2.5px 0 var(--gold)}
.seltool{position:fixed;z-index:120;display:flex;gap:7px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:15px;padding:8px 10px;box-shadow:var(--shadow)}
.seltool button.mini{font-size:12px;font-weight:700;color:var(--acc);padding:4px 6px}
.article{padding:8px 18px 24px;font-family:var(--serif);font-size:var(--asz,19px);line-height:2.1;
  border-top:1px solid var(--line);max-width:64ch;white-space:pre-wrap}
.fsz{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:12px 18px 0}

/* ---------- forms / sheets ---------- */
.fieldset{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:15px;display:grid;gap:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=url],.field input[type=number],.field select,textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);
  color:var(--ink);font-family:inherit;font-size:14.5px;outline:none}
textarea{min-height:120px;font-family:var(--serif);font-size:17px;line-height:1.95;resize:vertical}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
.sheet{position:fixed;inset:0;z-index:130;background:rgba(10,15,13,.5);display:flex;align-items:flex-end;justify-content:center}
.sheetcard{background:var(--card);width:min(560px,100%);border-radius:22px 22px 0 0;padding:16px;
  box-shadow:var(--shadow);max-height:88vh;overflow:auto;padding-bottom:calc(16px + var(--safeb))}
.sheetcard h3{margin:0 0 10px;font-size:15.5px;font-weight:800}
.sheetrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.danger{color:#b4472e;font-weight:700;font-size:13px;padding:9px 12px;border-radius:12px;border:1px solid var(--line)}
.quote{font-family:var(--serif);font-size:16px;line-height:1.95;background:var(--bg2);border-radius:12px;
  padding:10px 12px;margin-bottom:12px;max-height:160px;overflow:auto}
@media(min-width:820px){.sheet{align-items:center}.sheetcard{border-radius:22px}}
.rich{min-height:40vh;max-height:52vh;overflow:auto;padding:13px;border-radius:14px;border:1px solid var(--line);
  background:var(--bg2);font-family:var(--serif);font-size:18px;line-height:2;outline:none}
.rich:focus{border-color:var(--acc);background:var(--card)}
.rtools{display:flex;gap:6px;margin-bottom:8px}
.rtools{flex-wrap:wrap;align-items:center}
.rtools button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:800}
.rtsep{width:1px;height:24px;background:var(--line);margin:0 2px}
.rtools .rtsw{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);padding:0;font-size:14px}
.rtools .rtsw.fg{background:var(--card);font-weight:900}
.rtools .rtsw.more{background:var(--bg2);color:var(--muted);font-size:17px;line-height:1}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;line-height:2}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;
  box-shadow:var(--shadow);margin-bottom:10px}
.ncard .t{font-size:13px;font-weight:800;color:var(--acc);display:block}
.ncard .b{font-family:var(--serif);font-size:17px;line-height:2}
.b.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.9}
.tap{cursor:pointer}
mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px;font-weight:700}
.sbox{position:relative;margin-bottom:14px}
.sbox input{width:100%;padding:13px 42px 13px 14px;border-radius:15px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:14.5px;outline:none;box-shadow:var(--shadow)}
.sbox svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted);fill:none;stroke-width:1.8}
.editor{display:grid;gap:14px}
@media(min-width:900px){.editor{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.preview{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:76px}
.preview canvas{width:100%;max-width:330px;height:auto;border-radius:10px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cthumb{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:9px;display:flex;flex-direction:column;gap:8px}
.cthumb canvas{width:100%;height:auto;border-radius:10px;display:block;cursor:pointer}
.cthumb .r{display:flex;gap:6px;align-items:center}
.cthumb .t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pal{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pal button[data-pal]{width:34px;height:34px;border-radius:11px;border:2px solid transparent;
  box-shadow:0 0 0 1px var(--line) inset;flex:none;padding:0}
.pal .chip{flex:none}
input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);padding:2px}

/* ---------- player ---------- */
#player{position:fixed;inset-inline:0;bottom:0;z-index:60;transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
#player.up{transform:none}
.pin{max-width:1100px;margin:0 auto;padding:0 10px calc(64px + var(--safeb))}
.pcard{background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 -6px 30px -12px rgba(0,0,0,.35);padding:9px 11px 10px}
.prow{display:flex;align-items:center;gap:9px}
.pt{min-width:0;flex:1}
.pt b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small{color:var(--muted);font-size:11px}
.pbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.pbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pbtn.main{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff}
.pbtn.main svg{width:18px;height:18px;fill:currentColor;stroke:none}
.rate{font-size:11.5px;font-weight:800;color:var(--acc);padding:5px 8px;border-radius:9px;background:var(--acc-soft);flex:none}
.seek{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:99px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--acc);cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--acc)}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:70;background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safeb)}
.tabbar a{flex:1;padding:8px 2px 9px;text-align:center;color:var(--muted);font-size:10.5px;font-weight:700;
  min-width:0;overflow:hidden}
.tabbar a span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* إن كثُرت الأقسام ضاقت الخانات ثم انزلق الشريط أفقيًّا — ولا «مزيد» */
.tabbar.many{overflow-x:auto;scrollbar-width:none}
.tabbar.many::-webkit-scrollbar{display:none}
.tabbar.many a{flex:0 0 auto;min-width:16.4vw;font-size:9.6px;padding-inline:1px}
.tabbar.many::after{content:'';position:sticky;inset-inline-start:0;width:18px;flex:0 0 0;
  background:linear-gradient(to right,var(--card),transparent);pointer-events:none;align-self:stretch}
.tabbar.many svg{width:19px;height:19px}
@media(min-width:560px){.tabbar.many a{min-width:0;flex:1}}
.tabbar a.on{color:var(--acc)}
.tabbar .moretab{flex:1;padding:8px 2px 9px;text-align:center;color:var(--muted);font-size:10.5px;
  font-weight:700;background:none;border:0;font-family:inherit;cursor:pointer}
.tabbar .moretab svg{width:21px;height:21px;margin:0 auto 3px;display:block;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar .moretab span{display:block}
.morelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.morecell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border-radius:15px;
  background:var(--bg2);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.morecell .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--acc-soft);color:var(--acc)}
.morecell .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.morecell b{font-size:12.5px;font-weight:700;text-align:center;line-height:1.5}
/* زرّ الشرح i */
.ibtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);
  color:var(--muted);font-weight:800;font-size:12px;font-family:inherit;cursor:pointer;flex:none;line-height:1}
.ibtn:active{background:var(--acc-soft);color:var(--acc)}
.heroi{position:absolute;z-index:3;inset-inline-start:14px;top:14px;width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-weight:800;font-size:12px;font-family:inherit;cursor:pointer;line-height:1}
.helplist{display:flex;flex-direction:column;gap:10px;margin:4px 0 2px}
.helprow b{display:block;font-size:13px;margin-bottom:2px}
.helprow span{display:block;font-size:12.5px;color:var(--muted);line-height:1.9}
/* زرّ البداية العائم */
.startbtn{position:fixed;z-index:78;inset-inline:0;bottom:calc(70px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;pointer-events:none}
.startbtn button{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
  background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 18px;
  font:inherit;font-size:13px;font-weight:800;box-shadow:0 10px 26px -10px rgba(13,110,95,.7);cursor:pointer}
.startbtn button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.startbtn .x{margin-inline-start:-6px;background:var(--card);color:var(--muted);
  width:30px;height:30px;padding:0;border:1px solid var(--line);box-shadow:none;font-size:15px}
@media(min-width:900px){.startbtn{bottom:24px}}
/* الهامش المرتبط بمقرَّر */
.wref{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--acc);
  background:var(--acc-soft);border-radius:999px;padding:3px 10px;margin-bottom:7px;text-decoration:none}
.wref svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
/* الوضع البسيط: إخفاء ما وُسم تفصيليًّا */
body.lite .advonly{display:none!important}
.tabbar svg{width:21px;height:21px;margin:0 auto 3px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
@media(min-width:820px){
  body{padding-bottom:120px}
  nav.top{display:block}
  .tabbar{display:none}
  .pin{padding-bottom:14px;max-width:780px}
  .hero h1{font-size:42px}
  .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px}
  .rows.one{display:flex}
}

.daytop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

.empty2 b{display:block;font-size:14px}.empty2 small{display:block;font-size:11.5px;color:var(--muted)}
.empty2s{font-size:12px;color:var(--muted);padding:4px}
.cal .calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}

@media(min-width:900px){#player.up ~ .planfab{inset-block-end:110px}}
.nowhint{position:fixed;top:calc(102px + env(safe-area-inset-top));right:12px;z-index:90;
  max-width:min(74vw,290px);padding:10px 30px 10px 13px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(20,30,28,.4);
  transform:translateX(120%);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .35s;cursor:pointer}
.nowhint.on{transform:translateX(0);opacity:1}
.nowhint b{display:block;font-size:10.5px;color:var(--acc);font-weight:800;margin-bottom:2px}
.nowhint span{display:block;font-size:12.5px;line-height:1.7;color:var(--ink)}
.nowhint small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.nowhint .x{position:absolute;top:6px;left:8px;font-style:normal;font-size:15px;color:var(--muted);line-height:1}
.nowhint.muse{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.nowhint.muse b{color:#6b5113}


/* ===== قنوات تيليجرام ===== */
.chgrid{display:grid;grid-template-columns:1fr;gap:10px;padding:0 16px 14px}
@media(min-width:640px){.chgrid{grid-template-columns:1fr 1fr}}
.chcard{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none}
.chcard img,.chcard .chav{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover}
.chcard .chav{display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:800;font-size:18px}
.chcard div{flex:1;min-width:0}
.chcard b{display:block;font-size:14px;color:var(--ink)}
.chcard small{display:block;font-size:11.5px;color:var(--muted);direction:ltr;text-align:right}
.note2{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.8;color:var(--muted)}
.note2 svg{width:16px;height:16px;flex:none;margin-top:3px;stroke:currentColor;fill:none;stroke-width:1.7}
.tgfeed{display:flex;flex-direction:column;gap:12px;padding:0 16px 20px}
.tgpost{padding:13px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tgtop{margin-bottom:8px}
.tgtop b{display:block;font-size:14px;line-height:1.6}
.tgtop small{display:block;font-size:11px;color:var(--muted)}
.tgimg,.tgvid{width:100%;border-radius:13px;display:block;margin:0 0 9px;background:var(--bg2)}
.tgtext{font-size:14.5px;line-height:2;white-space:pre-wrap;word-break:break-word}
.tgtext a{color:var(--acc)}
.tgdoc{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:7px 11px;border-radius:11px;
  background:var(--bg2);font-size:12.5px}
.tgdoc svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.tgacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.sm svg{width:14px;height:14px}
.tgstat{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.8}


.chlive{position:relative;margin:0 16px 14px;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);background:var(--bg2);height:min(76vh,820px)}
.chlive iframe{width:100%;height:100%;border:0;display:block;background:var(--bg2)}
.chlive.full{position:fixed;inset:0;margin:0;z-index:100;height:100dvh;border-radius:0;
  padding-top:env(safe-area-inset-top)}
.chlive .chclose{display:none}
.chlive.full .chclose{display:grid;place-items:center;position:absolute;z-index:2;
  top:calc(9px + env(safe-area-inset-top));left:11px;width:38px;height:38px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:21px;line-height:1;cursor:pointer;
  box-shadow:0 6px 20px -8px rgba(20,30,28,.45)}


/* ===== مصمّم البطاقات ===== */
.c2wrap{padding:0 16px 20px;display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.c2stage{background:var(--bg2);border-radius:var(--radius);padding:12px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center}
.c2stage canvas{max-width:100%;max-height:42vh;width:auto;height:auto;display:block;border-radius:10px;
  box-shadow:0 10px 30px -14px rgba(20,30,28,.5)}
/* على الشاشة الواسعة: الصورة في جهة والتحكّم في الجهة الأخرى */
@media(min-width:780px){
  .c2wrap{grid-template-columns:minmax(0,420px) minmax(0,1fr);
    grid-template-areas:'stage tabs' 'stage pane' 'stage pane2' 'stage pane3' 'stage pane4' 'stage acts'}
  .c2stage{grid-area:stage;position:sticky;top:96px}
  .c2stage canvas{max-height:64vh}
  .c2tabs{grid-area:tabs;margin:0}
  #p_tpl,#p_txt,#p_look,#p_img,#p_free{grid-column:2}
  .c2acts{grid-column:2}
}
.c2hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
.c2tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px}
.c2tabs .chip{cursor:pointer}
.c2pane{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.tplgrid{grid-template-columns:repeat(5,1fr)}}
.tplbtn{background:none;border:2px solid transparent;border-radius:12px;padding:4px;cursor:pointer;font:inherit;color:var(--ink)}
.tplbtn.on{border-color:var(--acc)}
.tplbtn small{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.tplthumb{width:100%;height:auto;display:block;border-radius:8px;background:var(--bg2)}
.tplthumb.free{aspect-ratio:1;display:grid;place-items:center;border:1.5px dashed var(--line)}
.tplthumb.free svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.7}
.c2acts{margin-top:12px}
.lrow{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.on{background:var(--acc-soft);border-radius:10px;padding-inline:9px}
.lrow b{flex:1;font-size:13px;font-weight:600}
.lcard{margin-top:10px;padding:12px;border-radius:14px;background:var(--bg2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px}


.pdfnav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 16px 0;font-size:12.5px}
.pdfnav .chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.pdfnav .pgnow{font-weight:800;color:var(--acc);font-size:12.5px;min-width:112px;text-align:center;
  background:var(--acc-soft);border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:inherit}
.pdfnav input{width:120px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:12.5px}
.fspg{font-size:12px;color:var(--muted);font-weight:700}


/* ===== الجدار (أفقي وقابل للطيّ) ===== */
.wallbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 8px}
.wallbar .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.wallbar .wallnote{font-size:11.5px;color:var(--muted)}
.wall.shut .wallin{display:none}
.wallin{position:relative;padding:14px 0 6px}
.wallin .notes{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:14px;overflow-x:auto;
  padding:14px 16px 16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.wallin .notes::-webkit-scrollbar{height:0}
.wallin .note{flex:0 0 auto;width:auto;max-width:min(72vw,300px);scroll-snap-align:center;
  padding:13px 15px;border-radius:4px;line-height:1.9;color:#241f16;
  box-shadow:0 8px 20px -12px rgba(30,25,15,.55);white-space:pre-wrap;word-break:break-word;
  display:flex;flex-direction:column;justify-content:center;text-align:center}
.wallin .note.xs{min-width:96px;padding:16px 18px;font-weight:700}
.wallin .note.sm{min-width:130px}
.wallin .note.md{min-width:190px;text-align:start}
.wallin .note.lg{min-width:230px;text-align:start;line-height:1.95}
.wallin .note small{display:block;margin-top:8px;font-size:11px;opacity:.72}
.wallin .note .wt{display:block;white-space:pre-wrap;word-break:break-word}
/* صورة معلّقة بدبّوس بلا خلفية */
.wallin .wpic{flex:0 0 auto;margin:0;position:relative;scroll-snap-align:center;
  width:auto;max-width:min(62vw,240px)}
.wallin .wpic .wimg{display:block;width:100%;height:auto;max-height:210px;object-fit:contain;
  border-radius:3px;filter:drop-shadow(0 10px 16px rgba(25,20,10,.35))}
.wallin .wpic figcaption{margin-top:7px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}



.herobtns{position:relative;z-index:2;display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.hbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700}
.hbtn svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.8}
.hbtn b{background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:1px 8px;font-size:11.5px}


/* ===== جدول مدرسي ومنبّه ===== */
.ttwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tt{display:grid;grid-template-columns:58px repeat(7,minmax(92px,1fr));gap:3px;min-width:700px}
.ghead{background:var(--bg2);border-radius:9px;padding:6px 2px;text-align:center}
.ghead.today{background:var(--acc);color:#fff}
.ghead b{display:block;font-size:11.5px}.ghead small{font-size:10px;opacity:.75}
.gtime{font-size:10.5px;color:var(--muted);padding:6px 2px;text-align:center;align-self:start}
.gcell{background:var(--bg2);border-radius:9px;min-height:44px;padding:3px;display:flex;flex-direction:column;gap:3px}
.gcell.today{background:var(--acc-soft)}
.gtask{width:100%;text-align:right;border:0;border-radius:7px;padding:5px 6px;cursor:pointer;
  background:var(--card);border-inline-start:3px solid var(--line);font:inherit;color:var(--ink)}
.gtask.p1{border-inline-start-color:#c0392b}.gtask.p2{border-inline-start-color:var(--gold)}
.gtask.p3{border-inline-start-color:var(--acc)}
.gtask.done{opacity:.5;text-decoration:line-through}
.gtask b{display:block;font-size:11px;line-height:1.4}
.gtask small{font-size:9.5px;color:var(--muted)}
.glink{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.glink small{font-size:11.5px;color:var(--muted)}
.gtag{font-style:normal;font-size:10.5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:2px 8px;margin-inline-start:6px}
.alarm{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(12,18,16,.55);backdrop-filter:blur(4px);padding:20px}
.alarm.on{display:flex}
.abody{background:var(--card);border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.abody b{display:block;font-size:12.5px;color:var(--acc);font-weight:800}
.abody span{display:block;font-size:19px;font-weight:800;margin:6px 0 3px;line-height:1.6}
.abody small{display:block;font-size:12px;color:var(--muted)}
.arow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}


/* ===== فوائدي بالأقسام ===== */
.subhead{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 16px 6px;
  padding-inline-start:10px;border-inline-start:3px solid var(--acc)}
.nitem{margin:0 16px 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.nihead{width:100%;display:flex;align-items:center;gap:9px;padding:11px 13px;background:none;border:0;
  font:inherit;color:var(--ink);cursor:pointer;text-align:start}
.nihead .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--acc)}
.nihead .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.nihead b{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nihead .cnt{font-size:11px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:2px 9px;font-weight:800}
.nihead i{font-style:normal;color:var(--muted);font-size:13px}
.nitem .nibody{padding:0 11px 10px}
.nitem.shut .nibody{display:none}
.nitem .ncard{margin:0 0 7px}


/* ===== محرّر البطاقات الحرّ ===== */
.c2box{position:relative;display:inline-block;max-width:100%;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none}
.c2box canvas{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;touch-action:none}
.c2ov{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;outline:2px dashed var(--acc);outline-offset:3px;border-radius:4px;background:none}
.c2quick{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px;width:100%}
.c2quick .chip{flex:0 0 auto;white-space:nowrap;min-width:0;width:auto;height:auto;
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:12.5px;line-height:1.4;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.c2quick .chip svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.c2quick .chip.pri{background:var(--acc);color:#fff;border-color:transparent}
.lpop{position:fixed;inset-inline:0;bottom:0;z-index:150;transform:translateY(110%);
  transition:transform .28s cubic-bezier(.2,.9,.25,1);padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.lpop.on{transform:translateY(0)}
.lpin{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 14px 14px;
  padding:14px;box-shadow:0 -12px 34px -14px rgba(20,30,28,.5);max-height:52vh;overflow:auto}
.lptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.lptop b{font-size:13.5px}
.lpin textarea{width:100%;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.9;resize:vertical}
.lrowbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:9px 0}
.lrowbtns .sq{width:36px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:14px;cursor:pointer;display:grid;place-items:center}
.lrowbtns .sq.on{background:var(--acc);color:#fff;border-color:transparent}
.lrowbtns .sq.danger{color:#c0392b}
.lrowbtns input[type=color]{width:36px;height:34px;padding:0;border-radius:10px;border:1px solid var(--line);background:none}
@media(min-width:780px){
  .lpop{inset-inline:auto;inset-inline-start:16px;bottom:16px;width:380px;transform:translateY(0);opacity:0;pointer-events:none}
  .lpop.on{opacity:1;pointer-events:auto}
}


/* ===== لوحة التخصيص ===== */
.urow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:0}
.urow .ulbl{flex:1;font-size:13px;line-height:1.7}
.urow .uname{flex:1;padding:7px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);font:inherit;font-size:13px}
.usw{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;
  cursor:pointer;flex:none;transition:background .18s}
.usw::after{content:'';position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.usw.on{background:var(--acc)}
.usw.on::after{transform:translateX(-18px)}
html[dir=rtl] .usw.on::after{transform:translateX(18px)}
.lnk.danger{color:#c0392b}
body.notab main{padding-bottom:28px}


/* لا يكبر أي أيقونة داخل زر صغير */
.sechead svg,.chip svg,.lnk svg,.btn svg,.tile small svg{width:15px;height:15px;flex:none;
  stroke:currentColor;fill:none;stroke-width:1.8;vertical-align:-2px}
.chip{display:inline-flex;align-items:center;gap:6px}


/* ===== ورقة الطباعة ===== */
#printsheet{display:none}
.prpage{background:#fff;color:#1b1b1b;padding:26px 30px;font-family:'Cairo','Tajawal',sans-serif}
.prhead{text-align:center;margin-bottom:14px}
.prbrand{font-family:'Aref Ruqaa',serif;font-size:19pt;color:#7a5a1e;letter-spacing:.5px}
.prhead h1{font-size:22pt;margin:4px 0 2px;font-weight:800;color:#141414}
.prsub{font-size:10.5pt;color:#555}
.prrule{display:flex;align-items:center;gap:8px;margin:10px auto 0;max-width:420px}
.prrule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,#b99a4e,transparent)}
.prrule i{font-style:normal;color:#b99a4e;font-size:11pt}
.prtx p{font-family:'Amiri',serif;font-size:12.5pt;line-height:2;margin:0 0 8px;text-align:justify}
.prtx b{color:#7a5a1e;font-size:10.5pt;font-family:'Cairo',sans-serif}
.prpray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 16px}
.prpray div{border:1px solid #e0d8c4;border-radius:7px;padding:6px 2px;text-align:center;background:#faf7f0}
.prpray b{display:block;font-size:8.5pt;color:#7a5a1e;font-weight:700}
.prpray span{display:block;font-size:10pt;font-weight:800}
.prtab{width:100%;border-collapse:collapse;font-size:11pt}
.prtab th{font-size:9pt;color:#7a5a1e;text-align:right;padding:5px 8px;border-bottom:1.5px solid #b99a4e}
.prtab td{padding:9px 8px;border-bottom:1px dotted #cfc7b4;vertical-align:top}
.prtab td.c{width:26px}.prtab td.t{width:78px;font-weight:700;color:#444;white-space:nowrap}
.prtab td.m{width:74px;color:#666;font-size:9.5pt;white-space:nowrap}
.prtab td.d i{display:block;font-style:normal;font-size:9pt;color:#777;margin-top:2px}
.box{display:inline-block;width:13px;height:13px;border:1.4px solid #9a8a63;border-radius:3px;vertical-align:-2px}
.prcols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.prcols h3,.prnotes h3{font-size:10pt;color:#7a5a1e;margin:0 0 7px;font-weight:800}
.prli{font-size:10.5pt;padding:5px 0;border-bottom:1px dotted #d8d0bd}
.prli .box{margin-inline-end:7px}
.prlines{background:repeating-linear-gradient(transparent,transparent 25px,#ded6c3 25px,#ded6c3 26px);height:104px}
.prnotes{margin-top:16px}
.prfoot{margin-top:18px;text-align:center;font-size:8.5pt;color:#8c8470}
.prweek{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
.prweek th{border:1px solid #cfc7b4;background:#faf7f0;padding:6px 2px;font-size:9.5pt;color:#5a4a22}
.prweek th small{display:block;font-size:8pt;color:#8a7c56;font-weight:400}
.prweek td{border:1px solid #ded6c3;padding:6px 4px;height:46px;vertical-align:top}
.prweek td b{display:block;font-size:8pt;color:#6a6a6a;margin:3px 0 1px}
.prweek td em{font-style:normal;font-size:9pt;line-height:1.5;display:block}
@media print{
  @page{size:A4;margin:10mm}
  html.printing body>*{display:none!important}
  html.printing body{background:#fff!important}
  html.printing #printsheet{display:block!important}
  .prpage{padding:0}
  .prpage.wide{}
  a[href]:after{content:''!important}
}


/* ===== جدول اليوم في الصفحة الأولى ===== */
.htcard{margin:0 16px 16px;padding:13px 14px;border-radius:var(--radius);background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.httop{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.httop b{font-size:14px}.httop small{display:block;font-size:11px;color:var(--muted)}
.httop .htpray{margin-inline-start:auto;font-size:11.5px;background:var(--acc-soft);color:var(--acc);
  border-radius:999px;padding:4px 10px;font-weight:700}
.htrows{display:flex;flex-direction:column}
.htrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.htrow:first-child{border-top:0}
.htrow.now{background:var(--acc-soft);border-radius:10px;padding-inline:9px}
.htrow b{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrow span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.htrow .tick{width:19px;height:19px;flex:none;border-radius:6px;border:2px solid var(--line);background:transparent;cursor:pointer}
.htrow.done .tick{background:var(--acc);border-color:var(--acc)}
.htrow.done b{text-decoration:line-through;color:var(--muted)}


/* ===== منشورات القناة ===== */
.tgwall{display:grid;grid-template-columns:1fr;gap:12px;padding:0 16px 14px}
@media(min-width:760px){.tgwall{grid-template-columns:1fr 1fr}}
.tgcell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.tgcell iframe{width:100%;height:220px;border:0;display:block;background:var(--bg2)}
.tgcell.dim{opacity:.35}
.tgcell.dim iframe{height:0}
.tgcell.dim::after{content:'لا يوجد منشور بهذا الرقم';display:block;padding:12px;font-size:12px;color:var(--muted);text-align:center}
.tgcellacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 11px;border-top:1px solid var(--line)}


/* البطاقة كلها قابلة للضغط */
.tile,.ncard,.chcard,.goal,.htrow,.trow{cursor:pointer}
.tile:active,.ncard:active,.chcard:active{transform:scale(.995)}


/* ===== ورقة الاقتباس فوق البانر ===== */
.bnote{flex:0 0 auto;width:132px;max-width:42%;text-align:start;border:0;cursor:pointer;
  padding:10px 11px 12px;border-radius:2px;color:#241f16;font:inherit;line-height:1.7;
  box-shadow:0 8px 18px -10px rgba(8,26,20,.65);transform:rotate(-2deg);position:relative;z-index:3;
  margin-top:4px}
.bnote .wt{display:block;white-space:pre-wrap;word-break:break-word;max-height:112px;overflow:hidden}
.bnote .bimg{width:100%;border-radius:2px;display:block;margin-bottom:6px;max-height:70px;object-fit:cover}
.bnote::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:#c05d4a;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.bnote:active{transform:rotate(-2deg) scale(.98)}
/* صورة مجرّدة على البانر: بلا ورقة ولا دبّوس */
.bnote.bare{background:none!important;box-shadow:none;padding:0;transform:rotate(-1deg);border-radius:6px}
.bnote.bare::before{display:none}
.bnote.bare .bimg{max-height:96px;width:auto;max-width:100%;object-fit:contain;border-radius:5px;
  filter:drop-shadow(0 8px 14px rgba(8,26,20,.45))}
@media(min-width:820px){.bnote.bare .bimg{max-height:130px}}
.herotop h1{flex:1;min-width:140px}
@media(min-width:820px){.bnote{width:170px}.bnote .wt{max-height:140px}}

/* ===== الإنجازات والتأريخ ===== */
.achbox{margin:0 0 14px;padding:14px;border-radius:var(--radius);background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.achtop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.achnum b{display:block;font-size:14.5px;font-weight:800;line-height:1.5}
.achnum small{display:block;font-size:11.5px;color:var(--muted)}
.achtop .chip{margin-inline-start:auto}
.heat{display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;gap:3px;margin:12px 0 6px;direction:ltr}
.heat i{width:9px;height:9px;border-radius:2px;background:var(--bg2);display:block}
.heat i.h1{background:color-mix(in srgb,var(--acc) 28%,var(--bg2))}
.heat i.h2{background:color-mix(in srgb,var(--acc) 50%,var(--bg2))}
.heat i.h3{background:color-mix(in srgb,var(--acc) 72%,var(--bg2))}
.heat i.h4{background:var(--acc)}
.achwk{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.achwk i{font-style:normal;background:var(--bg2);border-radius:999px;padding:3px 10px;font-weight:700;color:var(--ink)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.abadge{display:inline-block;width:auto;height:auto;font-size:10.5px;font-weight:800;padding:4px 10px;
  border-radius:999px;background:var(--bg2);color:var(--muted);opacity:.5;border:1px solid var(--line);
  white-space:nowrap;line-height:1.7}
.abadge.on{opacity:1;background:var(--gold-soft);color:var(--gold);border-color:transparent}
.tile.sec2{flex-wrap:wrap}
.secbar{flex:1 0 100%;display:flex;align-items:center;gap:7px;margin-top:8px}
.secbar i{flex:1;height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;position:relative}
.secbar i::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;
  width:calc(var(--p)*1%);background:var(--acc);border-radius:99px}
.secbar small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tline{display:flex;flex-direction:column;gap:4px}
.tday{display:flex;align-items:center;gap:9px;margin:16px 0 6px}
.tday b{font-size:12.5px;font-weight:800;color:var(--acc)}
.tday span{flex:1;height:1px;background:var(--line)}
.tday small{font-size:11px;color:var(--muted)}
.tev{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:13px;
  background:var(--card);border:1px solid var(--line)}
.tev .tvi{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:var(--acc-soft);color:var(--acc)}
.tev .tvi svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.tev.k-done .tvi{background:var(--acc);color:#fff}
.tev.k-note .tvi,.tev.k-hl .tvi{background:var(--gold-soft);color:var(--gold)}
.tev .tvm{flex:1;min-width:0}
.tev .tvm b{display:block;font-size:13.5px;line-height:1.6;font-weight:700}
.tev .tvm small{display:block;font-size:11.5px;color:var(--muted);line-height:1.75;margin-top:1px}
.tev .tvk{flex:none;font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap}

/* ===== البحث الشامل ===== */
.srlist{display:flex;flex-direction:column;gap:7px}
.srow{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.skind{flex:none;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;
  background:var(--bg2);color:var(--muted);margin-top:2px;white-space:nowrap}
.k-note,.k-hl{background:var(--gold-soft);color:var(--gold)}
.k-quote,.k-boh{background:var(--acc-soft);color:var(--acc)}
.k-mark,.k-tx{background:#e8ecfb;color:#4257a8}
.smain{min-width:0;flex:1}
.smain b{display:block;font-size:13.5px;line-height:1.6}
.smain small{display:block;font-size:12px;color:var(--muted);line-height:1.8;margin-top:2px}

/* ===== بوح ===== */
.bohlist{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.bohcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);cursor:pointer}
.bohtop{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.bohtop b{font-size:14px}
.bohtop small{font-size:11px;color:var(--muted)}
.bmood{font-size:10.5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:2px 9px;font-weight:700}
.bohbody{font-family:var(--serif);font-size:16.5px;line-height:2;max-height:260px;overflow:hidden}

/* ===== الخرائط الذهنية ===== */
.mindbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:0 16px 10px}
.mindbar b{font-size:15px}
.mindbar .chip{cursor:pointer}
.mindbar .chip.danger{color:#c0392b}
.mindwrap{margin:0 16px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg2);overflow:auto;-webkit-overflow-scrolling:touch;max-height:68vh;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 8%,transparent) 1px,transparent 1px);
  background-size:18px 18px}
.mindcanvas{position:relative;min-width:100%}
.mindsvg{position:absolute;inset:0;pointer-events:none}
.mnode{position:absolute;width:150px;min-height:34px;border-radius:10px;background:var(--nc,#0d6e5f);
  color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:6px 9px;font-size:12.5px;font-weight:700;line-height:1.5;cursor:grab;
  box-shadow:0 6px 16px -8px rgba(10,20,15,.6);touch-action:none;user-select:none}
.mnode.root{font-size:14px;font-weight:800;min-height:40px}
.mnode:active{cursor:grabbing;filter:brightness(1.08)}
.mnode span{display:block;overflow:hidden;max-height:52px}
.mfold{position:absolute;inset-inline-start:-9px;top:50%;transform:translateY(-50%);
  min-width:20px;height:20px;padding:0 4px;border-radius:999px;border:1.5px solid var(--nc,#0d6e5f);
  background:var(--card);color:var(--nc,#0d6e5f);font:inherit;font-size:10.5px;font-weight:800;
  cursor:pointer;line-height:1;display:grid;place-items:center}
/* روابط المقرَّر */
.seclinks{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.slink{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:11.5px;font-weight:700;
  text-decoration:none;cursor:pointer;font-family:inherit}
.slink svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:1.8}
.slink.add{background:var(--acc-soft);color:var(--acc);border-color:transparent}

/* ===== العلامات الزمنية والتفريغ ===== */
.mkhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mkhead b{font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.bmbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--acc-soft);border:1px solid transparent;color:var(--acc);cursor:pointer}
.bmbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.bmbtn:active{transform:scale(.94)}
.pdfnav .bmbtn{width:34px;height:32px;border-radius:10px}
.acts .bmbtn{width:40px;height:38px;border-radius:13px}
#pBm svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
#pBm{color:var(--acc)}
.mkhead svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:1.8}
.mkempty{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.9}
.mklist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.mkrow{display:flex;gap:9px;align-items:flex-start;padding:9px 4px;border-top:1px solid var(--line)}
.mkrow:first-child{border-top:0}
.mktime{flex:none;background:var(--mc,#ffe27a);color:#20251f;border:0;border-radius:999px;
  padding:4px 11px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.mktime.sm{background:var(--acc-soft);color:var(--acc);padding:3px 9px;font-size:11px}
.mktext{flex:1;min-width:0;font-size:13.5px;line-height:1.9}
.mktext i{color:var(--muted);font-style:normal;font-size:12px}
.txlist{max-height:46vh;overflow:auto;margin-top:4px;display:flex;flex-direction:column;gap:1px}
.txseg{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-top:1px solid var(--line)}
.txseg:first-child{border-top:0}
.txseg .txt{flex:1;min-width:0;font-family:var(--serif);font-size:16px;line-height:1.95}
.txacts{display:flex;gap:2px;flex:none;opacity:.75}
.txbox .sbox input{padding-block:10px}
#txBar{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:4px 0 2px}
#txBar i{display:block;height:100%;background:var(--acc);transition:width .3s}
/* شريط التفريغ العائم — يبقى وأنت تتنقّل */
.txpill{position:fixed;z-index:75;inset-inline-end:12px;inset-block-end:calc(64px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:4px;max-width:min(86vw,340px);padding:7px 9px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 8px 26px -10px rgba(20,30,28,.45);overflow:hidden}
.txpill>i{position:absolute;inset-block-end:0;inset-inline-start:0;height:3px;background:var(--acc);transition:width .4s}
.txpill .txp{display:flex;align-items:center;gap:8px;min-width:0;flex:1;background:none;border:0;
  color:inherit;font:inherit;cursor:pointer;text-align:start;padding:0}
.txpill .txp svg{width:17px;height:17px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.8}
.txpill b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.txpill small{display:block;font-size:10.5px;color:var(--muted)}
.txpill .txx{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg2);border:0;
  color:var(--muted);font-size:11px;cursor:pointer;line-height:1}
@media(min-width:900px){.txpill{inset-block-end:24px}}

/* شريط صغير تحت الأخضر: الآن · أهدافي · أولوياتي · مهامي */
.qbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px;margin:-6px 0 14px}
.qb{display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  text-decoration:none;font-size:11.5px;font-weight:700;line-height:1.9;white-space:nowrap}
.qb small{font-size:10.5px;font-weight:600;opacity:.75}
.qb small::before{content:'· '}
.qb.now{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,var(--line));background:var(--acc-soft)}
.qb:active{opacity:.7}
.wsheet{display:flex;flex-wrap:wrap;gap:12px;max-height:56vh;overflow:auto;padding:6px 2px}
.wsheet .note{flex:0 0 auto;max-width:100%;cursor:pointer}
.wsheet .wpic{flex:0 0 auto;max-width:200px}
/* ===== المثبّتات ===== */
.pinrow{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scroll-snap-type:x proximity}
.pinrow::-webkit-scrollbar{height:0}
.pinchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;
  color:var(--ink);font-size:12.5px;font-weight:700;max-width:190px}
.pinchip svg{width:15px;height:15px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.7}
.pinchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== أحداث اليوم والأهداف في الصفحة الأولى ===== */
.htev{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.evchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--bg2)}
.evchip i{width:7px;height:7px;border-radius:50%;flex:none}
.grow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.grow:first-child{border-top:0}
.grow b{flex:0 0 auto;font-size:13px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .bar{flex:1;margin:0}
.grow small{font-size:11px;color:var(--muted)}
.evrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.evrow:first-of-type{border-top:0}
.evdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.evrow b{display:block;font-size:13.5px}
.evrow small{display:block;font-size:11.5px;color:var(--muted)}
.cell .evdots{display:flex;gap:2px;justify-content:center;margin-top:2px}
.cell .evdots i{width:5px;height:5px;border-radius:50%}
.cell.hasev{outline:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
/* ===== قائمة المقرّرات في الفوائد ===== */
.nlist{display:flex;flex-direction:column;margin:0 16px 10px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);overflow:hidden}
.nrow{display:flex;align-items:center;gap:10px;padding:12px 13px;border-top:1px solid var(--line);
  text-decoration:none;color:var(--ink)}
.nrow:first-child{border-top:0}
.nrow .ic{width:22px;height:22px;display:grid;place-items:center;color:var(--acc);flex:none}
.nrow .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.nrow b{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .cnt{font-size:11px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:2px 9px;font-weight:800}


/* ===== شريط التنسيق ===== */
.rtools{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 8px;padding:7px;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.rtools button{min-width:32px;height:30px;padding:0 7px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;line-height:1}
.rtools button:active{background:var(--acc);color:#fff}
.rtools input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.rich{min-height:90px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);line-height:2;font-size:14px;outline:none}
.rich.tall{min-height:130px}
.rich:empty:before{content:attr(data-ph);color:var(--muted)}
.rich h2{font-size:17px;margin:10px 0 6px;font-weight:800}
.rich ul,.rich ol{margin:6px 0;padding-inline-start:22px}
.rich:focus{border-color:var(--acc)}
.article.rich{min-height:200px;border-radius:0;border-inline:0}
.fsz{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ================================================================
   نسخة الاستضافة — تحسينات الهاتف والحاسوب والمظهر
   ================================================================ */
*{-webkit-tap-highlight-color:transparent}
a,button,.chip,.seg,.tile,.row,.tabbar a{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:80px}
body{line-height:1.7;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100dvh}
:root{--bg:#f6f4ee;--bg2:#eeeae1;--line:#e2ddd1;--muted:#67706c;
  --shadow:0 1px 2px rgba(24,38,34,.04),0 10px 26px -14px rgba(24,38,34,.16)}
::selection{background:color-mix(in srgb,var(--acc) 22%,transparent)}
@media(hover:hover){ *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 35%,transparent) transparent} }
b,strong{font-weight:700}
h1,h2,h3{letter-spacing:0}

/* ---------- الرأس ---------- */
.hwrap{padding:9px 14px;gap:8px}
.logo{border-radius:12px;font-size:17px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--acc) 70%,transparent)}
.brand b{font-size:15.5px}
.iconbtn{border-radius:12px;transition:transform .12s,border-color .15s,color .15s,background .15s}
.iconbtn:active{transform:scale(.92)}

/* ---------- البانر ---------- */
.hero{border-radius:26px;padding:24px 22px 22px;
  background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 94%,#000),color-mix(in srgb,var(--acc) 62%,#000) 70%,color-mix(in srgb,var(--acc) 45%,#000))}
.hero::after{opacity:.12}
.hero h1{text-shadow:0 2px 12px rgba(0,0,0,.18)}

<script>
/* ================= storage ================= */
const S = {
  get(k,d){ try{ const v=localStorage.getItem('ws_'+k); return v==null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem('ws_'+k, JSON.stringify(v)); }catch(e){ toast('مساحة التخزين ممتلئة'); } }
};
let site   = S.get('site', {name:'مساحتي', tag:'مكتبتي الشخصية', about:'', acc:'#0d6e5f', greet:''});
let tree   = S.get('tree', []);
let quotes = S.get('quotes', []);
let notes  = S.get('notes', {});
let hls    = S.get('hl', {});
let fav    = S.get('fav', {});
let pos    = S.get('pos', {});
let ppos   = S.get('ppos', {});
let cards  = S.get('cards', []);
let card   = S.get('card', {label:'فائدة', brand:'', sub:'', page:'', text:'', pal:0, bg:'', layout:'auto'});
if(!card.layout) card.layout='auto';
const saveSite=()=>S.set('site',site), saveTree=()=>S.set('tree',tree), saveQuotes=()=>S.set('quotes',quotes);
const saveNotes=()=>S.set('notes',notes), saveHls=()=>S.set('hl',hls), saveFav=()=>S.set('fav',fav);
const saveCards=()=>S.set('cards',cards), saveCard=()=>S.set('card',card);

/* ---- files in IndexedDB ---- */
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise(res=>{
    try{
      const r = indexedDB.open('ws-files',1);
      r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains('f')) r.result.createObjectStore('f'); };
      r.onsuccess = ()=>{ _db=r.result; res(_db); };
      r.onerror = ()=>res(null);
    }catch(e){ res(null); }

async function putFile(key, blob){
  const d = await db(); if(!d) throw new Error('no-idb');
  return new Promise((res,rej)=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').put(blob,key);
    t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); });
}
async function getFile(key){
  const d = await db(); if(!d) return null;
  return new Promise(res=>{ const t=d.transaction('f','readonly'); const q=t.objectStore('f').get(key);
    q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); });
}
async function dropFile(key){
  const d = await db(); if(!d) return;
  return new Promise(res=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').delete(key);
    t.oncomplete=()=>res(); t.onerror=()=>res(); });
}
const urlCache = {};
async function fileURL(key){
  if(urlCache[key]) return urlCache[key];
  const b = await getFile(key); if(!b) return null;
  const u = URL.createObjectURL(b); urlCache[key]=u; return u;
}

const ALLOWED={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,MARK:1,BR:1,DIV:1,P:1,SPAN:1,
  H2:1,H3:1,UL:1,OL:1,LI:1,FONT:1,A:1};
/* نُبقي ما يلوّن ويكبّر ويحاذي — ونحذف ما سواه */
const STYLE_OK=['color','background-color','font-weight','font-style','text-decoration',
  'font-size','text-align','background'];
function cleanStyle(el){
  const st=el.getAttribute('style')||'';
  if(!st) return '';
  const out=[];
  st.split(';').forEach(part=>{
    const i=part.indexOf(':'); if(i<0) return;
    const k=part.slice(0,i).trim().toLowerCase(), v=part.slice(i+1).trim();
    if(!STYLE_OK.includes(k)) return;
    if(/url\s*\(|expression|javascript:/i.test(v)) return;
    out.push(k+':'+v);
  });
  return out.join(';');
}
function clean(html){
  const d=document.createElement('div'); d.innerHTML=html||'';
  (function w(n){ [...n.childNodes].forEach(c=>{
    if(c.nodeType===1){
      if(!ALLOWED[c.tagName]){ c.replaceWith(...c.childNodes); return; }
      const st=cleanStyle(c);
      const col=c.tagName==='FONT'? c.getAttribute('color') : '';
      const sz =c.tagName==='FONT'? c.getAttribute('size')  : '';
      const href=c.tagName==='A'? (c.getAttribute('href')||'') : '';
      [...c.attributes].forEach(a=>c.removeAttribute(a.name));
      if(st) c.setAttribute('style',st);
      if(col) c.setAttribute('color',col);
      if(sz) c.setAttribute('size',sz);
      if(href&&/^(https?:|#|mailto:)/i.test(href)){ c.setAttribute('href',href); c.setAttribute('target','_blank'); }
      w(c);
    }
    else if(c.nodeType!==3) c.remove(); }); })(d);
  return d.innerHTML.trim();
}

function notesTree(){
  /* قسم ← قسم فرعي ← عنصر ← {فوائد، تظليلات} */
  const T=[];
  tree.forEach(sec=>{
    const node={sec, items:[], subs:[]};
    const collect=(list,into)=>{
      (list||[]).forEach(it=>{
        const n=noteText(notes[it.id]||'')? notes[it.id] : null;
        const hl=[];
        for(const key in hls){ if(key.split(':')[0]!==it.id) continue;
          (hls[key]||[]).forEach(h=>hl.push({h,key})); }
        if(n||hl.length) into.push({it,note:n,hl});
      });
    };
    collect(sec.items,node.items);
    (sec.subs||[]).forEach(sub=>{ const si=[]; collect(sub.items,si);
      if(si.length) node.subs.push({sub,items:si}); });
    if(node.items.length||node.subs.length) T.push(node);
  });
  return T;
}

let sq='', sk='all';
function vSearch(){
  return `${head('بحث', helpBtn('search'))}<div class="sbox">${ICON.search}<input id="q" placeholder="ابحث في كل شيء — الملفات والفوائد والتظليلات والاقتباسات والمهام والتفريغ والبوح…" value="${esc(sq)}"></div>

  <div id="sres"></div>`;
