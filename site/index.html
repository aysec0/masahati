const SKINDS=[['all','الكل'],['lib','المكتبة'],['note','فوائد'],['hl','تظليلات'],['quote','اقتباسات'],
  ['mark','علامات'],['tx','تفريغ'],['plan','مهام وأهداف'],['card','بطاقات'],['boh','بوح'],['mind','خرائط'],['chan','قنوات']];
function hit(t,q){ return norm(t||'').includes(q); }
function sniff(t,q,n){
  t=(t||'').replace(/\s+/g,' ').trim();
  const i=norm(t).indexOf(q);
  if(i<0) return esc(t.slice(0,n||110));
  const a=Math.max(0,i-35);
  return (a?'…':'')+esc(t.slice(a,a+(n||110)))+(t.length>a+(n||110)?'…':'');
}
/* يجمع كل ما في الموقع في صفّ واحد قابل للبحث */
function searchAll(q){
  const out=[];
  const add=(kind,label,title,text,hash)=>out.push({kind,label,title,text,hash});
  if(sk==='all'||sk==='lib') allItems().forEach(r=>{
    const t=r.it.name+' '+(r.it.note||'')+' '+(r.it.text||'');
    if(hit(t,q)) add('lib',(TYPES[r.it.type]||TYPES.text).t,r.it.name,
      sniff(r.it.text||r.it.note||'',q)+' · '+esc(r.sec.name+(r.sub?' · '+r.sub.name:'')),'#/i/'+r.it.id);
  });
  if(sk==='all'||sk==='note') Object.keys(notes).forEach(id=>{
    const tx=noteText(notes[id]); if(!hit(tx,q)) return;
    const r=findItem(id);
    add('note','فائدة', r? r.it.name : 'فائدة', sniff(tx,q), r? '#/i/'+id : '#/notes');
  });
  if(sk==='all'||sk==='hl'){ const H=S.get('hl',{});
    Object.keys(H).forEach(key=>{ (H[key]||[]).forEach(h=>{
      const tx=(h.txt||'')+' '+noteText(h.n||'');
      if(!hit(tx,q)) return;
      const r=findItem(String(key).split(':')[0]);
      add('hl','تظليل', r? r.it.name : 'تظليل', sniff(h.txt||noteText(h.n||''),q),
        r? '#/i/'+String(key).split(':')[0] : '#/notes');
    }); }); }
  if(sk==='all'||sk==='quote') quotes.forEach(x=>{
    const tx=noteText(x.t)+' '+(x.src||''); if(!hit(tx,q)) return;
    add('quote','اقتباس', x.src||'اقتباس', sniff(noteText(x.t),q), '#/quotes');
  });
  if(sk==='all'||sk==='mark') Object.keys(marks||{}).forEach(id=>{
    (marks[id]||[]).forEach(m=>{
      const tx=noteText(m.n||''); if(!hit(tx,q)) return;
      const r=findItem(id);
      add('mark', m.p? ('صفحة '+AR(m.p)) : arTime(m.t||0), r? r.it.name : 'علامة', sniff(tx,q), '#/i/'+id);
    });
  });
  if(sk==='all'||sk==='tx'){ const T=S.get('tx',{});
    Object.keys(T).forEach(id=>{ const d=T[id]||{};
      (d.segs||[]).forEach(g=>{ if(!hit(g.t,q)) return;
        const r=findItem(id);
        add('tx', g.s!=null? arTime(g.s):'تفريغ', r? r.it.name:'تفريغ', sniff(g.t,q), '#/i/'+id); });
    }); }
  if(sk==='all'||sk==='plan'){
    (plan.tasks||[]).forEach(t=>{ if(hit(t.title+' '+(t.note||''),q))
      add('plan','مهمة',t.title,sniff(t.note||'',q),'#/plan/tasks'); });
    (plan.goals||[]).forEach(g=>{ if(hit(g.title+' '+(g.note||''),q))
      add('plan','هدف',g.title,sniff(g.note||'',q),'#/plan/goals'); });
    (plan.prios||[]).forEach(p=>{ if(hit(p.t,q)) add('plan','أولوية',p.t,'','#/plan/prio'); });
    ((plan.events)||[]).forEach(e=>{ if(hit(e.title+' '+(e.note||''),q))
      add('plan','موعد',e.title,esc(e.date||''),'#/plan/month'); });
  }
  if(sk==='all'||sk==='card') (cards||[]).forEach(c=>{
    const tx=(c.t||'')+' '+(c.src||''); if(!hit(tx,q)) return;
    add('card','بطاقة', c.src||'بطاقة', sniff(c.t||'',q), '#/cards');
  });
  if(sk==='all'||sk==='boh') (typeof boh!=='undefined'?boh:[]).forEach(e=>{
    const tx=noteText(e.h||'')+' '+(e.ttl||''); if(!hit(tx,q)) return;
    add('boh','بوح', e.ttl||bohDate(e.d), sniff(noteText(e.h||''),q), '#/boh');
  });
  if(sk==='all'||sk==='mind') (typeof minds!=='undefined'?minds:[]).forEach(m=>{
    const ns=(m.nodes||[]).filter(n=>hit(n.t,q));
    if(!ns.length && !hit(m.name,q)) return;
    add('mind','خريطة', m.name, esc(ns.slice(0,4).map(n=>n.t).join(' · ')), '#/mind/'+m.id);
  });
  if(sk==='all'||sk==='chan') (typeof chans!=='undefined'?chans:[]).forEach(c=>{
    if(!hit((c.name||'')+' '+c.u,q)) return;
    add('chan','قناة', c.name||c.u, '@'+esc(c.u), '#/tg/'+c.u);
  });
  return out;
}
function runSearch(){
  const el=document.getElementById('sres'); if(!el) return;
  const q=norm(sq.trim());
  if(!q){
    el.innerHTML=`<div class="empty">اكتب كلمة واحدة يظهر لك كل ما يخصّها في مساحتك —
      في ملفاتك وفوائدك وتظليلاتك واقتباساتك وعلاماتك وتفريغك ومهامك وبوحك وخرائطك.</div>`;
    return;
  }
  let res=[];
  try{ res=searchAll(q); }catch(e){ res=[]; }
  if(!res.length){ el.innerHTML=`<div class="empty">لا نتائج لـ «${esc(sq)}».</div>`; return; }
  const cap=300, shown=res.slice(0,cap);
  el.innerHTML=`<p class="mkempty" style="padding:0 2px 8px">${AR(res.length)} نتيجة${res.length>cap?' — تُعرض أوّل '+AR(cap):''}</p>
    <div class="srlist">${shown.map(r=>`
      <a class="srow" href="${r.hash}">
        <span class="skind k-${r.kind}">${esc(r.label)}</span>

/* اختيار الصورة الشخصية */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-av]'); if(!b) return;
  if(b.dataset.av==='del'){
    if(site.avatar) dropFile(site.avatar);

  }
  const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange=async()=>{
    const f=i.files&&i.files[0]; if(!f) return;
    try{
      const small=await shrinkImg(f,256);
      const key='av'+Date.now().toString(36);
      await putFile(key,small);
      if(site.avatar) dropFile(site.avatar);
      site.avatar=key; S.set('site',site); applyTheme(); render(); toast('حُفظت صورتك');
    }catch(err){ toast('تعذّر حفظ الصورة'); }
  };
  i.click();
});
/* تصغير الصورة قبل حفظها — لئلا تثقل مساحتك */
function shrinkImg(file,max){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,max/Math.max(im.width,im.height));
      const w=Math.max(1,Math.round(im.width*sc)), h=Math.max(1,Math.round(im.height*sc));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(u);
      c.toBlob(bl=>bl?res(bl):rej(new Error('no blob')),'image/jpeg',0.86);
    };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('bad image')); };
    im.src=u;
  });
}
function done(){ return S.get('done',{}); }
function setDone(id,v){ const d=done(); if(v) d[id]=Date.now(); else delete d[id]; S.set('done',d); }
function tgRef(u){ const m=/t\.me\/(?:s\/)?([A-Za-z0-9_]{3,})\/(\d+)/.exec(u||''); return m?{ch:m[1],id:m[2]}:null; }
function ytId(u){ const m=/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/.exec(u||''); return m?m[1]:''; }
/* هل الصفحة مفتوحة كملف من الجهاز؟ عندها يرفض يوتيوب التضمين (الخطأ 153) */
function isLocal(){ try{ return location.protocol==='file:' || location.origin==='null' || !location.origin; }catch(e){ return false; } }
function ytMode(){ return S.get('ytmode', isLocal()?'alt':'nocookie'); }
function altHost(){ return (S.get('ytalt','https://yewtu.be')||'https://yewtu.be').replace(/\/+$/,''); }
function ytSrc(yid,mode){
  if(mode==='alt') return altHost()+'/embed/'+yid+'?local=true';
  const host = mode==='yt' ? 'https://www.youtube.com' : 'https://www.youtube-nocookie.com';
  let u = host+'/embed/'+yid+'?rel=0&enablejsapi=1';
  try{ if(/^https?:$/.test(location.protocol)) u+='&origin='+encodeURIComponent(location.origin); }catch(e){}
  return u;
}

const HCOL={y:'#ffe9a3',g:'#bfe7c8',b:'#c3dcf5'};   /* ثلاثة خفيفة واضحة */
let curColor = S.get('hcolor','y');
let drawOn=false, sheetEl=null;
const hlOf = k => hls[k]||[];
function addHl(key,obj){ const h=Object.assign({id:uid('h'),c:curColor,n:''},obj); (hls[key]=hls[key]||[]).push(h); saveHls(); return h; }
function findHl(key,hid){ return hlOf(key).find(h=>h.id===hid); }
function delHl(key,hid){ hls[key]=hlOf(key).filter(h=>h.id!==hid); if(!hls[key].length) delete hls[key]; saveHls(); }
function paintText(rootEl){
  const key=rootEl.dataset.hlroot;
  hlOf(key).filter(h=>h.t==='text').slice().sort((a,b)=>a.s-b.s).forEach(h=>{
    const nodes=[]; const w=document.createTreeWalker(rootEl,NodeFilter.SHOW_TEXT); let n;
    while(n=w.nextNode()){ if(!n.parentElement.closest('mark.hl')) nodes.push(n); }
    let acc=0;
    for(const node of nodes){
      const len=node.nodeValue.length, st=acc, en=acc+len; acc=en;
      if(en<=h.s||st>=h.e) continue;
      const from=Math.max(0,h.s-st), to=Math.min(len,h.e-st); if(to<=from) continue;
      try{ const rg=document.createRange(); rg.setStart(node,from); rg.setEnd(node,to);
        const m=document.createElement('mark'); m.className='hl'+(h.n?' has':'');
        m.dataset.hid=h.id; m.dataset.hkey=key; m.dataset.lp='hl';
        if(noteText(h.n||'')) m.dataset.hasnote='1';
        m.style.setProperty('--hc',HCOL[h.c]||HCOL.y);
        rg.surroundContents(m); }catch(e){}
    }
  });
}
function repaintText(key){ const r=document.querySelector(`[data-hlroot="${key}"]`); if(!r) return;
  r.innerHTML = r.dataset.raw!=null? r.dataset.raw : r.innerHTML; paintText(r); }
function offsetsOf(rootEl,range){ const pre=document.createRange(); pre.selectNodeContents(rootEl);
  pre.setEnd(range.startContainer,range.startOffset); const s=pre.toString().length;
  return {s, e:s+range.toString().length}; }
let selTool=null;
const hideSel=()=>{ if(selTool){selTool.remove(); selTool=null;} };
function onSelect(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount){ hideSel(); return; }
  const rg=sel.getRangeAt(0);
  const host=(rg.commonAncestorContainer.nodeType===1?rg.commonAncestorContainer:rg.commonAncestorContainer.parentElement).closest('[data-hlroot]');
  if(!host||!rg.toString().trim()){ hideSel(); return; }
  const rect=rg.getBoundingClientRect(); hideSel();
  selTool=document.createElement('div'); selTool.className='seltool';
  selTool.innerHTML = Object.keys(HCOL).map(k=>`<button class="swatch" data-sel="${k}" style="background:${HCOL[k]}"></button>`).join('')
    + `<button class="mini" data-sel="note">+ فائدة</button>`;

function bindLayer(layer,key,page){
  let st=null,box=null,cur=null;

    return {x:Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)), y:Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))}; };

    st.live=true; cur={x:p0.x,y:p0.y,w:0,h:0};
    try{layer.setPointerCapture(st.id);}catch(_){}
    box=document.createElement('div'); box.className='hrect';
    box.style.cssText=`left:${p0.x*100}%;top:${p0.y*100}%;width:0;height:0;background:${HCOL[curColor]}`;
    layer.appendChild(box);
  };
  const commit=(a,b2)=>{
    const r={x:Math.min(a.x,b2.x),y:Math.min(a.y,b2.y),w:Math.abs(b2.x-a.x),h:Math.abs(b2.y-a.y)};
    if(r.w<0.02||r.h<0.008) return false;
    const h=addHl(key,{t:'pdf',p:page,x:r.x,y:r.y,w:r.w,h:r.h});
    paintRects(layer,key,page);
    toast('ظُلِّل — اضغط عليه مطوّلًا لتكتب فائدة');
    return true;
  };
  layer.addEventListener('pointerdown',e=>{
    if(!layer.classList.contains('draw')) return;

    st={id:e.pointerId,x0:e.clientX,y0:e.clientY,p:rel(e),mouse:e.pointerType!=='touch',live:false,moved:false};
    if(st.mouse){ start(st.p); e.preventDefault(); }

      if(Math.abs(dy)>Math.abs(dx)){ st=null; return; }

    const q=rel(e);

    const p1=rel(e||{clientX:s.x0,clientY:s.y0});

    }else{
      clearCorner();

      m.style.cssText=`left:${p1.x*100}%;top:${p1.y*100}%`;
      layer.appendChild(m); layer.classList.add('waiting');
      tapCorner={layer,page,p:p1,el:m};

function seekTo(t){
  if(!au.duration||!isFinite(au.duration)){ wanted=t;
    au.addEventListener('loadedmetadata',()=>{ if(wanted){const v=wanted; wanted=0; seekTo(v);} },{once:true}); return; }
  const v=Math.max(0,Math.min(t,au.duration-0.3));
  try{ if(au.fastSeek) au.fastSeek(v); else au.currentTime=v; }catch(e){ try{au.currentTime=v;}catch(_){} }
  if(Math.abs(au.currentTime-v)>2) au.addEventListener('canplay',()=>{try{au.currentTime=v;}catch(e){}},{once:true});
}
async function play(id, startAt){
  const r=findItem(id); if(!r||(r.it.type!=='audio'&&r.it.type!=='video')) return;
  if(!r.it.file && !r.it.url){ toast('لا يوجد ملف صوتي لهذا العنصر'); return; }
  const it=r.it;
  if(current&&current.id===id&&startAt==null){ P.el.classList.add('up'); toggle(); return; }
  current=it; P.el.classList.add('up');
  P.title.innerHTML=`<b>${esc(it.name)}</b><small>${urlCache[it.file]?esc(r.sec.name):'جارٍ التحميل…'}</small>`;
  P.title.href='#/i/'+it.id;
  const tok=++loadTok;
  const url = it.file ? await fileURL(it.file) : it.url;
  if(tok!==loadTok) return;
  if(!url){
    toast('لم أجد الملف في هذا المتصفح');
    const info=document.getElementById('auInfo');
    if(info) info.outerHTML=fileProblem(it,'لم أجد الملف الصوتي في تخزين هذا المتصفح — أعد رفعه ليعمل.');
    P.el.classList.remove('up'); return; }
  au.src=url;
  P.title.innerHTML=`<b>${esc(it.name)}</b><small>${esc(r.sec.name)}</small>`;
  au.playbackRate=S.get('rate',1);
  P.rate.textContent=String(au.playbackRate).replace('.','٫')+'×';
  const t=(startAt!=null)?startAt:(pos[id]||0); wanted=(t>3)?t:0; if(wanted) seekTo(wanted);
  au.play().catch(()=>{});
  S.set('last',id);
  if('mediaSession' in navigator){ try{
    navigator.mediaSession.metadata=new MediaMetadata({title:it.name, artist:site.name||'مساحتي',
      album:r.sec.name+(r.sub?' · '+r.sub.name:''), artwork:artwork(it.name)});
  }catch(e){} mediaInit(); mediaPos(); }
}
/* غلاف مرسوم للإشعار وشاشة القفل */
let artCache={};
function artwork(name){
  const key=(site.acc||'')+'|'+(site.name||'');
  if(!artCache[key]){
    try{
      const c=document.createElement('canvas'); c.width=c.height=384; const x=c.getContext('2d');
      const g=x.createLinearGradient(0,0,384,384); g.addColorStop(0,site.acc||'#0d6e5f'); g.addColorStop(1,'#12201d');
      x.fillStyle=g; x.fillRect(0,0,384,384);
      x.fillStyle='rgba(255,255,255,.93)'; x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl';
      x.font='700 62px Aref Ruqaa, Amiri, serif';
      x.fillText((site.name||'مساحتي').slice(0,14),192,196);
      artCache[key]=[{src:c.toDataURL('image/png'),sizes:'384x384',type:'image/png'}];
    }catch(e){ artCache[key]=[]; }
  }
  return artCache[key];
}
function mediaPos(){
  if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState) return;
  try{ if(isFinite(au.duration)&&au.duration>0)
    navigator.mediaSession.setPositionState({duration:au.duration,
      playbackRate:au.playbackRate||1, position:Math.max(0,Math.min(au.currentTime,au.duration))}); }catch(e){}
}
/* العنصر التالي/السابق في القسم نفسه */
function sibling(dir){
  if(!current) return; const r=findItem(current.id); if(!r) return;
  const list=(r.sub?r.sub.items:r.sec.items)||[];
  const pl=list.filter(x=>(x.type==='audio'||x.type==='video')&&(x.file||x.url));
  const i=pl.findIndex(x=>x.id===current.id); if(i<0) return;
  const n=pl[i+dir]; if(n) play(n.id); else toast(dir>0?'هذا آخر عنصر في القسم':'هذا أول عنصر في القسم');
}
let msDone=false;
function mediaInit(){
  if(msDone||!('mediaSession' in navigator)) return; msDone=true;
  const ms=navigator.mediaSession;
  const H={ play:()=>au.play().catch(()=>{}), pause:()=>au.pause(),
    seekbackward:d=>seekTo(au.currentTime-((d&&d.seekOffset)||15)),
    seekforward:d=>seekTo(au.currentTime+((d&&d.seekOffset)||15)),
    seekto:d=>{ if(d&&d.seekTime!=null) seekTo(d.seekTime); },
    previoustrack:()=>sibling(-1), nexttrack:()=>sibling(1),
    stop:()=>{ au.pause(); stash(); P.el.classList.remove('up'); } };
  for(const k in H){ try{ ms.setActionHandler(k,H[k]); }catch(e){} }
}
function toggle(){ au.paused? au.play().catch(()=>{}) : au.pause(); }

let handoff=null;
function toAudio(vp,auto){
  const id=vp.dataset.vid; if(!id) return;
  const t=vp.currentTime||0;
  if(!vp.paused) vp.pause();
  handoff={id,auto:!!auto,t};
  play(id,t);
  if(!auto) toast('انتقل الصوت إلى المشغّل السفلي — يكمل معك في الخلفية');
}
function toVideo(vp){
  const id=vp.dataset.vid;
  if(!current||current.id!==id) return;
  const t=au.currentTime||0, playing=!au.paused;
  au.pause(); handoff=null;
  try{ vp.currentTime=t; }catch(e){}
  if(playing) vp.play().catch(()=>{});
  P.el.classList.remove('up');
}

let DL=null, DLready=false;

function canShareFile(blob,name){
  try{ if(!navigator.share||!navigator.canShare) return false;
    return navigator.canShare({files:[new File([blob],name,{type:blob.type||'application/octet-stream'})]}); }catch(e){ return false; }
}
async function shareBlob(blob,name,title){
  try{ const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
    await navigator.share({files:[f],title:title||name}); return true; }
  catch(e){ return e&&e.name==='AbortError'; }
}
function showImg(url,name,blob){
  const sh = blob && canShareFile(blob,name);
  sheet(`<h3>الصورة جاهزة</h3>
    <img src="${url}" alt="" style="width:100%;border-radius:14px;max-height:52vh;object-fit:contain;background:var(--bg2)">
    <p class="hintp" style="margin:10px 0 0">${sh?'شاركها إلى أي تطبيق، أو نزّلها، أو اضغطها مطوّلًا لحفظها في الصور.':'نزّلها، أو اضغطها مطوّلًا ثم «حفظ الصورة» (بالزر الأيمن على الحاسوب).'}</p>
    <div class="sheetrow">
      ${sh?`<button class="btn pri" id="shareImg">${ICON.ext} مشاركة</button>`:''}
      <a class="btn ${sh?'':'pri'}" href="${url}" download="${esc(name)}">${ICON.dl} تنزيل</a>
      <button class="btn" onclick="closeSheet()">إغلاق</button></div>`, el=>{
    const b=el.querySelector('#shareImg'); if(b) b.onclick=async()=>{ if(await shareBlob(blob,name)) closeSheet(); else toast('تعذّرت المشاركة — نزّلها بدلًا من ذلك'); };
  });
}
async function saveBlob(blob,name,isImg){
  if(DL){ try{ await DL.save({filename:name,data:blob}); toast('تم الحفظ'); return; }
    catch(e){ if(e&&e.code==='declined') return; } }
  const url=URL.createObjectURL(blob);
  if(isImg){ showImg(url,name,blob); return; }
  /* رابط تنزيل باسمه الصحيح — فلا يُحفظ الملف باسمٍ مبهم */
  try{
    const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener';
    a.style.display='none'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 60000);
    return;
  }catch(e){}
  const w=window.open(url,'_blank','noopener');
  if(!w) sheet(`<h3>${esc(name)}</h3><a class="btn pri" href="${url}" target="_blank" download="${esc(name)}">${ICON.dl} فتح الملف</a>
    <div class="sheetrow"><button class="btn" onclick="closeSheet()">إغلاق</button></div>`);
}

async function ingest(files, target){
  const list=bucket(target); if(!list){ toast('اختر قسمًا أولًا'); return; }
  try{ if(navigator.storage&&navigator.storage.persist&&!S.get('persistAsked',false)){ S.set('persistAsked',true); navigator.storage.persist().catch(()=>{}); } }catch(e){}
  toast('جارٍ الحفظ…');
  for(const f of files){
    const key=uid('f');
    try{ await putFile(key,f); }catch(err){ toast('تعذّر حفظ الملف'); continue; }
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const t = (f.type.startsWith('audio')||/^(mp3|m4a|wav|ogg|oga|opus|aac|flac|m4b)$/.test(ext))?'audio'
            : (f.type.startsWith('video')||/^(mp4|mov|mkv|webm|avi|m4v)$/.test(ext))?'video'
            : (f.type.startsWith('image')||/^(png|jpe?g|gif|webp|svg|heic)$/.test(ext))?'img'
            : (f.type==='application/pdf'||ext==='pdf')?'pdf':'link';
    const it={id:uid('i'),type:t,name:f.name.replace(/\.[^.]+$/,''),file:key,size:f.size,mime:f.type,ts:Date.now()};
    if(t==='audio'||t==='video'){
      try{ it.dur = await mediaDur(f, t); }catch(err){}
    }
    list.push(it);
  }
  saveTree(); render(); toast('تمت الإضافة — اضغط ⋯ لتسميته كما تحب');
}

function pickTarget(files){
  if(!tree.length){ toast('أنشئ قسمًا أولًا'); location.hash='#/lib'; return; }
  const m=/^#\/s\/(.+)$/.exec(location.hash);

const PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.cors.lol/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u),
  u=>'https://whateverorigin.org/get?url='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
  u=>'https://cors-anywhere.herokuapp.com/'+u,
  u=>u
];
/* وسيطك أنت أوّلًا، ثم وسيط الاستضافة نفسها إن وُجد، ثم الوسطاء العامّون */
function proxyList(){
  const custom = (site.proxy||'').trim();
  const list = custom? [u=>custom.replace('{url}', encodeURIComponent(u))] : [];
  try{
    if(/^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|usercontent|artifact/i.test(location.hostname)){
      /* وسيط مساحتي على الاستضافة نفسها (Hostinger: api/tg.php) — الأسرع والأوثق */
      const base=location.pathname.replace(/[^/]*$/,'');
      list.push(u=>base+'api/tg.php?url='+encodeURIComponent(u));
      list.push(u=>base+'api/tg?url='+encodeURIComponent(u));
      list.push(u=>'/.netlify/functions/tg?url='+encodeURIComponent(u));
    }
  }catch(e){}
  return list.concat(PROXIES);
}
/* بعض الوسطاء يغلّفون الصفحة داخل JSON */
function unwrapBody(t){
  if(typeof t!=='string') return t;
  const s=t.trim();
  if(s[0]==='{'){ try{ const j=JSON.parse(s);
    const v=j.contents||j.data||j.body||j.html||j.content; if(typeof v==='string') return v;
  }catch(e){} }
  return t;
}
let lastGrabLog=[];
async function grab(url, asText, ms){
  let lastErr=null; lastGrabLog=[];
  for(const mk of proxyList()){
    const target=mk(url);
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(), ms||14000);
    try{
      const res = await fetch(target, {redirect:'follow', signal:ctl.signal});
      clearTimeout(to);
      if(!res.ok) throw new Error('HTTP '+res.status);
      let out = asText? await res.text() : await res.blob();
      if(asText) out=unwrapBody(out);
      if(asText && (!out || out.length<200)) throw new Error('رد فارغ');
      lastGrabLog.push('✓ '+host(target));
      return out;
    }catch(e){ clearTimeout(to); lastErr=e;
      lastGrabLog.push('✗ '+host(target)+' — '+(e.name==='AbortError'?'انتهت المهلة':(e.message||'خطأ'))); }
  }
  throw lastErr||new Error('fail');
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u.slice(0,24); } }
/* كل الوسطاء دفعة واحدة، ونأخذ أوّل من يردّ — أسرع بكثير من التجريب واحدًا واحدًا */
function anyOf(list){
  if(Promise.any) return Promise.any(list);
  return new Promise((res,rej)=>{ let n=list.length, e=null;
    list.forEach(p=>p.then(res).catch(x=>{ e=x; if(!--n) rej(e); })); });
}
async function grabAny(url, ms){
  lastGrabLog=[];
  const tries=proxyList().map(mk=>{
    const target=mk(url), ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(), ms||9000);
    return fetch(target,{redirect:'follow',signal:ctl.signal}).then(async res=>{
      clearTimeout(to);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const t=unwrapBody(await res.text());
      if(!t||t.length<200) throw new Error('رد فارغ');
      lastGrabLog.push('✓ '+host(target));
      return t;
    }).catch(e=>{ clearTimeout(to);
      lastGrabLog.push('✗ '+host(target)+' — '+(e.name==='AbortError'?'انتهت المهلة':(e.message||'خطأ')));
      throw e; });
  });
  return anyOf(tries);
}
function parseTg(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const out={};
  const txt=doc.querySelector('.tgme_widget_message_text');
  if(txt) out.text=(txt.innerText||txt.textContent||'').trim();
  const au=doc.querySelector('audio[src], .tgme_widget_message_voice, .tgme_widget_message_audio');
  const aSrc=doc.querySelector('audio[src]');
  if(aSrc) out.audio=aSrc.getAttribute('src');
  if(!out.audio){
    const v=doc.querySelector('.tgme_widget_message_voice');
    if(v && v.getAttribute('data-src')) out.audio=v.getAttribute('data-src');
  }
  const vid=doc.querySelector('video[src], video source[src]');
  if(vid) out.video=vid.getAttribute('src');
  const docWrap=doc.querySelector('.tgme_widget_message_document_wrap, a.tgme_widget_message_document_wrap');
  if(docWrap && docWrap.getAttribute('href')) out.doc=docWrap.getAttribute('href');
  const dl=doc.querySelector('a[href*="telesco.pe/file"], a[href*="telegram-cdn"]');
  if(!out.doc && dl) out.doc=dl.getAttribute('href');
  const dn=doc.querySelector('.tgme_widget_message_document_title, .tgme_widget_message_audio_title');
  if(dn) out.title=(dn.textContent||'').trim();
  const dur=doc.querySelector('.tgme_widget_message_audio_duration, time.time');
  if(dur) out.durTxt=(dur.textContent||'').trim();
  const ph=doc.querySelector('.tgme_widget_message_photo_wrap');
  if(ph){ const st=ph.getAttribute('style')||''; const m=/url\('([^']+)'\)/.exec(st); if(m) out.photo=m[1]; }
  const og=doc.querySelector('meta[property="og:title"]');
  if(!out.title && og) out.title=(og.getAttribute('content')||'').trim();
  return out;
}
function durToSec(t){
  if(!t) return 0;
  const p=String(t).split(':').map(x=>parseInt(x,10)||0);
  return p.length===3? p[0]*3600+p[1]*60+p[2] : p.length===2? p[0]*60+p[1] : p[0];
}
async function tgImport(url, target, statusEl){
  const ref=tgRef(url); if(!ref) throw new Error('رابط غير صالح');
  const say=t=>{ if(statusEl){ statusEl.textContent=t; statusEl.style.color='var(--muted)'; } };
  say('أقرأ المنشور من تيليجرام…');
  const html=await grab(`https://t.me/${ref.ch}/${ref.id}?embed=1&mode=tme`, true);
  const info=parseTg(html);
  const list=bucket(target); if(!list) throw new Error('لا يوجد قسم');
  const baseName=(info.title||(info.text||'').split('\n')[0]||('منشور '+ref.id)).slice(0,80);
  let added=0;
  if(info.audio||info.video){
    const remote=info.audio||info.video;
    const it={id:uid('i'), type: info.audio?'audio':'video', name:baseName, url:remote, src:url,
      dur:durToSec(info.durTxt), remote:true, ts:Date.now()};
    say('وجدت ملفًا صوتيًا/مرئيًا — أحاول تنزيله للتشغيل دون إنترنت…');
    try{
      const blob=await grab(remote,false);
      if(blob && blob.size>1000){ const key=uid('f'); await putFile(key,blob);
        it.file=key; it.size=blob.size; it.mime=blob.type; it.remote=false;
        try{ const d=await mediaDur(blob, it.type); if(d) it.dur=d; }catch(e){} }
    }catch(e){ say('سيُشغَّل مباشرة من تيليجرام (تعذّر تنزيله لحفظه في الجهاز).'); }
    list.push(it); added++;
  }
  if(info.doc){
    say('وجدت ملفًا — أنزّله…');
    const it={id:uid('i'), type:'link', name:baseName, url:info.doc, src:url, ts:Date.now()};
    try{
      const blob=await grab(info.doc,false);
      if(blob && blob.size>500){
        const key=uid('f'); await putFile(key,blob);
        const isPdf = blob.type==='application/pdf' || /\.pdf($|\?)/i.test(info.doc) || /pdf/i.test(baseName);
        it.type = isPdf? 'pdf' : (blob.type.startsWith('audio')?'audio': blob.type.startsWith('video')?'video':
                  blob.type.startsWith('image')?'img':'link');
        it.file=key; it.size=blob.size; it.mime=blob.type;
      }
    }catch(e){}
    list.push(it); added++;
  }
  if(!added && info.photo){
    const it={id:uid('i'), type:'img', name:baseName, url:info.photo, src:url, remote:true, ts:Date.now()};
    try{ const blob=await grab(info.photo,false);
      if(blob&&blob.size>500){ const key=uid('f'); await putFile(key,blob); it.file=key; it.size=blob.size; it.remote=false; }
    }catch(e){}
    list.push(it); added++;
  }
  if(info.text && info.text.length>40){
    list.push({id:uid('i'), type:'text', name:(added?baseName+' — النص':baseName), text:info.text, src:url, ts:Date.now()});
    added++;
  }
  if(!added){
    list.push({id:uid('i'), type:'telegram', name:baseName, url, ts:Date.now()});
    added++;
  }
  saveTree();
  return added;
}

function mediaDur(file,kind){
  return new Promise(res=>{
    const el=document.createElement(kind==='audio'?'audio':'video');
    const u=URL.createObjectURL(file);
    el.preload='metadata';
    el.onloadedmetadata=()=>{ res(isFinite(el.duration)?Math.round(el.duration):0); URL.revokeObjectURL(u); };
    el.onerror=()=>{ res(0); URL.revokeObjectURL(u); };
    el.src=u;
    setTimeout(()=>res(0), 4000);
  });
}

      if(!r.it.dur&&isFinite(vp.duration)){ r.it.dur=Math.round(vp.duration); saveTree(); } });

function replaceWithFile(id){
  const r=findItem(id); if(!r) return;
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    const key=uid('f');
    try{ await putFile(key,f); }catch(e){ toast('تعذّر الحفظ'); return; }
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    r.it.type=(f.type.startsWith('audio')||/^(mp3|m4a|wav|ogg|opus|aac)$/.test(ext))?'audio'
      :(f.type.startsWith('video')||/^(mp4|mov|mkv|webm)$/.test(ext))?'video'
      :(f.type==='application/pdf'||ext==='pdf')?'pdf'
      :(f.type.startsWith('image'))?'img':'link';
    r.it.file=key; r.it.size=f.size; r.it.mime=f.type;
    if(r.it.type==='audio'||r.it.type==='video'){ try{ r.it.dur=await mediaDur(f,r.it.type); }catch(e){} }
    saveTree(); render(); toast('تم الاستبدال — صار يعمل داخل مشغّل الموقع');
  };
  inp.click();
}

const m2hm=m=>{ m=((Math.round(m)%1440)+1440)%1440; return pad2(Math.floor(m/60))+':'+pad2(m%60); };

function durTxt(m){ if(!m) return ''; const h=Math.floor(m/60), x=m%60;

const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };

const D2R=Math.PI/180, R2D=180/Math.PI;
const sinD=d=>Math.sin(d*D2R), cosD=d=>Math.cos(d*D2R), tanD=d=>Math.tan(d*D2R);
const asinD=x=>R2D*Math.asin(x), acosD=x=>R2D*Math.acos(x);
const atan2D=(y,x)=>R2D*Math.atan2(y,x), acotD=x=>R2D*Math.atan(1/x);
const fixh=h=>((h%24)+24)%24;
function julianDay(y,m,d){ if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  const D=jd-2451545.0;
  const g=((357.529+0.98560028*D)%360+360)%360;
  const q=((280.459+0.98564736*D)%360+360)%360;
  const L=((q+1.915*sinD(g)+0.020*sinD(2*g))%360+360)%360;
  const e=23.439-0.00000036*D;
  const dec=asinD(sinD(e)*sinD(L));
  const RA=fixh(atan2D(cosD(e)*sinD(L),cosD(L))/15);
  let eqt=q/15-RA; eqt=((eqt+12+24)%24)-12;
  return {dec,eqt};
}
function midDay(jd,h){ return fixh(12-sunPos(jd+h/24).eqt); }
function angleTime(jd,h,ang,lat,ccw){
  const dec=sunPos(jd+h/24).dec;
  const x=(-sinD(ang)-sinD(dec)*sinD(lat))/(cosD(dec)*cosD(lat));
  if(x<-1||x>1) return null;            /* لا يحدث في هذا العرض (مناطق قطبية) */
  const v=acosD(x)/15;
  return midDay(jd,h)+(ccw?-v:v);
}
function asrTime(jd,h,lat){
  const dec=sunPos(jd+h/24).dec;
  return angleTime(jd,h,-acotD(1+tanD(Math.abs(lat-dec))),lat,false);
}
function calcPray(date,lat,lng,method){
  const jd=julianDay(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const M=PMETH[method]||PMETH.MWL;
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:19};
  for(let i=0;i<3;i++){
    const n={};
    n.fajr   =angleTime(jd,t.fajr,M.f,lat,true);
    n.sunrise=angleTime(jd,t.sunrise,0.833,lat,true);
    n.dhuhr  =midDay(jd,t.dhuhr)+1/60;
    n.asr    =asrTime(jd,t.asr,lat);
    n.maghrib=angleTime(jd,t.maghrib,0.833,lat,false);
    n.isha   =(typeof M.i==='number')? angleTime(jd,t.isha,M.i,lat,false)
             : (n.maghrib!=null? n.maghrib+(+M.i)/60 : null);
    for(const k in n) if(n[k]!=null) t[k]=n[k];
  }
  const tz=-date.getTimezoneOffset()/60;
  const out={};
  for(const k in t) out[k]=Math.round((fixh(t[k]+tz-lng/15))*60);
  return out;
}
const PRAY=[['fajr','الفجر'],['sunrise','الشروق'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
const PNAME=Object.fromEntries(PRAY);
let prayCache={};
function prayTimes(date){
  date=date||new Date();
  const key=ymd(date)+'|'+plan.pray.use+'|'+plan.pray.method+'|'+JSON.stringify(plan.loc)+JSON.stringify(plan.pray.manual)+JSON.stringify(plan.pray.adj);
  if(prayCache.k===key) return prayCache.v;
  let m=null;
  if(plan.pray.use==='manual'){
    m={}; let any=false;
    PRAY.forEach(([k])=>{ const v=hm2m(plan.pray.manual[k]); if(v!=null){ m[k]=v; any=true; } });
    if(!any) m=null;
  } else if(plan.loc && isFinite(plan.loc.lat)){
    try{ m=calcPray(date,+plan.loc.lat,+plan.loc.lng,plan.pray.method); }catch(e){ m=null; }
  }
  if(m) PRAY.forEach(([k])=>{ const a=+plan.pray.adj[k]||0; if(m[k]!=null) m[k]+=a; });
  prayCache={k:key,v:m};
  return m;
}
function nextPray(){
  const m=prayTimes(); if(!m) return null;
  const n=nowMin();
  let best=null;
  PRAY.forEach(([k,name])=>{ if(k==='sunrise') return;
    if(m[k]!=null&&m[k]>n&&(!best||m[k]<best.m)) best={k,name,m:m[k]}; });
  if(!best){ const f=m.fajr; if(f!=null) best={k:'fajr',name:'الفجر',m:f+1440}; }
  return best;
}

function taskSpan(t,date,pt){
  let s=null;
  if(!t.when) return null;
  if(t.when.k==='free') return {s:null,e:null};
  if(t.when.k==='clock') s=hm2m(t.when.t);
  else { const b=pt&&pt[t.when.p]; if(b==null) return null;
    s=b+(t.when.rel==='before'? -(+t.when.off||0) : (+t.when.off||0)); }
  if(s==null) return null;
  return {s, e:s+(+t.dur||0)};
}
function occursOn(t,date){
  const r=t.rep||{k:'daily'};
  if(r.k==='daily') return true;
  if(r.k==='week')  return (r.days||[]).includes(date.getDay());
  if(r.k==='month') return (r.dates||[]).includes(date.getDate());
  if(r.k==='once')  return r.date===ymd(date);
  return false;
}
function dayTasks(date){
  date=date||new Date();
  const pt=prayTimes(date);
  return plan.tasks.filter(t=>occursOn(t,date))
    .map(t=>{ const sp=taskSpan(t,date,pt); return sp?{t,s:sp.s,e:sp.e}:{t,s:null,e:null}; })
    .sort((a,b)=>(a.s==null?99999:a.s)-(b.s==null?99999:b.s));
}
const isDone=(id,date)=>!!(plan.done[ymd(date||new Date())]||{})[id];
function setTaskDone(id,v,date){
  const k=ymd(date||new Date());
  plan.done[k]=plan.done[k]||{};
  if(v) plan.done[k][id]=true; else delete plan.done[k][id];
  savePlan();
}
function nowNext(){
  const list=dayTasks(new Date()).filter(x=>x.s!=null);
  const n=nowMin();
  const cur=list.find(x=>n>=x.s&&n<x.e&&!isDone(x.t.id));
  const nxt=list.find(x=>x.s>n&&!isDone(x.t.id));
  const left=list.filter(x=>!isDone(x.t.id)).length;
  return {cur,nxt,left,total:list.length};
}
function planPill(){
  const {cur,nxt,left}=nowNext();
  if(cur) return {t:'الآن: '+cur.t.title, sub:'حتى '+clock(cur.e), on:true};
  if(nxt) return {t:'التالي: '+nxt.t.title, sub:clock(nxt.s), on:false};
  const {total}=nowNext();
  if(total) return {t:'أنجزت مهام اليوم ✓', sub:'', on:false};
  if(plan.tasks.length) return {t:'لا مهام اليوم', sub:'جدولك', on:false};
  return {t:'رتّب يومك', sub:'ابدأ جدولك', on:false};
}

function vPlanWeek(){

  let out='';

    const d=new Date(base); d.setDate(base.getDate()+i);

    const today=ymd(d)===ymd(new Date());
    out+=`<div class="pcardx ${today?'hl':''}"><div class="daytop"><div><b>${DAYS[d.getDay()]}</b>

function vPlanMonth(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  let cells='';
  for(let i=0;i<first.getDay();i++) cells+='<div class="cell out"></div>';
  for(let day=1;day<=last.getDate();day++){
    const d=new Date(y,m,day), list=dayTasks(d);
    const doneN=list.filter(x=>isDone(x.t.id,d)).length;
    const today=ymd(d)===ymd(now);
    const evs=evOn(d);
    cells+=`<div class="cell ${today?'today':''} ${evs.length?'hasev':''}" data-day="${ymd(d)}"><b>${AR(day)}</b>
      ${evs.length?`<span class="evdots">${evs.slice(0,3).map(e=>`<i style="background:${e.color||EVC[0]}"></i>`).join('')}</span>`:''}
      ${list.length?`<span class="bar"><i style="width:${Math.round(doneN/list.length*100)}%"></i></span>`:''}</div>`;

plan.fired=plan.fired||{};
let audioCtx=null;
function beep(n){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=audioCtx.currentTime;
    for(let i=0;i<(n||3);i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=i%2?880:660;
      g.gain.setValueAtTime(0.0001,t0+i*0.45);
      g.gain.exponentialRampToValueAtTime(0.25,t0+i*0.45+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.45+0.34);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0+i*0.45); o.stop(t0+i*0.45+0.4);
    }
  }catch(e){}
}
function alarmBox(x){
  let e=document.getElementById('alarm');
  if(!e){ e=document.createElement('div'); e.id='alarm'; e.className='alarm'; document.body.appendChild(e); }
  e.innerHTML=`<div class="abody">
    <b>حان وقت</b><span>${esc(x.t.title)}</span>
    <small>${x.s!=null?clock(x.s):''}${x.t.dur?' — '+durTxt(x.t.dur):''}</small>

      <button class="btn pri" data-al="done" data-id="${x.t.id}">${ICON.chk} أنجزتها</button>
      <button class="btn" data-al="snooze" data-id="${x.t.id}">بعد ١٠ دقائق</button>
      <button class="btn" data-al="close">إغلاق</button></div></div>`;
  e.classList.add('on');
  beep(3);
  try{ if(window.Notification&&Notification.permission==='granted')
    new Notification('حان وقت: '+x.t.title,{body:(x.s!=null?clock(x.s):'')+' — '+(site.name||'مساحتي'),tag:x.t.id}); }catch(e2){}
}
let snoozed={};
function checkAlarms(){
  const d=new Date(), k=ymd(d), n=nowMin();
  plan.fired[k]=plan.fired[k]||{};
  dayTasks(d).forEach(x=>{
    if(x.s==null||!x.t.alert) return;
    if(isDone(x.t.id,d)) return;
    const at=x.s-(+x.t.alertBefore||0);
    const sn=snoozed[x.t.id];
    const target=sn!=null? sn : at;
    if(n>=target&&n<target+2&&!plan.fired[k][x.t.id+':'+target]){
      plan.fired[k][x.t.id+':'+target]=1; savePlan();
      if(sn!=null) delete snoozed[x.t.id];
      alarmBox(x);
    }
  });
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-al]'); if(!b) return;

function vPlanGrid(){
  const base=new Date(); base.setDate(base.getDate()-base.getDay());
  const days=[]; for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(base.getDate()+i); days.push({d,list:dayTasks(d).filter(x=>x.s!=null)}); }
  let min=24*60, max=0;
  days.forEach(D=>D.list.forEach(x=>{ min=Math.min(min,x.s); max=Math.max(max,x.e||x.s+30); }));
  if(min>max){ min=6*60; max=22*60; }
  const h0=Math.floor(min/60), h1=Math.min(24,Math.ceil(max/60));
  let rows='';
  for(let h=h0;h<h1;h++){
    rows+=`<div class="gtime">${clock(h*60)}</div>`;
    days.forEach(D=>{
      const here=D.list.filter(x=>Math.floor(x.s/60)===h);
      rows+=`<div class="gcell ${ymd(D.d)===ymd(new Date())?'today':''}">
        ${here.map(x=>`<button class="gtask p${x.t.prio||3} ${isDone(x.t.id,D.d)?'done':''}" data-p="etask" data-id="${x.t.id}">
          <b>${esc(x.t.title)}</b><small>${clock(x.s)}${x.t.dur?'–'+clock(x.e):''}</small></button>`).join('')}
      </div>`;
    });
  }
  return `<div class="pcardx">
    <div class="daytop"><div><b>جدول الأسبوع</b><small>اضغط أي مهمة لتعديلها</small></div>
      <a class="lnk" href="#/plan/week">عرض قائمة</a></div>
    <div class="ttwrap"><div class="tt">
      <div class="gtime"></div>${days.map(D=>`<div class="ghead ${ymd(D.d)===ymd(new Date())?'today':''}">
        <b>${DAYS2[D.d.getDay()]}</b><small>${AR(D.d.getDate())}</small></div>`).join('')}
      ${rows}
    </div></div></div>`;
}

/* ---------- التذكير العائم ---------- */
let hintTimer=null, hintHideT=null, hintKind=0;
function hintEl(){
  let e=document.getElementById('nowhint');
  if(!e){ e=document.createElement('div'); e.id='nowhint'; e.className='nowhint';
    e.addEventListener('click',()=>hideHint(true)); document.body.appendChild(e); }
  return e;
}
function hideHint(byUser){
  const e=document.getElementById('nowhint'); if(e) e.classList.remove('on');
  clearTimeout(hintHideT);
  if(byUser) S.set('hintOff', Date.now()+1000*60*30);
}
function showHint(html,cls,ms){
  if(!plan.hint.on) return;
  if(typeof uiOn==='function'&&!uiOn('hint')) return;
  if(Date.now() < (S.get('hintOff',0)||0)) return;
  if(document.querySelector('.sheet')) return;
  const e=hintEl();
  e.className='nowhint '+(cls||'');
  e.innerHTML=html+'<i class="x">×</i>';
  requestAnimationFrame(()=>e.classList.add('on'));
  clearTimeout(hintHideT);
  hintHideT=setTimeout(()=>e.classList.remove('on'), ms||(+plan.hint.secs||3)*1000);
}
/* ذكر يمرّ سريعًا */
const AZKAR=['سبحان الله','الحمد لله','الله أكبر','لا إله إلا الله','لا حول ولا قوة إلا بالله',
  'اللّهمّ صلِّ وسلّم على نبيّنا محمّد','أستغفر الله وأتوب إليه','سبحان الله وبحمده',
  'لا إله إلا أنت سبحانك إني كنت من الظالمين','اللّهمّ أعنّي على ذكرك وشكرك وحسن عبادتك',
  'رب اشرح لي صدري ويسّر لي أمري','حسبنا الله ونعم الوكيل'];
let zIdx=Math.floor(Math.random()*AZKAR.length);
function zikrHint(){
  if(plan.hint.zikr===false) return;
  zIdx=(zIdx+1)%AZKAR.length;
  showHint(`<b>ذِكر</b><span>${esc(AZKAR[zIdx])}</span>`,'muse');
}
/* نداء الصلاة عند دخول وقتها */
function prayWatch(){
  try{
    if(plan.hint.pray===false) return;
    const m=prayTimes(new Date()); if(!m) return;
    const n=nowMin(), k=ymd(new Date());
    const seen=S.get('praySeen',{});
    PRAY.forEach(([key,name])=>{ if(key==='sunrise') return;
      const t=m[key]; if(t==null) return;
      const id=k+':'+key;
      if(n>=t && n<t+3 && !seen[id]){
        seen[id]=1; S.set('praySeen',seen);
        showHint(`<b>الصلاة</b><span>حان وقت صلاة ${esc(name)}</span><small>${clock(t)}</small>`,'task',6000);
        try{ beep(); }catch(e){}
      }
    });
  }catch(e){}
}
function taskHint(){
  const {cur,nxt,left}=nowNext();
  if(cur) return `<b>الآن</b><span>${esc(cur.t.title)}</span><small>حتى ${clock(cur.e)}</small>`;
  if(nxt){
    const before=+plan.hint.before||10;
    const d=nxt.s-nowMin();
    if(d<=before) return `<b>بعد ${AR(Math.max(1,Math.round(d)))} دقيقة</b><span>${esc(nxt.t.title)}</span><small>${clock(nxt.s)}</small>`;
    return null;                      /* لا نزعجك قبل وقته */
  }
  if(left) return `<b>اليوم</b><span>بقي ${AR(left)} من مهامك</span>`;
  return null;
}
function museHint(){
  const pool=[];
  /* ما اخترتَه ليمرّ عليك أوّلًا */
  const picked=quotes.filter(q=>q.hint);
  if(picked.length){ const x=picked[Math.floor(Math.random()*picked.length)];
    return `<b>${esc(x.src||'اقتباسك')}</b><span>${esc(noteText(x.t).slice(0,120))}</span>`; }
  plan.goals.forEach(g=>pool.push({b:'هدفك',t:g.title}));
  quotes.slice(0,40).forEach(q=>pool.push({b:'اقتباسك',t:noteText(q.t).slice(0,120)}));
  Object.keys(notes).slice(0,40).forEach(k=>{ const t=noteText(notes[k]); if(t) pool.push({b:'فائدتك',t:t.slice(0,120)}); });
  plan.prios.forEach(p=>pool.push({b:'أولويتك',t:p.t}));
  if(!pool.length) return null;
  const x=pool[Math.floor(Math.random()*pool.length)];
  return `<b>${x.b}</b><span>${esc(x.t)}</span>`;
}
function hintTick(){
  /* الذكر هو الأصل، والمهمّة تقطعه إن حان وقتها */
  const t=taskHint();
  if(t){ showHint(t,'task'); return; }
  if(hintKind++%3===2){ const m=museHint(); if(m){ showHint(m,'muse'); return; } }
  zikrHint();
}
let minTimer=null;
function startHints(){
  clearInterval(hintTimer); clearInterval(minTimer);
  const e=document.getElementById('nowhint'); if(e) e.classList.remove('on');
  if(!plan.hint.on) return;
  if(typeof uiOn==='function'&&!uiOn('hint')) return;
  setTimeout(()=>{ const h=taskHint(); if(h) showHint(h,'task'); }, 5000);
  /* إن كان تنبيه الصلاة مفتوحًا ولا موقع — ذكّره مرّة واحدة */
  setTimeout(()=>{ try{
    if(plan.hint.pray===false) return;
    if(prayTimes(new Date())) return;
    if(S.get('prayAsk',false)) return;
    S.set('prayAsk',true);
    showHint('<b>أوقات الصلاة</b><span>اختر مدينتك ليُنبّهك الموقع بدخول الوقت</span><small>الجدول ← أوقات الصلاة</small>','task',8000);
  }catch(e){} }, 9000);
  hintTimer=setInterval(hintTick, Math.max(1,+plan.hint.every||10)*60000);
  minTimer=setInterval(()=>{ try{ prayWatch(); const t=taskHint(); if(t) showHint(t,'task'); }catch(e){} }, 60000);
}

function planFab(){
  let f=document.getElementById('planfab');

  /* في الصفحة الأولى الشارة موجودة في الشريط الصغير — فلا نكرّرها */

/* ---------- ربط الأحداث ---------- */
document.addEventListener('click',ev=>{
  const ho=ev.target.closest('[data-ho]');
  if(ho){ document.querySelectorAll('#hintOn .seg').forEach(x=>x.classList.toggle('on',x===ho)); return; }
  const hz=ev.target.closest('[data-hz],[data-hp]');
  if(hz){ hz.classList.toggle('on'); return; }
  const b=ev.target.closest('[data-p]'); if(!b) return;
  const k=b.dataset.p;
  if(k==='etask'){ editTask(b.dataset.id||null); }
  else if(k==='eev'){ editEvent(b.dataset.id||null, b.dataset.d||null); }
  else if(k==='ics'){ icsAll(); }
  else if(k==='taskfor'){ pendGoal=b.dataset.g; editTask(null); }
  else if(k==='notif'){
    if(!window.Notification){ toast('متصفحك لا يدعم الإشعارات'); return; }
    Notification.requestPermission().then(r=>toast(r==='granted'?'تعمل الإشعارات الآن':'لم تُمنح الإذن')); }
  else if(k==='egoal'){ editGoal(b.dataset.id||null); }
  else if(k==='eprio'){ editPrio(b.dataset.i!=null?+b.dataset.i:null); }
  else if(k==='praycfg'){ prayConfig(); }
  else if(k==='tick'){
    const id=b.dataset.id, d=new Date(b.dataset.d+'T12:00:00');
    setTaskDone(id,!isDone(id,d),d);
    const row=b.closest('.trow'); if(row) row.classList.toggle('done',isDone(id,d));
    planFab();
  }
  else if(k==='hintsave'){
    const on=document.querySelector('#hintOn .seg.on'); 
    plan.hint.on = on? on.dataset.ho==='1' : true;
    plan.hint.every=Math.max(1,Math.min(240,+document.getElementById('hintEvery').value||10));
    plan.hint.secs=Math.max(2,Math.min(30,+document.getElementById('hintSecs').value||3));
    plan.hint.before=Math.max(1,Math.min(120,+document.getElementById('hintBefore').value||10));
    const zs=document.querySelector('[data-hz]'), ps=document.querySelector('[data-hp]');
    if(zs) plan.hint.zikr=zs.classList.contains('on');
    if(ps) plan.hint.pray=ps.classList.contains('on');
    S.set('hintOff',0); savePlan(); startHints(); toast('حُفظ');
  }
  else if(k==='print'){ doPrint(b.dataset.k); }
  else if(k==='hinttest'){ S.set('hintOff',0); const h=taskHint()||museHint();
    if(h) showHint(h,'task'); else zikrHint(); }
  else if(k==='pup'||k==='pdn'){
    const i=+b.dataset.i, j=k==='pup'?i-1:i+1;
    if(j<0||j>=plan.prios.length) return;
    const t=plan.prios[i]; plan.prios[i]=plan.prios[j]; plan.prios[j]=t; savePlan(); render();
  }
});
document.addEventListener('click',ev=>{
  const c=ev.target.closest('.calgrid .cell[data-day]'); if(!c) return;
  const evs=(plan.events||[]).filter(e=>e.date===c.dataset.day);
  if(evs.length===1) editEvent(evs[0].id); else editEvent(null,c.dataset.day);

document.addEventListener('change',ev=>{

  const g=plan.goals.find(x=>x.id===c.dataset.g); if(!g) return;

/* ================= طباعة الجدول ================= */
function prHead(title,sub){
  return `<div class="prhead">
    <div class="prbrand">${esc(site.name||'مساحتي')}</div>
    <h1>${esc(title)}</h1>
    <div class="prsub">${esc(sub||'')}</div>
    <div class="prrule"><span></span><i>◆</i><span></span></div>
  </div>`;
}
function prPray(date){
  const m=prayTimes(date); if(!m) return '';
  return `<div class="prpray">${PRAY.map(([k,n])=>`<div><b>${n}</b><span>${clock(m[k])}</span></div>`).join('')}</div>`;
}
function prDay(date,blank){
  const list=blank? [] : dayTasks(date);
  const rows=(blank? Array.from({length:12},()=>null) : list).map(x=>`
    <tr><td class="c"><span class="box"></span></td>
      <td class="t">${x? (x.s!=null? clock(x.s):'—') : ''}</td>
      <td class="d">${x? esc(x.t.title) : ''}
        ${x&&x.t.note? `<i>${esc(x.t.note)}</i>`:''}</td>
      <td class="m">${x&&x.t.dur? durTxt(x.t.dur) : ''}</td></tr>`).join('');
  const gs=(plan.goals||[]).slice(0,4), ps=(plan.prios||[]).slice(0,4);
  return `<section class="prpage">
    ${prHead('جدول اليوم', DAYS[date.getDay()]+' · '+AR(date.getDate())+' '+MONTHS[date.getMonth()]+' '+AR(date.getFullYear()))}

    <table class="prtab"><thead><tr><th></th><th>الوقت</th><th>المهمّة</th><th>المدّة</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="prcols">
      <div><h3>أهدافي</h3>${gs.length?gs.map(g=>`<div class="prli"><span class="box"></span>${esc(g.title)}</div>`).join(''):'<div class="prlines"></div>'}</div>
      <div><h3>أولوياتي</h3>${ps.length?ps.map(p=>`<div class="prli"><span class="box"></span>${esc(p.t)}</div>`).join(''):'<div class="prlines"></div>'}</div>
    </div>
    <div class="prnotes"><h3>ما استفدته اليوم</h3><div class="prlines"></div></div>
    <div class="prfoot">${esc(site.tag||'')}</div>
  </section>`;

function prWeek(blank){
  const base=new Date(); base.setDate(base.getDate()-base.getDay());
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(base.getDate()+i);
    days.push({d,list:blank?[]:dayTasks(d)}); }
  const max=Math.max(6,...days.map(D=>D.list.length));
  let rows='';
  for(let r=0;r<max;r++){
    rows+='<tr>'+days.map(D=>{ const x=D.list[r];
      return `<td>${x?`<span class="box"></span><b>${x.s!=null?clock(x.s):''}</b><em>${esc(x.t.title)}</em>`:'<span class="box"></span>'}</td>`;
    }).join('')+'</tr>';
  }
  const from=days[0].d, to=days[6].d;
  return `<section class="prpage wide">
    ${prHead('جدول الأسبوع', AR(from.getDate())+' '+MONTHS[from.getMonth()]+' — '+AR(to.getDate())+' '+MONTHS[to.getMonth()]+' '+AR(to.getFullYear()))}
    ${prPray(new Date())}
    <table class="prweek"><thead><tr>${days.map(D=>`<th>${DAYS2[D.d.getDay()]}<small>${AR(D.d.getDate())}</small></th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="prfoot">${esc(site.name||'مساحتي')} · ${esc(site.tag||'')}</div>
  </section>`;
}
function doPrint(kind){
  const old=document.getElementById('printsheet'); if(old) old.remove();
  const box=document.createElement('div'); box.id='printsheet';
  box.innerHTML = kind==='week'? prWeek(false)
    : kind==='weekblank'? prWeek(true)
    : kind==='blank'? prDay(new Date(),true) : prDay(new Date(),false);
  document.body.appendChild(box);
  document.documentElement.classList.add('printing');
  const done=()=>{ document.documentElement.classList.remove('printing');
    const e=document.getElementById('printsheet'); if(e) e.remove();
    removeEventListener('afterprint',done); };
  addEventListener('afterprint',done);
  setTimeout(()=>{ try{ print(); }catch(e){ toast('تعذّرت الطباعة'); done(); } },120);
  setTimeout(()=>{ if(document.documentElement.classList.contains('printing')) done(); },60000);
}

function evNext(days){

}

/* ملف تقويم يضيف الموعد إلى تقويم الهاتف فيذكّرك ولو كان الموقع مغلقًا */
function icsPad(n){ return (n<10?'0':'')+n; }
function icsDT(date,time){
  const d=new Date(date+'T'+(time||'09:00')+':00');
  return d.getFullYear()+icsPad(d.getMonth()+1)+icsPad(d.getDate())+'T'+icsPad(d.getHours())+icsPad(d.getMinutes())+'00';
}
function icsBody(list){
  const now=new Date();
  const stamp=now.getFullYear()+icsPad(now.getMonth()+1)+icsPad(now.getDate())+'T'+icsPad(now.getHours())+icsPad(now.getMinutes())+'00';
  const esc2=s=>String(s||'').replace(/([,;\\\\])/g,'\\\\$1').replace(/\n/g,'\\\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//masahati//AR','CALSCALE:GREGORIAN']
    .concat(list.flatMap(e=>{
      const st=icsDT(e.date,e.time), en=icsDT(e.date, e.time? m2hm(hm2m(e.time)+60) : '10:00');
      const al=['BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+esc2(e.title),'END:VALARM'];
      const al2=e.remind!==0? ['BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+esc2('غدًا: '+e.title),'END:VALARM'] : [];
      return ['BEGIN:VEVENT','UID:'+(e.id||uid('e'))+'@masahati','DTSTAMP:'+stamp,
        'DTSTART:'+st,'DTEND:'+en,'SUMMARY:'+esc2(e.title),
        e.note?'DESCRIPTION:'+esc2(e.note):null].filter(Boolean)
        .concat(al,al2,['END:VEVENT']);
    }))
    .concat(['END:VCALENDAR']).join('\r\n');
}
function icsEvent(e){ saveBlob(new Blob([icsBody([e])],{type:'text/calendar'}), (e.title||'موعد')+'.ics', false);
  toast('افتح الملف ليُضاف إلى تقويم جهازك — فيذكّرك ولو كان الموقع مغلقًا'); }
function icsAll(){
  const list=(plan.events||[]).filter(e=>e.date>=ymd(new Date()));
  if(!list.length){ toast('لا مواعيد قادمة'); return; }
  saveBlob(new Blob([icsBody(list)],{type:'text/calendar'}),'مواعيدي.ics',false);
  toast('افتح الملف ليُضاف إلى تقويم جهازك');
}
/* تذكير اليوم والغد */
function evRemind(){
  const k=ymd(new Date());
  const seen=S.get('evseen',{});
  const today=evOn(new Date());
  const tm=new Date(); tm.setDate(tm.getDate()+1);
  const tom=evOn(tm).filter(e=>e.remind!==0);
  const bits=[];
  if(today.length) bits.push({b:'اليوم',t:today.map(e=>e.title).join(' · ')});
  if(tom.length) bits.push({b:'غدًا',t:tom.map(e=>e.title).join(' · ')});
  if(!bits.length) return;
  if(seen[k]) return;
  seen[k]=1; S.set('evseen',seen);
  const h=bits.map(x=>`<b>${x.b}</b><span>${esc(x.t)}</span>`).join('');
  setTimeout(()=>showHint(h,'task'),2500);
  try{ if(window.Notification&&Notification.permission==='granted')
    new Notification(bits[0].b+': '+bits[0].t,{body:site.name||'مساحتي'}); }catch(e){}
}

/* يقبل أي صيغة: @اسم — اسم — t.me/اسم — رابط منشور — t.me/s/اسم — رابط embed — نسخ من التطبيق */
function parseTgLink(s){
  s=(s||'').trim();
  if(!s) return {u:'',id:0,priv:false};
  /* رابط دعوة أو قناة خاصّة: لا يمكن عرضها */
  if(/(t|telegram)\.me\/(\+|joinchat\/|c\/)/i.test(s)) return {u:'',id:0,priv:true};
  let t=s.replace(/^https?:\/\//i,'')
         .replace(/^(www\.)?(t|telegram)\.me\//i,'')
         .replace(/^s\//i,'')
         .replace(/^@/,'');
  const m=/^([A-Za-z0-9_]{3,})(?:\/(\d{1,12}))?/.exec(t);
  if(!m) return {u:'',id:0,priv:false};
  let id=+(m[2]||0);
  if(!id){ const q=/[?&](?:post|single|comment)=?(\d{1,12})/.exec(s); if(q) id=+q[1]; }
  return {u:m[1], id, priv:false};
}
function chanU(s){ return parseTgLink(s).u; }
function parseChannel(html, u){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const wraps=[...doc.querySelectorAll('.tgme_widget_message_wrap, .tgme_widget_message')];
  const seen={}, posts=[];
  wraps.forEach(w=>{
    const msg=w.classList.contains('tgme_widget_message')? w : w.querySelector('.tgme_widget_message');
    if(!msg) return;
    const post=msg.getAttribute('data-post')||'';
    const id=+((post.split('/')[1])||0); if(!id||seen[id]) return; seen[id]=1;
    const o={id, url:'https://t.me/'+u+'/'+id};
    const tx=msg.querySelector('.tgme_widget_message_text');
    if(tx){ o.html=tx.innerHTML; o.text=(tx.textContent||'').trim(); }
    const ph=msg.querySelector('.tgme_widget_message_photo_wrap');
    if(ph){ const m=/url\(['"]?([^'")]+)/.exec(ph.getAttribute('style')||''); if(m) o.photo=m[1]; }
    const vp=msg.querySelector('video.tgme_widget_message_video, video[src]');
    if(vp) o.video=vp.getAttribute('src');
    const vth=msg.querySelector('.tgme_widget_message_video_thumb');
    if(vth){ const m=/url\(['"]?([^'")]+)/.exec(vth.getAttribute('style')||''); if(m) o.thumb=m[1]; }
    const aud=msg.querySelector('audio[src]');
    if(aud) o.audio=aud.getAttribute('src');
    const voice=msg.querySelector('.tgme_widget_message_voice');
    if(!o.audio&&voice&&voice.getAttribute('src')) o.audio=voice.getAttribute('src');
    const at=msg.querySelector('.tgme_widget_message_audio_title, .tgme_widget_message_document_title');
    if(at) o.title=(at.textContent||'').trim();
    const ad=msg.querySelector('.tgme_widget_message_audio_duration, .tgme_widget_message_voice_duration');
    if(ad) o.durTxt=(ad.textContent||'').trim();
    const dw=msg.querySelector('a.tgme_widget_message_document_wrap, .tgme_widget_message_document_wrap');
    if(dw&&dw.getAttribute('href')) o.doc=dw.getAttribute('href');
    const ds=msg.querySelector('.tgme_widget_message_document_extra');
    if(ds) o.size=(ds.textContent||'').trim();
    const tm=msg.querySelector('time[datetime]');
    if(tm) o.at=tm.getAttribute('datetime');
    const vw=msg.querySelector('.tgme_widget_message_views');
    if(vw) o.views=(vw.textContent||'').trim();
    if(o.text||o.photo||o.audio||o.video||o.doc) posts.push(o);
  });
  posts.sort((a,b)=>b.id-a.id);
  const ttl=doc.querySelector('.tgme_channel_info_header_title, meta[property="og:title"]');
  const desc=doc.querySelector('.tgme_channel_info_description');
  const img=doc.querySelector('.tgme_page_photo_image img, .tgme_channel_info_header_photo img');
  return {posts,
    name: ttl? (ttl.textContent||ttl.getAttribute('content')||'').trim() : u,
    about: desc? (desc.textContent||'').trim() : '',
    photo: img? img.getAttribute('src') : ''};
}
/* نسخة محفوظة من آخر جلب ناجح — تُعرض فورًا وإن انقطع الإنترنت */
function tgSaved(u){ const all=S.get('tgcache',{}); return all[u]||null; }
function tgSave(u,d){
  const all=S.get('tgcache',{});
  all[u]={t:Date.now(), name:d.name, about:d.about, photo:d.photo,
    posts:d.posts.slice(0,25).map(p=>{ const o=Object.assign({},p);
      if(o.html&&o.html.length>4000) o.html=o.html.slice(0,4000)+'…'; return o; })};
  const keys=Object.keys(all);
  if(keys.length>12){ keys.sort((a,b)=>(all[a].t||0)-(all[b].t||0)); delete all[keys[0]]; }
  try{ S.set('tgcache',all); }catch(e){}
}
async function loadChannel(u, force){
  const c=chanCache[u];
  if(!force && c && Date.now()-c.t < 120000) return c.d;
  let html=null, err=null;
  for(const url of ['https://t.me/s/'+u, 'https://t.me/'+u]){
    try{ html=await grabAny(url, 9000); if(html) break; }catch(e){ err=e; }
  }
  if(!html) throw err||new Error('fail');
  const d=parseChannel(html,u);
  if(!d.posts.length) throw new Error('empty');
  chanCache[u]={t:Date.now(), d};
  tgSave(u,d);
  const ch=chans.find(x=>x.u===u);
  if(ch){ ch.name=d.name||ch.name; ch.photo=d.photo||ch.photo; ch.about=d.about||ch.about;
    if(d.posts[0]) ch.top=d.posts[0].id; saveChans(); }
  return d;
}
function tgDate(s){
  if(!s) return '';
  const d=new Date(s); if(isNaN(d)) return '';
  const now=new Date(), diff=(now-d)/60000;
  if(diff<1) return 'الآن';
  if(diff<60) return 'قبل '+AR(Math.round(diff))+' د';
  if(diff<1440) return 'قبل '+AR(Math.round(diff/60))+' س';
  return AR(d.getDate())+' '+MONTHS[d.getMonth()];
}

  document.querySelectorAll('#chFeed [data-hlroot]').forEach(r=>{ r.dataset.raw=r.innerHTML; paintText(r); });
}
async function fillFeed(force){
  const box=document.getElementById('chFeed'); if(!box) return;
  const u=box.dataset.u, auto=box.dataset.mode!=='read';
  const c=chans.find(x=>x.u===u)||{u};
  const sv=tgSaved(u);
  /* اعرض المحفوظ فورًا ثم حدّثه في الخلفية */
  if(sv&&sv.posts&&sv.posts.length){ box.innerHTML=feedHTML(u,sv,true); paintFeed(); }
  else box.innerHTML=`<div class="pcardx">جارٍ جلب آخر المنشورات…</div>`;
  if(inSandbox()&&!(sv&&sv.posts&&sv.posts.length)){ box.innerHTML=frameFallback(u,c,'sandbox'); watchPosts(); return; }
  try{
    const d=await loadChannel(u,force);
    const ch=chans.find(x=>x.u===u);
    if(ch){ const top=d.posts[0]?d.posts[0].id:0;
      ch.newN=Math.max(0,d.posts.filter(p=>p.id>(ch.seen||0)).length);
      ch.seen=top; saveChans(); }
    const ab=document.getElementById('chAbout'); if(ab&&d.about) ab.textContent=d.about;
    box.innerHTML=feedHTML(u,d,false); paintFeed();
  }catch(e){
    if(sv&&sv.posts&&sv.posts.length) return;          /* المحفوظ معروض أصلًا */
    if(auto){ box.innerHTML=frameFallback(u,c,'net'); watchPosts(); return; }
    box.innerHTML=`<div class="pcardx">
      <b>تعذّر جلب المنشورات</b>
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.9">
        القراءة داخل الموقع تمرّ عبر وسيط عام، وهذه الوسطاء تتعطّل كثيرًا.
        جرّب «منشورات أصلية» فهو لا يحتاج وسيطًا، أو ضع وسيطك الخاص في الإعدادات.</p>
      <div class="tgstat" dir="ltr" style="text-align:left">${lastGrabLog.map(esc).join('<br>')}</div>
      <div class="sheetrow" style="margin:10px 0 0">
        <button class="btn pri" data-c="mode" data-m="live">المنشورات الأصلية</button>
        <button class="btn" data-c="refresh">أعد المحاولة</button>
        <a class="btn" href="https://t.me/${esc(u)}" target="_blank" rel="noopener">${ICON.ext} في تيليجرام</a></div></div>`;
  }
}
/* حين يتعذّر الجلب: منشورات تيليجرام الأصلية بلا وسيط */
function frameFallback(u,c,why){
  const top=+(c.top||0), show=+(c.show||CH_STEP);
  const why2 = why==='sandbox'
    ? 'أنت داخل صفحة claude.ai وهي تمنع الاتصال الخارجي — وهذه المنشورات الأصلية قد لا تظهر أيضًا. افتح الملف أو رابط استضافتك.'
    : 'تعذّر الوصول إلى تيليجرام عبر الوسطاء، فانتقلنا إلى المنشورات الأصلية — وهي لا تحتاج وسيطًا.';
  return `<div class="pcardx note2">${ICON.info} ${why2}</div>
    ${top? postFrames(u,top,show)+
      `<div class="sheetrow" style="margin:0 16px 20px"><button class="btn" data-c="more" data-u="${esc(u)}">اعرض أقدم</button>
        <button class="btn" data-c="refresh">أعد محاولة الجلب</button></div>`
     : topBox(u,0)}`;
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-c]'); if(!b) return;
  const k=b.dataset.c;
  if(k==='add'){
    ev.preventDefault();
    const inp=document.getElementById('chAdd');
    const p=parseTgLink(b.dataset.u || (inp?inp.value:''));
    if(p.priv){ toast('قناة خاصّة أو رابط دعوة — تيليجرام لا يسمح بعرضها خارج التطبيق'); return; }
    const u=p.u;
    if(!u){ toast('اكتب اسم القناة أو الصق أي رابط منها'); return; }
    let c=chans.find(x=>x.u===u);
    if(!c){ c={u,name:u,seen:0}; chans.push(c); toast('أُضيفت — جارٍ الجلب…'); }
    else toast('القناة مضافة');
    if(p.id){ c.top=p.id; c.show=CH_STEP; }
    saveChans();
    location.hash='#/tg/'+u;
    if(location.hash==='#/tg/'+u) render();
  }
  else if(k==='del'){
    ev.preventDefault(); ev.stopPropagation();
    chans=chans.filter(x=>x.u!==b.dataset.u); saveChans(); render();
  }
  else if(k==='refresh'){ fillFeed(true); }
  else if(k==='settop'){
    const v=((document.getElementById('chTop')||{}).value||'').trim();
    const u=b.dataset.u;
    let id=parseTgLink(v).id;
    if(!id && /^\d{1,12}$/.test(v)) id=+v;                    /* الرقم وحده يكفي */
    if(!id){ const m=/(\d{1,12})/.exec(v); if(m) id=+m[1]; }
    if(!id){ toast('الصق رابط منشور أو اكتب رقمه'); return; }
    let c=chans.find(x=>x.u===u);
    if(!c){ c={u,name:u,seen:0}; chans.push(c); }
    c.top=id; c.show=CH_STEP; saveChans(); render();
  }
  else if(k==='more'){
    const c=chans.find(x=>x.u===b.dataset.u); if(!c) return;
    c.show=(+c.show||CH_STEP)+CH_STEP; saveChans(); render();
  }
  else if(k==='mode'){ S.set('chmode', b.dataset.m); render(); }
  else if(k==='reload'){ const f=document.getElementById('chFrame'); if(f) f.src=f.src; }
  else if(k==='chfull'){ const box=document.getElementById('chLive');
    if(box){ const on=!box.classList.contains('full');
      box.classList.toggle('full',on); document.body.style.overflow=on?'hidden':'';
      const btn=document.getElementById('chFullBtn'); if(btn) btn.textContent=on?'خروج':'ملء الشاشة'; } }
  else if(k==='playp'){
    const url=b.dataset.u, name=b.dataset.n;
    const id='tgp:'+btoa(unescape(encodeURIComponent(url))).slice(0,24);
    au.src=url; P.el.classList.add('up');
    P.title.innerHTML=`<b>${esc(name)}</b><small>من تيليجرام</small>`;
    P.title.href=location.hash;
    au.playbackRate=S.get('rate',1);
    au.play().catch(()=>toast('تعذّر التشغيل — قد يمنع المتصفح الوصول'));
    if('mediaSession' in navigator){ try{
      navigator.mediaSession.metadata=new MediaMetadata({title:name,artist:site.name||'مساحتي',artwork:artwork(name)});
    }catch(e){} mediaInit(); }
  }
  else if(k==='imp'){
    const url=b.dataset.url;
    if(!tree.length){ toast('أنشئ قسمًا في المكتبة أولًا'); location.hash='#/lib'; return; }
    sheet(`<h3>استيراد المنشور</h3>
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">اختر القسم الذي يُضاف إليه.</p>
      <div class="rows" style="display:flex;flex-direction:column;gap:8px">
        ${tree.map(sec=>`<button class="tile" data-tgt="${sec.id}"><div class="ic">${ICON.lib}</div>
          <div><b>${esc(sec.name)}</b><small>${AR(secCount(sec))} عنصر</small></div></button>
          ${(sec.subs||[]).map(sub=>`<button class="tile" data-tgt="${sec.id}:${sub.id}" style="margin-inline-start:18px">
            <div class="ic" style="background:var(--bg2);color:var(--muted)">${ICON.lib}</div>
            <div><b>${esc(sub.name)}</b><small>داخل ${esc(sec.name)}</small></div></button>`).join('')}`).join('')}
      </div><div class="tgstat" id="impStat"></div>`, el=>{
      el.addEventListener('click',async e2=>{
        const t=e2.target.closest('[data-tgt]'); if(!t) return;
        const st=el.querySelector('#impStat');
        try{ await tgImport(url, t.dataset.tgt, st); closeSheet(); render(); toast('أُضيف إلى مكتبتك'); }
        catch(err){ if(st){ st.textContent='تعذّر الاستيراد — جرّب وسيطًا آخر من الإعدادات.'; st.style.color='#c0392b'; } }

function restoreAll(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=async()=>{ const f=i.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text());
      if(d.site) S.set('site',d.site);

      if(d.quotes) S.set('quotes',d.quotes);
      if(d.notes) S.set('notes',d.notes);

/* ---------- الوصول إلى المشغّل ---------- */
let ytPlayer = null, rangeStop = null;
function ytHook() {
  ytPlayer = null;
  const f = document.getElementById('ytframe');
  if (!f || ytMode() === 'alt') return;
  const boot = () => { try { ytPlayer = new YT.Player('ytframe', { events: {} }); } catch (e) {} };
  if (window.YT && YT.Player) { boot(); return; }
  if (!document.getElementById('ytapi')) {
    const s = document.createElement('script');
    s.id = 'ytapi'; s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => { if (prev) { try { prev(); } catch (e) {} } boot(); };
}
/* الوقت الحالي — null يعني أنّنا لا نعرفه فنسأل المستخدم */
function nowTime(it) {
  if (it.type === 'video') { const v = document.getElementById('vplayer'); return v ? (v.currentTime || 0) : null; }
  if (it.type === 'audio') {
    if (typeof current !== 'undefined' && current && current.id === it.id) return au.currentTime || 0;
    const p = S.get('pos', {})[it.id]; return p != null ? p : null;
  }
  if (it.type === 'youtube') {
    if (ytPlayer && ytPlayer.getCurrentTime) { try { const t = ytPlayer.getCurrentTime(); if (t >= 0) return t; } catch (e) {} }
    return null;
  }
  return null;
}
function seekItem(it, t, end) {
  rangeStop = (end && end > t) ? { id: it.id, end } : null;
  if (it.type === 'video') {
    const v = document.getElementById('vplayer');
    if (v) { try { v.currentTime = t; v.play().catch(() => {}); } catch (e) {} return true; }
  }
  if (it.type === 'audio') { play(it.id, t); return true; }
  if (it.type === 'youtube') {
    if (ytPlayer && ytPlayer.seekTo) {
      try { ytPlayer.seekTo(t, true); if (ytPlayer.playVideo) ytPlayer.playVideo(); return true; } catch (e) {}
    }
    const f = document.getElementById('ytframe');
    if (f && f.dataset.yid) { f.src = ytSrc(f.dataset.yid, ytMode()) + '&start=' + Math.floor(t) + '&autoplay=1'; return true; }
  }
  toast('شغّل المقطع أولًا');
  return false;
}
/* التوقّف عند نهاية المقطع المعلَّم */
function stopWatch(t, id) {
  if (!rangeStop || rangeStop.id !== id) return;
  if (t >= rangeStop.end) {
    rangeStop = null;
    try { au.pause(); } catch (e) {}
    const v = document.getElementById('vplayer'); if (v) v.pause();
    if (ytPlayer && ytPlayer.pauseVideo) { try { ytPlayer.pauseVideo(); } catch (e) {} }
    toast('انتهى المقطع المعلَّم');
  }
}
try { au.addEventListener('timeupdate', () => { if (current) stopWatch(au.currentTime, current.id); }); } catch (e) {}

/* ---------- تحويل الوقت ---------- */
function toSec(s) {
  s = (s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return +s;
  const p = s.split(':').map(x => +x);
  if (p.some(isNaN)) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0];
}
const arTime = s => AR(mmss(s));

  const cur = d ? (d.segs || []).map(s => (s.s != null ? mmss(s.s) + ' ' : '') + s.t).join('\n') : '';
  sheet(`<h3>ألصق التفريغ</h3>
    <div class="field"><textarea id="txP" dir="rtl" placeholder="٠:٠٠ بسم الله…&#10;١:٢٤ وبعد…">${esc(cur)}</textarea></div>
    <p class="mkempty">كل سطر مقطع. وإن بدأ السطر بوقت مثل ٢:٣٠ أو 2:30 صار زرًّا يقفز إليه.</p>
    <div class="sheetrow"><button class="btn pri" data-txp="1">${ICON.chk} حفظ</button>
      <button class="btn" onclick="closeSheet()">إغلاق</button></div>`, el => {
    el.querySelector('[data-txp]').addEventListener('click', () => {
      const v = el.querySelector('#txP').value || '';
      const segs = parseTxText(v);
      if (!segs.length) { toast('اكتب شيئًا'); return; }
      saveTx(it.id, { how: 'paste', at: Date.now(), segs });
      closeSheet(); render(); toast('حُفظ');

function parseTxText(v) {
  return (v || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = /^[\[\(]?([\d٠-٩]{1,2}:[\d٠-٩]{2}(?::[\d٠-٩]{2})?)[\]\)]?\s*[-—:]?\s*(.*)$/.exec(l);
    if (m && m[2]) return { s: toSec(m[1]), t: m[2] };
    return { s: null, t: l };
  });
}

async function txCaptions(it) {
  const yid = ytId(it.url);
  if (!yid) { toast('رابط يوتيوب غير صالح'); return; }
  const box = txProgress('جارٍ البحث عن ترجمة الفيديو…');
  try {
    const html = await grabAny('https://www.youtube.com/watch?v=' + yid, 12000);
    const m = /"captionTracks":(\[.*?\])/.exec(html);
    if (!m) throw new Error('لا ترجمة');
    const tracks = JSON.parse(m[1].replace(/\\u0026/g, '&'));
    const pick = tracks.find(t => /^ar/i.test(t.languageCode)) || tracks[0];
    if (!pick || !pick.baseUrl) throw new Error('لا ترجمة');
    const xml = await grabAny(pick.baseUrl.replace(/\\u0026/g, '&'), 12000);
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const segs = [...doc.querySelectorAll('text')].map(t => ({
      s: +t.getAttribute('start') || 0,
      t: (t.textContent || '').replace(/&#39;/g, '\'').replace(/\s+/g, ' ').trim()
    })).filter(x => x.t);
    if (!segs.length) throw new Error('لا ترجمة');
    saveTx(it.id, { how: 'auto', model: 'ترجمة يوتيوب', at: Date.now(), segs });
    closeSheet(); render(); toast('جُلبت الترجمة');
  } catch (e) {
    if (box) box.innerHTML = `<h3>تعذّر جلب الترجمة</h3>
      <p class="mkempty">قد لا يكون للفيديو ترجمة مكتوبة، أو منع الوسيط الوصول.
        تستطيع لصق النصّ بنفسك، أو رفع الصوت كملف في مكتبتك وتفريغه آليًّا.</p>
      <div class="sheetrow"><button class="btn pri" data-txp2="paste">ألصق نصًّا</button>
        <button class="btn" onclick="closeSheet()">إغلاق</button></div>`;
    if (box) box.addEventListener('click', ev => {
      if (ev.target.closest('[data-txp2]')) { closeSheet(); txPaste(it); }
    });
  }
}

  L.push(`بطاقة رسوميّة (WebGPU): ${navigator.gpu ? ok : '—'}`);

  if (r.libErr || r.hfErr || r.hfStatus !== 200)
    L.push('<br>أكثر ما يمنعه: شبكة تحجب هذين العنوانين (شبكة عمل أو مدرسة أو مزوّد)، أو مانع إعلانات، أو تصفّح خفيّ. جرّب شبكة أخرى أو متصفّحًا آخر.');

let TXJOB = null;        /* {itemId,name,total,i,segs,state,model,t0} */
let txPipe = null, txPipeName = '';
