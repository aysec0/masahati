/* ================= note editor ================= */
const RT=[['bold','<b>ب</b>','عريض'],['italic','<i>م</i>','مائل'],['underline','<u>ت</u>','تحته خط'],
 ['strikeThrough','<s>ش</s>','مشطوب'],['h2','عنوان','عنوان'],['insertUnorderedList','•—','نقاط'],
 ['insertOrderedList','١—','ترقيم'],['bigger','أ+','أكبر'],['smaller','أ−','أصغر'],
 ['justifyRight','⇥','يمين'],['justifyCenter','≡','وسط'],
 ['removeFormat','إزالة','إزالة التنسيق']];
/* ألوان جاهزة: ثلاثة تظليلات خفيفة وثلاثة ألوان للحرف */
const RTHL=[['#ffe9a3','أصفر'],['#bfe7c8','أخضر'],['#c3dcf5','أزرق']];
const RTFG=[['none','بلا لون'],['#0d6e5f','أخضر'],['#96702a','ذهبي'],['#8a4b2a','بنّي'],['#2f5fa8','أزرق']];
function rtoolsHTML(){
  return `<div class="rtools">
    ${RT.map(([k,l,t])=>`<button data-rt="${k}" title="${t}">${l}</button>`).join('')}
    <span class="rtsep"></span>
    ${RTHL.map(([c,t])=>`<button class="rtsw" data-rthl="${c}" title="تظليل ${t}" style="background:${c}"></button>`).join('')}
    ${RTFG.map(([c,t])=>`<button class="rtsw fg${c==='none'?' non':''}" data-rtfg="${c}" title="${c==='none'?'أعِد اللون الأصليّ':'لون الحرف '+t}"
      ${c==='none'?'':`style="color:${c}"`}>أ</button>`).join('')}
    <button class="rtsw more" data-rtmore="1" title="ألوان أخرى">+</button>
  </div>`;
}
function rtColor(cmd,color,rich,onChange){
  rich.focus();
  try{
    document.execCommand('styleWithCSS',false,true);
    document.execCommand(cmd,false,color);
  }catch(e){}
  if(onChange) onChange();
}
function bindRich(el,rich,onChange){
  /* شريط الأدوات قد يكون خارج المحرِّر — فنبحث عن أقرب شريط يسبقه */
  (function(){
    let tools=null, n=rich;
    while(n && n!==document.body && !tools){
      let s=n.previousElementSibling;
      while(s && !tools){
        if(s.classList && s.classList.contains('rtools')) tools=s;
        else if(s.querySelector) tools=s.querySelector('.rtools');
        s=s.previousElementSibling;
      }
      if(!tools) n=n.parentElement;
    }
    if(tools) el=tools;
    else if(!el || !el.querySelector || !el.querySelector('.rtools')) el=rich.parentElement||rich;
  })();
  /* الكيبورد لا يختفي ولا يضيع ما حدّدته:
     نمنع الزرّ من خطف التركيز، ونحفظ آخر تحديد داخل المحرِّر ونعيده قبل التنفيذ. */
  let last=null;
  const remember=()=>{
    const s=getSelection();
    if(!s||!s.rangeCount) return;
    const r=s.getRangeAt(0);
    if(rich.contains(r.commonAncestorContainer)) last=r.cloneRange();
  };
  rich.addEventListener('keyup',remember);
  rich.addEventListener('mouseup',remember);
  rich.addEventListener('touchend',remember);
  document.addEventListener('selectionchange',()=>{ if(document.activeElement===rich) remember(); });
  const restore=()=>{
    rich.focus({preventScroll:true});
    if(!last) return;
    try{ const s=getSelection(); s.removeAllRanges(); s.addRange(last); }catch(e){}
  };
  /* css=true للألوان فقط، وأمّا العريض وأخواته فوسومٌ صريحة تبقى بعد التنظيف */
  const run=(fn,css)=>{ restore();
    try{ document.execCommand('styleWithCSS',false,!!css); }catch(e){}
    try{ fn(); }catch(e){} remember(); if(onChange) onChange(); };

  const act=b=>{
    if(b.dataset.rthl!=null){ run(()=>document.execCommand('hiliteColor',false,b.dataset.rthl),true); return; }
    if(b.dataset.rtfg!=null){
      if(b.dataset.rtfg==='none'){
        /* «بلا لون»: نلوّن بعلامةٍ فارقة ثم ننزع اللون عنها فيعود الأصل */
        run(()=>document.execCommand('foreColor',false,'#010203'),true);
        rich.querySelectorAll('[style*="1, 2, 3"],[style*="#010203"],font[color="#010203"]').forEach(x=>{
          if(x.tagName==='FONT'){ x.removeAttribute('color'); return; }
          x.style.color='';
          if(!x.getAttribute('style')) x.replaceWith(...x.childNodes);
        });
        if(onChange) onChange();
        return;
      }
      run(()=>document.execCommand('foreColor',false,b.dataset.rtfg),true); return; }
    if(b.dataset.rtmore!=null){ remember();
      sheet(`<h3>ألوان أخرى</h3>
        <div class="field"><label>لون الحرف</label><input type="color" id="rcF" value="#0d6e5f"></div>
        <div class="field"><label>لون التظليل</label><input type="color" id="rcH" value="#ffe9a3"></div>
        <div class="sheetrow"><button class="btn pri" data-rcx="f">لوّن الحرف</button>
          <button class="btn" data-rcx="h">ظلّل</button>
          <button class="btn" onclick="closeSheet()">إغلاق</button></div>`, sh=>{
        sh.addEventListener('click',e2=>{
          const x=e2.target.closest('[data-rcx]'); if(!x) return;
          const c=sh.querySelector(x.dataset.rcx==='f'?'#rcF':'#rcH').value;
          closeSheet();
          run(()=>document.execCommand(x.dataset.rcx==='f'?'foreColor':'hiliteColor',false,c),true);
        });
      });
      return; }
    const k=b.dataset.rt; if(k==null) return;
    run(()=>{
      if(k==='h2') document.execCommand('formatBlock',false, /h2/i.test(document.queryCommandValue('formatBlock')||'')?'p':'h2');
      else if(k==='bigger'||k==='smaller'){
        /* الأساس ثلاثة: بعض المتصفّحات تُرجع رقمًا أصغر فتذهب الضغطة الأولى سدى */
        let cur=+(document.queryCommandValue('fontSize')||0);
        if(!cur||cur<3) cur=3;
        document.execCommand('fontSize',false,String(Math.max(1,Math.min(7,cur+(k==='bigger'?1:-1)))));
      }
      else document.execCommand(k);
    });
  };
  /* ننفّذ عند الضغط نفسه لا عند الإفلات:
     هذا وحده يضمن بقاء التركيز والتحديد في الهاتف، فبعض المتصفّحات
     لا ترسل «click» أصلًا إذا مُنع السلوك الافتراضي للمس. */
  const btnOf=t=>(t&&t.closest)?t.closest('[data-rt],[data-rthl],[data-rtfg],[data-rtmore]'):null;
  let acted=0;
  const down=ev=>{
    const b=btnOf(ev.target); if(!b) return;
    ev.preventDefault();
    acted=Date.now(); act(b);
  };
  if(window.PointerEvent) el.addEventListener('pointerdown',down,true);
  else{ el.addEventListener('mousedown',down,true);
        el.addEventListener('touchstart',down,{capture:true,passive:false}); }
  /* احتياطٌ لمتصفّحٍ لم يصله الضغط: ينفّذ من النقرة، ولا يكرّر ما نُفِّذ */
  el.addEventListener('click',ev=>{
    const b=btnOf(ev.target); if(!b) return;
    ev.preventDefault();
    if(Date.now()-acted<800) return;
    act(b);
  },true);
  rich.addEventListener('input',()=>{ remember(); if(onChange) onChange(); });
  rich.addEventListener('paste',e=>{ /* لصق نصًّا نظيفًا */
    const t=(e.clipboardData||window.clipboardData).getData('text/plain');
    if(t){ e.preventDefault(); document.execCommand('insertText',false,t); if(onChange) onChange(); }
  });
}
function openNote(ref){
  const [kind,a,b]=ref.split(':');
  let title='',value='',where='',save=null,del=null;
  if(kind==='item'){ const r=findItem(a); if(!r) return;
    title=r.it.name; value=notes[a]||''; where='#/i/'+a;
    save=v=>{ if(noteText(v)) notes[a]=v; else delete notes[a]; saveNotes(); };
    del =()=>{ delete notes[a]; saveNotes(); };
  } else if(kind==='hl'){ return openHl(a,b); }
  else return;
  sheet(`<h3>${esc(title)}</h3>
    ${rtoolsHTML()}
    <div class="rich" id="richBox" contenteditable="true" dir="rtl">${noteHtml(value)}</div>
    <div class="sheetrow"><button class="btn pri" data-n="save">${ICON.chk} حفظ</button>
      ${favBtn('n:'+a)}
      ${where?`<button class="btn gold" data-n="go">${ICON.ext} اذهب للموضع</button>`:''}
      <button class="btn" data-n="card">${ICON.card} بطاقة</button>
      <span style="flex:1"></span><button class="danger" data-n="del">حذف</button></div>`, el=>{
    const rich=el.querySelector('#richBox'); setTimeout(()=>rich.focus(),60);
    const commit=()=>save(clean(rich.innerHTML));
    bindRich(el,rich,null);
    el.addEventListener('click',ev=>{
      const n=ev.target.closest('[data-n]'); if(!n) return;
      const act=n.dataset.n;
      if(act==='save'){ commit(); closeSheet(); render(); }
      else if(act==='go'){ commit(); closeSheet(); location.hash=where; }
      else if(act==='card'){ commit(); const tx=noteText(clean(rich.innerHTML)); closeSheet(); cardFrom(tx,title); }
      else if(act==='del'){ del(); closeSheet(); render(); }
    });
  });
}

      if(n.dataset.n==='card'){ saveQuotes(); closeSheet(); cardFrom(noteText(q.t), q.src||''); return; }

}

const PALS=[
  {n:'بنّي', bg:'#4a4139', paper:'#b09a76', head:'#f6f1e6', gold:'#cbb387', body:'#fffdf8'},
  {n:'أزرق', bg:'#3c5477', paper:'#b39c77', head:'#f4f7fb', gold:'#d4bd91', body:'#ffffff'},
  {n:'رملي', bg:'#e8e4de', paper:'#b09a76', head:'#7c3f21', gold:'#93704a', body:'#ffffff'},
  {n:'أخضر', bg:'#2f4a41', paper:'#a8957a', head:'#f1f7f4', gold:'#cbb387', body:'#ffffff'},
  {n:'عنّابي', bg:'#4a2f36', paper:'#b09a76', head:'#fbeff0', gold:'#d0ae8a', body:'#fffdf8'},
  {n:'فحمي', bg:'#26292b', paper:'#9d8d74', head:'#f2f2f0', gold:'#c9b183', body:'#ffffff'}
];
function palOf(d){
  d=d||card; const p=Object.assign({},PALS[d.pal]||PALS[0]);
  if(d.bg){ p.bg=d.bg; const c=d.bg.replace('#','');
    const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    p.head = lum>0.62? '#5e3a22':'#f6f1e6'; p.gold = lum>0.62? '#93704a':'#cbb387'; }
  return p;
}
let fontsReady=null;
function ensureFonts(){

  try{ loadDesignerFonts(); }catch(e){}
  const want=['700 90px "Aref Ruqaa"','400 60px "Aref Ruqaa"','800 46px "Almarai"','700 40px "Almarai"'];
  fontsReady=(document.fonts?Promise.all(want.map(f=>document.fonts.load(f).catch(()=>{}))):Promise.resolve())
    .then(()=>document.fonts?document.fonts.ready.catch(()=>{}):null);

}
let noiseTile=null;
function noise(){
  if(noiseTile) return noiseTile;
  const c=document.createElement('canvas'); c.width=c.height=140;
  const x=c.getContext('2d'), img=x.createImageData(140,140);
  for(let i=0;i<img.data.length;i+=4){ const v=128+(Math.random()*36-18);
    img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=16; }
  x.putImageData(img,0,0); noiseTile=c; return c;
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }
function tornBox(ctx,x,y,w,h){
  ctx.beginPath(); ctx.moveTo(x,y+4); ctx.lineTo(x+w-3,y); ctx.lineTo(x+w,y+h-34);
  for(let i=0;i<=34;i++){ const t=i/34, nx=x+w-t*w;
    const wob=Math.sin(i*1.9+11)*9+Math.sin(i*0.7+22)*7+(i%3===0?5:0);
    ctx.lineTo(nx, y+h-26+wob); }
  ctx.lineTo(x,y+4); ctx.closePath();
}
function layoutText(ctx,text,maxW){
  const out=[];
  for(const para of String(text).split(/\n/)){
    const words=para.trim().split(/\s+/).filter(Boolean);
    if(!words.length){ out.push({w:[],last:true,blank:true}); continue; }
    let cur=[];
    for(const w of words){
      const t=cur.concat(w).join(' ');
      if(cur.length && ctx.measureText(t).width>maxW){ out.push({w:cur,last:false}); cur=[w]; }
      else cur.push(w);
    }
    out.push({w:cur,last:true});
  }
  return out;
}
function fitPlan(ctx,text,boxW,boxH,max,min,lhMul){
  for(let size=max;size>=min;size-=1){
    ctx.font=`800 ${size}px "Almarai","Tajawal",sans-serif`;
    const lines=layoutText(ctx,text,boxW), lh=size*lhMul;
    const widest=lines.reduce((m,l)=>Math.max(m,ctx.measureText(l.w.join(' ')).width),0);
    if(lines.length*lh<=boxH && widest<=boxW) return {size,lines,lh,over:false};
  }
  ctx.font=`800 ${min}px "Almarai","Tajawal",sans-serif`;
  return {size:min,lines:layoutText(ctx,text,boxW),lh:min*lhMul,over:true};
}
function geo(kind,W,H,pageOn,hasBrand,hasSub){
  if(kind==='long') return {kind,side:78,label:26,labelY:70,brandSize:70,brandY:158,subSize:29,subGap:50,ruleLen:84,
    paperTop:(hasBrand?196:140)+(hasSub?58:0)+30, paperBot:H-(pageOn?116:84), pad:46, max:92, min:18, lhMul:1.56, quote:60, smallPill:true};
  return {kind:'mid',side:108,label:32,labelY:100,brandSize:100,brandY:216,subSize:40,subGap:74,ruleLen:120,
    paperTop:(hasBrand?266:200)+(hasSub?74:0)+56, paperBot:H-(pageOn?210:130), pad:60, max:120, min:30, lhMul:1.62, quote:86, smallPill:false};
}
function shade(hex,amt){ const c=hex.replace('#','');
  let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
let lastFit={over:false,kind:'mid'};
function drawCard(cv,d){
  d=d||card;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height, p=palOf(d);
  const brand=(d.brand!=null?d.brand:site.name||'').trim();
  const sub=(d.sub||'').trim(), label=(d.label||'').trim();
  const pageOn=!!String(d.page||'').trim();
  const text=(d.text||'').trim()||'اكتب هنا اقتباسك أو فائدتك…';
  let kind=d.layout;
  if(kind!=='mid'&&kind!=='long'){
    const g0=geo('mid',W,H,pageOn,!!brand,!!sub);
    const probe=fitPlan(ctx,text,(W-g0.side*2)-g0.pad*2,(g0.paperBot-g0.paperTop)-290,54,36,g0.lhMul);
    kind=probe.over?'long':'mid';
  }
  const g=geo(kind,W,H,pageOn,!!brand,!!sub);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=p.bg; ctx.fillRect(0,0,W,H);
  let lg=ctx.createLinearGradient(W*0.75,0,W*0.1,H);
  lg.addColorStop(0,'rgba(255,255,255,.12)'); lg.addColorStop(.45,'rgba(255,255,255,.04)'); lg.addColorStop(1,'rgba(0,0,0,.10)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=.07; ctx.strokeStyle=p.head; ctx.lineWidth=2;
  for(const side of [0,1]){ const x0=side?W-70:18;
    for(let y=-40;y<H+40;y+=34){ ctx.beginPath(); ctx.moveTo(x0+26,y); ctx.lineTo(x0+52,y+17);
      ctx.lineTo(x0+26,y+34); ctx.lineTo(x0,y+17); ctx.closePath(); ctx.stroke(); } }
  ctx.restore();
  ctx.save(); ctx.globalAlpha=.5; ctx.fillStyle=ctx.createPattern(noise(),'repeat'); ctx.fillRect(0,0,W,H); ctx.restore();
  ctx.direction='rtl'; ctx.textBaseline='alphabetic';

  if(label){ ctx.save(); ctx.textAlign='center'; ctx.fillStyle=p.gold; ctx.globalAlpha=.94;
    try{ctx.letterSpacing='6px';}catch(e){}
    ctx.font=`800 ${g.label}px "Almarai","Tajawal",sans-serif`;
    ctx.fillText(label,W/2,g.labelY); try{ctx.letterSpacing='0px';}catch(e){} ctx.restore(); }
  let y=g.labelY;
  if(brand){ ctx.save(); ctx.textAlign='center'; ctx.fillStyle=p.head;
    ctx.shadowColor='rgba(0,0,0,.28)'; ctx.shadowBlur=20; ctx.shadowOffsetY=5;
    ctx.font=`700 ${g.brandSize}px "Aref Ruqaa","Amiri",serif`;
    ctx.fillText(brand,W/2,g.brandY); ctx.restore(); y=g.brandY; }
  if(sub){ const sy=y+g.subGap;
    ctx.save(); ctx.fillStyle=p.gold; ctx.textAlign='center';
    ctx.font=`800 ${g.subSize}px "Almarai","Tajawal",sans-serif`;
    const sw=ctx.measureText(sub).width; ctx.fillText(sub,W/2,sy);
    ctx.strokeStyle=p.gold; ctx.globalAlpha=.65; ctx.lineWidth=2.5;
    const ly=sy-12, gp=sw/2+32;
    ctx.beginPath(); ctx.moveTo(W/2+gp,ly); ctx.lineTo(W/2+gp+g.ruleLen,ly); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2-gp,ly); ctx.lineTo(W/2-gp-g.ruleLen,ly); ctx.stroke(); ctx.restore(); }

  const px=g.side, pw=W-px*2, pTop=g.paperTop, ph=g.paperBot-pTop;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=30; ctx.shadowOffsetY=14;
  tornBox(ctx,px,pTop,pw,ph);
  const pg=ctx.createLinearGradient(px,pTop,px+pw,pTop+ph);
  pg.addColorStop(0,p.paper); pg.addColorStop(.55,shade(p.paper,10)); pg.addColorStop(1,shade(p.paper,-14));
  ctx.fillStyle=pg; ctx.fill(); ctx.restore();
  ctx.save(); ctx.fillStyle=shade(p.paper,-42); ctx.globalAlpha=.9;
  ctx.font=`700 ${g.quote}px "Almarai","Tajawal",sans-serif`;
  ctx.textAlign='right'; ctx.fillText('❞',px+pw-40,pTop+g.quote+22);
  ctx.textAlign='left'; ctx.fillText('❝',px+40,pTop+ph-(kind==='long'?58:88)); ctx.restore();

  const topPad=g.quote+(kind==='long'?34:40), botPad=g.quote+(kind==='long'?28:34);
  const boxX=px+g.pad, boxW=pw-g.pad*2, boxTop=pTop+topPad, boxBot=pTop+ph-botPad;
  const fit=fitPlan(ctx,text,boxW,boxBot-boxTop,g.max,g.min,g.lhMul);
  lastFit={over:fit.over,kind};
  if(!fit.over && fit.lines.length>1){
    const grown=Math.min((boxBot-boxTop)/fit.lines.length, fit.size*2.45);
    if(grown>fit.lh) fit.lh=grown;
  }
  ctx.save(); ctx.font=`800 ${fit.size}px "Almarai","Tajawal",sans-serif`;
  ctx.fillStyle=p.body; ctx.textAlign='right'; ctx.direction='rtl';
  ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  let ty=boxTop+Math.max(0,((boxBot-boxTop)-fit.lines.length*fit.lh)/2)+fit.size;
  const spaceW=ctx.measureText(' ').width;
  for(const ln of fit.lines){
    if(ln.blank){ ty+=fit.lh*0.6; continue; }
    const wsum=ln.w.reduce((a,w)=>a+ctx.measureText(w).width,0);
    const justify=!ln.last&&ln.w.length>1&&fit.lines.length>1;
    const gap=justify?(boxW-wsum)/(ln.w.length-1):spaceW;
    let cx=boxX+boxW;
    if(!justify&&fit.lines.length<=2){ const lw=wsum+spaceW*(ln.w.length-1); cx=boxX+boxW-Math.max(0,(boxW-lw)/2); }

  if(pageOn){
    const label2='صـ ( '+AR(String(d.page).trim())+' )';
    ctx.save(); ctx.textAlign='center';
    if(g.smallPill){ ctx.font='700 32px "Almarai","Tajawal",sans-serif'; ctx.fillStyle=p.head; ctx.globalAlpha=.9;
      ctx.fillText(label2,W/2,H-44); }
    else { ctx.font='700 38px "Almarai","Tajawal",sans-serif';
      const tw=ctx.measureText(label2).width, bw=tw+130, bh=82, bx=(W-bw)/2, by=H-150;
      ctx.strokeStyle=p.head; ctx.globalAlpha=.75; ctx.lineWidth=2.5; roundRect(ctx,bx,by,bw,bh,41); ctx.stroke();
      ctx.globalAlpha=1; ctx.fillStyle=p.head; ctx.fillText(label2,W/2,by+55); }
    ctx.restore();
  }
}

/* قارئ PDF يُحمَّل متأخّرًا حتى لا يعطّل فتح الموقع */
function pdfReady(){ return new Promise(r=>{
  if(window.pdfjsLib) return r();
  const s=document.getElementById('pdfjs'); if(!s) return r();
  s.addEventListener('load',()=>r(),{once:true}); s.addEventListener('error',()=>r(),{once:true});
  setTimeout(r,8000); }); }
async function mountPdf(box){
  clearCorner();
  const r=findItem(box.dataset.item); if(!r) return;
  const it=r.it;
  let blob=null;
  try{ blob=await getFile(it.file); }catch(e){}
  if(!blob){
    box.outerHTML = fileProblem(it, 'لم أجد الملف في تخزين هذا المتصفح. قد يكون رُفع من جهاز أو متصفح آخر، أو مُسحت بيانات الموقع. أعد رفعه ليعمل هنا.');
    return;
  }
  if(!window.pdfjsLib) await pdfReady();
  if(!window.pdfjsLib){
    const u=await fileURL(it.file);
    box.outerHTML=`<iframe class="viewer" src="${u}"></iframe>`; return;
  }
  try{
    if(window.PDF_WORKER_SRC) pdfjsLib.GlobalWorkerOptions.workerSrc=window.PDF_WORKER_SRC;
    else pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
    const buf=await blob.arrayBuffer();                 // read the bytes directly — no network request
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    box.__pdf=pdf; box.__v1=(await pdf.getPage(1)).getViewport({scale:1});
    layoutPdf(box,{restore:true}); trackPdf(box);
  }catch(e){
    const msg=(e&&(e.message||e.name))||'';
    const u=await fileURL(it.file);
    box.outerHTML=`<iframe class="viewer" src="${u}"></iframe>`+
      fileProblem(it, 'تعذّر فتح الملف بقارئ الموقع ('+esc(msg).slice(0,80)+') — جرّبت عرضه بقارئ المتصفح أعلاه.');
  }

function pageAtTop(box){ let best=1;
  for(const h of box.querySelectorAll('.pg')){ if(h.offsetTop<=box.scrollTop+40) best=+h.dataset.p; else break; }
  return best; }
function showPg(box){

/* القفز إلى صفحة بعينها: الصفحات تُرسم عند الحاجة، فارتفاعاتها تتغيّر تحتك
   أثناء القفز — فنعيد تثبيت الموضع حتى يستقرّ، فتصل إلى صفحتك لا إلى جارتها */
let _gotoT=null;
function gotoPage(box,p,quiet){
  if(!box||!box.__pdf) return;
  p=Math.max(1,Math.min(box.__pdf.numPages,Math.round(p)||1));
  const h=box.querySelector(`.pg[data-p="${p}"]`);
  if(!h){ /* الصفحات لم تُبنَ بعد — ننتظرها قليلًا ثم نعاود */
    if((quiet|0)<20){ setTimeout(()=>gotoPage(box,p,(quiet|0)+1),120); }
    return; }
  box.__want=p;
  box.scrollTo({top:Math.max(0,h.offsetTop-6),behavior:"smooth"});
  clearTimeout(_gotoT);
  let n=0;
  const pin=()=>{
    if(!box.isConnected||box.__want!==p) return;
    const el=box.querySelector(`.pg[data-p="${p}"]`);
    if(el){
      const want=Math.max(0,el.offsetTop-6);
      if(Math.abs(box.scrollTop-want)>2) box.scrollTop=want;
    }
    if(++n<16) _gotoT=setTimeout(pin,110);
    else { box.__want=null; showPg(box); }
  };
  _gotoT=setTimeout(pin, 340);
  setTimeout(()=>showPg(box),450);
}
function trackPdf(box){

  let rz=null;
  const onResize=()=>{
    const p=pageAtTop(box), h=box.querySelector(`.pg[data-p="${p}"]`);
    const off=h?(box.scrollTop-h.offsetTop)/Math.max(1,h.offsetHeight):0;
    clearTimeout(rz);
    rz=setTimeout(()=>{
      const h2=box.querySelector(`.pg[data-p="${p}"]`);
      if(h2&&box.isConnected) box.scrollTop=Math.max(0,h2.offsetTop+off*h2.offsetHeight);
      showPg(box);
    },260);
  };
  addEventListener('resize',onResize);
  if(window.visualViewport) visualViewport.addEventListener('resize',onResize);
  box.addEventListener('scroll',()=>{ showPg(box); clearTimeout(t); t=setTimeout(()=>{
    const pg=pageAtTop(box), h=box.querySelector(`.pg[data-p="${pg}"]`);
    const off=h?(box.scrollTop-h.offsetTop)/Math.max(1,h.offsetHeight):0;
    if(pg>1||box.scrollTop>40){ const old=ppos[id]||{};
      ppos[id]={p:pg,o:Math.max(0,Math.min(1,off)),
        n:(box.__pdf?box.__pdf.numPages:old.n)||old.n||0,
        max:Math.max(old.max||0,pg)};
    } else delete ppos[id];
    S.set('ppos',ppos); },400); },{passive:true});
}
/* كتابة الموضع في الحال — لا بعد ثمانِ مئة جزء من الثانية */
function savePdfNow(box){
  try{
    if(!box||!box.__pdf) return;
    const id=box.dataset.item, pg=pageAtTop(box);
    const h=box.querySelector(`.pg[data-p="${pg}"]`);
    const off=h? (box.scrollTop-h.offsetTop)/Math.max(1,h.offsetHeight) : 0;
    const old=ppos[id]||{};
    ppos[id]={p:pg,o:Math.max(0,Math.min(1,off)),n:box.__pdf.numPages||old.n||0,
      max:Math.max(old.max||0,pg)};
    S.set('ppos',ppos);
  }catch(e){}
}
function restorePdf(box){
  const sv=ppos[box.dataset.item]; if(!sv||sv.p<1) return;
  const h=box.querySelector(`.pg[data-p="${sv.p}"]`); if(!h) return;
  box.scrollTop=Math.max(0,h.offsetTop+(sv.o||0)*h.offsetHeight-8);

    tip.textContent='تابعت من صفحة '+AR(sv.p); box.prepend(tip);
    setTimeout(()=>tip.classList.add('fade'),2600); setTimeout(()=>tip.remove(),3300); }
}
function layoutPdf(box,opt){
  opt=opt||{}; const pdf=box.__pdf, v1=box.__v1; if(!pdf||!v1) return;
  if(box.__io){ try{box.__io.disconnect();}catch(e){} }
  if(box.__tasks) box.__tasks.forEach(t=>{try{t.cancel();}catch(e){}});
  box.__tasks=new Set();
  const keep=opt.keep?pageAtTop(box):0;
  box.innerHTML='';
  const io=new IntersectionObserver(async ents=>{
    for(const en of ents){
      if(!en.isIntersecting) continue;
      const h=en.target; io.unobserve(h);
      if(h.dataset.rendered) continue; h.dataset.rendered='1';
      try{
        const page=await pdf.getPage(+h.dataset.p);
        if(!h.isConnected||box.__io!==io) return;
        const cw=h.clientWidth||box.clientWidth||600;
        const base=page.getViewport({scale:1});
        const dpr=Math.min(devicePixelRatio||1,2);
        const vp=page.getViewport({scale:(cw/base.width)*dpr});
        const cv=document.createElement('canvas');
        cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
        h.innerHTML=''; h.style.aspectRatio=base.width+' / '+base.height; h.appendChild(cv);
        const task=page.render({canvasContext:cv.getContext('2d'),viewport:vp});
        box.__tasks.add(task); await task.promise; box.__tasks.delete(task);
        if(!h.isConnected||box.__io!==io) return;
        const layer=document.createElement('div');
        layer.className='hlayer'+(drawOn?' draw':''); layer.dataset.p=h.dataset.p;
        h.appendChild(layer); bindLayer(layer,box.dataset.item,+h.dataset.p);
        paintRects(layer,box.dataset.item,+h.dataset.p);
      }catch(e){}
    }
  },{root:box,rootMargin:'900px 0px'});
  box.__io=io;
  for(let i=1;i<=pdf.numPages;i++){
    const h=document.createElement('div'); h.className='pg'; h.dataset.p=i;
    h.style.aspectRatio=v1.width+' / '+v1.height; box.appendChild(h); io.observe(h);
  }
  const foot=document.createElement('div'); foot.className='pdfmsg';
  foot.textContent='عدد الصفحات: '+AR(pdf.numPages); box.appendChild(foot);
  if(keep>1){ const t=box.querySelector(`.pg[data-p="${keep}"]`); if(t) box.scrollTop=Math.max(0,t.offsetTop-10); }
  else if(opt.restore) restorePdf(box);
}

function seekTo(t){
  if(!au.duration||!isFinite(au.duration)){ wanted=t;
    au.addEventListener('loadedmetadata',()=>{ if(wanted){const v=wanted; wanted=0; seekTo(v);} },{once:true}); return; }
  const v=Math.max(0,Math.min(t,au.duration-0.3));
  try{ if(au.fastSeek) au.fastSeek(v); else au.currentTime=v; }catch(e){ try{au.currentTime=v;}catch(_){} }

}
async function play(id, startAt){

function artwork(name){

    try{
      const c=document.createElement('canvas'); c.width=c.height=384; const x=c.getContext('2d');

      x.fillStyle=g; x.fillRect(0,0,384,384);

const PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),

  u=>'https://api.cors.lol/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u),
  u=>'https://whateverorigin.org/get?url='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
  u=>'https://cors-anywhere.herokuapp.com/'+u,

];
/* وسيطك أنت أوّلًا، ثم وسيط الاستضافة نفسها إن وُجد، ثم الوسطاء العامّون */
function proxyList(){
  const custom = (site.proxy||'').trim();
  const list = custom? [u=>custom.replace('{url}', encodeURIComponent(u))] : [];
  try{
    if(/^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|usercontent|artifact/i.test(location.hostname)
       && !/\.github\.io$/i.test(location.hostname)){   /* github لا تشغّل وسيطًا */
      /* وسيط مساحتي على الاستضافة نفسها (Hostinger: api/tg.php) — الأسرع والأوثق */
      const base=location.pathname.replace(/[^/]*$/,'');
      list.push(u=>base+'api/tg.php?url='+encodeURIComponent(u));
      list.push(u=>base+'api/tg?url='+encodeURIComponent(u));
      list.push(u=>'/.netlify/functions/tg?url='+encodeURIComponent(u));
    }
  }catch(e){}
  return list.concat(PROXIES);
}
/* بعض الوسطاء يغلّفون الصفحة داخل JSON */
function unwrapBody(t){
  if(typeof t!=='string') return t;
  const s=t.trim();
  if(s[0]==='{'){ try{ const j=JSON.parse(s);
    const v=j.contents||j.data||j.body||j.html||j.content; if(typeof v==='string') return v;
  }catch(e){} }
  return t;
}
let lastGrabLog=[];
async function grab(url, asText, ms){
  let lastErr=null; lastGrabLog=[];
  for(const mk of proxyList()){
    const target=mk(url);
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(), ms||14000);
    try{
      const res = await fetch(target, {redirect:'follow', signal:ctl.signal});
      clearTimeout(to);
      if(!res.ok) throw new Error('HTTP '+res.status);
      let out = asText? await res.text() : await res.blob();
      if(asText) out=unwrapBody(out);
      if(asText && (!out || out.length<200)) throw new Error('رد فارغ');
      lastGrabLog.push('✓ '+host(target));
      return out;
    }catch(e){ clearTimeout(to); lastErr=e;
      lastGrabLog.push('✗ '+host(target)+' — '+(e.name==='AbortError'?'انتهت المهلة':(e.message||'خطأ'))); }
  }
  throw lastErr||new Error('fail');
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u.slice(0,24); } }
/* كل الوسطاء دفعة واحدة، ونأخذ أوّل من يردّ — أسرع بكثير من التجريب واحدًا واحدًا */
function anyOf(list){
  if(Promise.any) return Promise.any(list);
  return new Promise((res,rej)=>{ let n=list.length, e=null;
    list.forEach(p=>p.then(res).catch(x=>{ e=x; if(!--n) rej(e); })); });
}
async function grabAny(url, ms){
  lastGrabLog=[];
  const tries=proxyList().map(mk=>{
    const target=mk(url), ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(), ms||9000);
    return fetch(target,{redirect:'follow',signal:ctl.signal}).then(async res=>{
      clearTimeout(to);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const t=unwrapBody(await res.text());
      if(!t||t.length<200) throw new Error('رد فارغ');
      /* بعض الوسطاء يردّون صفحة خطأ برمز ٢٠٠، وبعض الاستضافات تردّ صفحة الموقع نفسه.
         فلا نقبل الردّ إلا إذا كان صفحة تيليجرام حقًّا — وإلا سبق الوسيط الفاسد الصحيحَ. */
      if(/(^|\/\/)(t|telegram)\.me\//i.test(url) && !/class=["'][^"']*tgme_/i.test(t))
        throw new Error('ليست صفحة تيليجرام');
      lastGrabLog.push('✓ '+host(target));
      return t;
    }).catch(e=>{ clearTimeout(to);
      lastGrabLog.push('✗ '+host(target)+' — '+(e.name==='AbortError'?'انتهت المهلة':(e.message||'خطأ')));
      throw e; });
  });
  return anyOf(tries);
}
function parseTg(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const out={};
  const txt=doc.querySelector('.tgme_widget_message_text');
  if(txt) out.text=(txt.innerText||txt.textContent||'').trim();
  const au=doc.querySelector('audio[src], .tgme_widget_message_voice, .tgme_widget_message_audio');
  const aSrc=doc.querySelector('audio[src]');
  if(aSrc) out.audio=aSrc.getAttribute('src');
  if(!out.audio){
    const v=doc.querySelector('.tgme_widget_message_voice');
    if(v && v.getAttribute('data-src')) out.audio=v.getAttribute('data-src');
  }
  const vid=doc.querySelector('video[src], video source[src]');
  if(vid) out.video=vid.getAttribute('src');
  const docWrap=doc.querySelector('.tgme_widget_message_document_wrap, a.tgme_widget_message_document_wrap');
  if(docWrap && docWrap.getAttribute('href')) out.doc=docWrap.getAttribute('href');
  const dl=doc.querySelector('a[href*="telesco.pe/file"], a[href*="telegram-cdn"]');
  if(!out.doc && dl) out.doc=dl.getAttribute('href');
  const dn=doc.querySelector('.tgme_widget_message_document_title, .tgme_widget_message_audio_title');
  if(dn) out.title=(dn.textContent||'').trim();
  const dur=doc.querySelector('.tgme_widget_message_audio_duration, time.time');
  if(dur) out.durTxt=(dur.textContent||'').trim();
  const ph=doc.querySelector('.tgme_widget_message_photo_wrap');
  if(ph){ const st=ph.getAttribute('style')||''; const m=/url\('([^']+)'\)/.exec(st); if(m) out.photo=m[1]; }
  const og=doc.querySelector('meta[property="og:title"]');
  if(!out.title && og) out.title=(og.getAttribute('content')||'').trim();
  return out;
}
function durToSec(t){
  if(!t) return 0;
  const p=String(t).split(':').map(x=>parseInt(x,10)||0);
  return p.length===3? p[0]*3600+p[1]*60+p[2] : p.length===2? p[0]*60+p[1] : p[0];
}
async function tgImport(url, target, statusEl){

  const info=parseTg(html);

  const baseName=(info.title||(info.text||'').split('\n')[0]||('منشور '+ref.id)).slice(0,80);
  let added=0;
  if(info.audio||info.video){
    const remote=info.audio||info.video;
    const it={id:uid('i'), type: info.audio?'audio':'video', name:baseName, url:remote, src:url,
      dur:durToSec(info.durTxt), remote:true, ts:Date.now()};
    say('وجدت ملفًا صوتيًا/مرئيًا — أحاول تنزيله للتشغيل دون إنترنت…');

        it.file=key; it.size=blob.size; it.mime=blob.type; it.remote=false;

    try{
      const blob=await grab(info.doc,false);
      if(blob && blob.size>500){
        const key=uid('f'); await putFile(key,blob);
        const isPdf = blob.type==='application/pdf' || /\.pdf($|\?)/i.test(info.doc) || /pdf/i.test(baseName);
        it.type = isPdf? 'pdf' : (blob.type.startsWith('audio')?'audio': blob.type.startsWith('video')?'video':
                  blob.type.startsWith('image')?'img':'link');
        it.file=key; it.size=blob.size; it.mime=blob.type;
      }
    }catch(e){}
    list.push(it); added++;
  }
  if(!added && info.photo){
    const it={id:uid('i'), type:'img', name:baseName, url:info.photo, src:url, remote:true, ts:Date.now()};
    try{ const blob=await grab(info.photo,false);
      if(blob&&blob.size>500){ const key=uid('f'); await putFile(key,blob); it.file=key; it.size=blob.size; it.remote=false; }
    }catch(e){}
    list.push(it); added++;
  }
  if(info.text && info.text.length>40){
    list.push({id:uid('i'), type:'text', name:(added?baseName+' — النص':baseName), text:info.text, src:url, ts:Date.now()});
    added++;
  }
  if(!added){
    list.push({id:uid('i'), type:'telegram', name:baseName, url, ts:Date.now()});
    added++;
  }
  saveTree();
  return added;
}

function mediaDur(file,kind){
  return new Promise(res=>{
    const el=document.createElement(kind==='audio'?'audio':'video');
    const u=URL.createObjectURL(file);
    el.preload='metadata';
    el.onloadedmetadata=()=>{ res(isFinite(el.duration)?Math.round(el.duration):0); URL.revokeObjectURL(u); };
    el.onerror=()=>{ res(0); URL.revokeObjectURL(u); };
    el.src=u;
    setTimeout(()=>res(0), 4000);
  });
}

const D2R=Math.PI/180, R2D=180/Math.PI;
const sinD=d=>Math.sin(d*D2R), cosD=d=>Math.cos(d*D2R), tanD=d=>Math.tan(d*D2R);
const asinD=x=>R2D*Math.asin(x), acosD=x=>R2D*Math.acos(x);
const atan2D=(y,x)=>R2D*Math.atan2(y,x), acotD=x=>R2D*Math.atan(1/x);
const fixh=h=>((h%24)+24)%24;
function julianDay(y,m,d){ if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  const D=jd-2451545.0;
  const g=((357.529+0.98560028*D)%360+360)%360;
  const q=((280.459+0.98564736*D)%360+360)%360;
  const L=((q+1.915*sinD(g)+0.020*sinD(2*g))%360+360)%360;
  const e=23.439-0.00000036*D;
  const dec=asinD(sinD(e)*sinD(L));
  const RA=fixh(atan2D(cosD(e)*sinD(L),cosD(L))/15);
  let eqt=q/15-RA; eqt=((eqt+12+24)%24)-12;
  return {dec,eqt};
}
function midDay(jd,h){ return fixh(12-sunPos(jd+h/24).eqt); }
function angleTime(jd,h,ang,lat,ccw){
  const dec=sunPos(jd+h/24).dec;
  const x=(-sinD(ang)-sinD(dec)*sinD(lat))/(cosD(dec)*cosD(lat));
  if(x<-1||x>1) return null;            /* لا يحدث في هذا العرض (مناطق قطبية) */
  const v=acosD(x)/15;
  return midDay(jd,h)+(ccw?-v:v);
}
function asrTime(jd,h,lat){
  const dec=sunPos(jd+h/24).dec;
  return angleTime(jd,h,-acotD(1+tanD(Math.abs(lat-dec))),lat,false);
}
function calcPray(date,lat,lng,method){
  const jd=julianDay(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const M=PMETH[method]||PMETH.MWL;
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:19};
  for(let i=0;i<3;i++){
    const n={};
    n.fajr   =angleTime(jd,t.fajr,M.f,lat,true);
    n.sunrise=angleTime(jd,t.sunrise,0.833,lat,true);
    n.dhuhr  =midDay(jd,t.dhuhr)+1/60;
    n.asr    =asrTime(jd,t.asr,lat);
    n.maghrib=angleTime(jd,t.maghrib,0.833,lat,false);
    n.isha   =(typeof M.i==='number')? angleTime(jd,t.isha,M.i,lat,false)
             : (n.maghrib!=null? n.maghrib+(+M.i)/60 : null);
    for(const k in n) if(n[k]!=null) t[k]=n[k];
  }
  const tz=-date.getTimezoneOffset()/60;
  const out={};
  for(const k in t) out[k]=Math.round((fixh(t[k]+tz-lng/15))*60);
  return out;
}
const PRAY=[['fajr','الفجر'],['sunrise','الشروق'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
const PNAME=Object.fromEntries(PRAY);
let prayCache={};
function prayTimes(date){
  date=date||new Date();
  const key=ymd(date)+'|'+plan.pray.use+'|'+plan.pray.method+'|'+JSON.stringify(plan.loc)+JSON.stringify(plan.pray.manual)+JSON.stringify(plan.pray.adj);
  if(prayCache.k===key) return prayCache.v;
  let m=null;
  if(plan.pray.use==='manual'){
    m={}; let any=false;
    PRAY.forEach(([k])=>{ const v=hm2m(plan.pray.manual[k]); if(v!=null){ m[k]=v; any=true; } });
    if(!any) m=null;
  } else if(plan.loc && isFinite(plan.loc.lat)){
    try{ m=calcPray(date,+plan.loc.lat,+plan.loc.lng,plan.pray.method); }catch(e){ m=null; }
  }
  if(m) PRAY.forEach(([k])=>{ const a=+plan.pray.adj[k]||0; if(m[k]!=null) m[k]+=a; });
  prayCache={k:key,v:m};
  return m;
}
function nextPray(){
  const m=prayTimes(); if(!m) return null;
  const n=nowMin();
  let best=null;
  PRAY.forEach(([k,name])=>{ if(k==='sunrise') return;
    if(m[k]!=null&&m[k]>n&&(!best||m[k]<best.m)) best={k,name,m:m[k]}; });
  if(!best){ const f=m.fajr; if(f!=null) best={k:'fajr',name:'الفجر',m:f+1440}; }
  return best;
}

function taskSpan(t,date,pt){
  let s=null;
  if(!t.when) return null;
  if(t.when.k==='free') return {s:null,e:null};
  if(t.when.k==='clock') s=hm2m(t.when.t);
  else { const b=pt&&pt[t.when.p]; if(b==null) return null;
    s=b+(t.when.rel==='before'? -(+t.when.off||0) : (+t.when.off||0)); }
  if(s==null) return null;
  return {s, e:s+(+t.dur||0)};
}
function occursOn(t,date){
  const r=t.rep||{k:'daily'};
  if(r.k==='daily') return true;
  if(r.k==='week')  return (r.days||[]).includes(date.getDay());
  if(r.k==='month') return (r.dates||[]).includes(date.getDate());
  if(r.k==='once')  return r.date===ymd(date);
  return false;
}
function dayTasks(date){
  date=date||new Date();
  const pt=prayTimes(date);
  return plan.tasks.filter(t=>occursOn(t,date))
    .map(t=>{ const sp=taskSpan(t,date,pt); return sp?{t,s:sp.s,e:sp.e}:{t,s:null,e:null}; })
    .sort((a,b)=>(a.s==null?99999:a.s)-(b.s==null?99999:b.s));
}
const isDone=(id,date)=>!!(plan.done[ymd(date||new Date())]||{})[id];
function setTaskDone(id,v,date){
  const k=ymd(date||new Date());
  plan.done[k]=plan.done[k]||{};
  if(v) plan.done[k][id]=true; else delete plan.done[k][id];
  savePlan();
}
function nowNext(){
  const list=dayTasks(new Date()).filter(x=>x.s!=null);
  const n=nowMin();
  const cur=list.find(x=>n>=x.s&&n<x.e&&!isDone(x.t.id));
  const nxt=list.find(x=>x.s>n&&!isDone(x.t.id));
  const left=list.filter(x=>!isDone(x.t.id)).length;
  return {cur,nxt,left,total:list.length};
}
function planPill(){
  const {cur,nxt,left}=nowNext();
  if(cur) return {t:'الآن: '+cur.t.title, sub:'حتى '+clock(cur.e), on:true};
  if(nxt) return {t:'التالي: '+nxt.t.title, sub:clock(nxt.s), on:false};
  const {total}=nowNext();
  if(total) return {t:'أنجزت مهام اليوم ✓', sub:'', on:false};
  if(plan.tasks.length) return {t:'لا مهام اليوم', sub:'جدولك', on:false};
  return {t:'رتّب يومك', sub:'ابدأ جدولك', on:false};
}

plan.fired=plan.fired||{};
let audioCtx=null;
function beep(n){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=audioCtx.currentTime;
    for(let i=0;i<(n||3);i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=i%2?880:660;
      g.gain.setValueAtTime(0.0001,t0+i*0.45);
      g.gain.exponentialRampToValueAtTime(0.25,t0+i*0.45+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.45+0.34);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0+i*0.45); o.stop(t0+i*0.45+0.4);
    }
  }catch(e){}
}
function alarmBox(x){
  let e=document.getElementById('alarm');
  if(!e){ e=document.createElement('div'); e.id='alarm'; e.className='alarm'; document.body.appendChild(e); }
  e.innerHTML=`<div class="abody">

      <button class="btn" data-al="close">إغلاق</button></div></div>`;
  e.classList.add('on');
  beep(3);

let snoozed={};
function checkAlarms(){
  const d=new Date(), k=ymd(d), n=nowMin();
  plan.fired[k]=plan.fired[k]||{};
  dayTasks(d).forEach(x=>{
    if(x.s==null||!x.t.alert) return;
    if(isDone(x.t.id,d)) return;
    const at=x.s-(+x.t.alertBefore||0);
    const sn=snoozed[x.t.id];
    const target=sn!=null? sn : at;
    if(n>=target&&n<target+2&&!plan.fired[k][x.t.id+':'+target]){
      plan.fired[k][x.t.id+':'+target]=1; savePlan();
      if(sn!=null) delete snoozed[x.t.id];
      alarmBox(x);
    }
  });
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-al]'); if(!b) return;
  const e=document.getElementById('alarm'); if(e) e.classList.remove('on');
  if(b.dataset.al==='done'){ setTaskDone(b.dataset.id,true,new Date()); planFab(); if(location.hash.startsWith('#/plan')) render(); }
  else if(b.dataset.al==='snooze'){ snoozed[b.dataset.id]=nowMin()+10; toast('سأنبّهك بعد عشر دقائق'); }
});

let hintTimer=null, hintHideT=null, hintKind=0;
function hintEl(){
  let e=document.getElementById('nowhint');
  if(!e){ e=document.createElement('div'); e.id='nowhint'; e.className='nowhint';
    e.addEventListener('click',()=>hideHint(true)); document.body.appendChild(e); }
  return e;
}
function hideHint(byUser){
  const e=document.getElementById('nowhint'); if(e) e.classList.remove('on');
  clearTimeout(hintHideT);
  if(byUser) S.set('hintOff', Date.now()+1000*60*30);
}
function showHint(html,cls,ms){
  if(!plan.hint.on) return;
  if(typeof uiOn==='function'&&!uiOn('hint')) return;
  if(Date.now() < (S.get('hintOff',0)||0)) return;
  if(document.querySelector('.sheet')) return;
  const e=hintEl();
  e.className='nowhint '+(cls||'');
  e.innerHTML=html+'<i class="x">×</i>';
  requestAnimationFrame(()=>e.classList.add('on'));
  clearTimeout(hintHideT);
  hintHideT=setTimeout(()=>e.classList.remove('on'), ms||(+plan.hint.secs||3)*1000);
}
/* ذكر يمرّ سريعًا */
const AZKAR=['سبحان الله','الحمد لله','الله أكبر','لا إله إلا الله','لا حول ولا قوة إلا بالله',
  'اللّهمّ صلِّ وسلّم على نبيّنا محمّد','أستغفر الله وأتوب إليه','سبحان الله وبحمده',
  'لا إله إلا أنت سبحانك إني كنت من الظالمين','اللّهمّ أعنّي على ذكرك وشكرك وحسن عبادتك',
  'رب اشرح لي صدري ويسّر لي أمري','حسبنا الله ونعم الوكيل'];
let zIdx=Math.floor(Math.random()*AZKAR.length);
function zikrHint(){
  if(plan.hint.zikr===false) return;
  zIdx=(zIdx+1)%AZKAR.length;
  showHint(`<b>ذِكر</b><span>${esc(AZKAR[zIdx])}</span>`,'muse');
}
/* نداء الصلاة عند دخول وقتها */
function prayWatch(){
  try{
    if(plan.hint.pray===false) return;
    const m=prayTimes(new Date()); if(!m) return;
    const n=nowMin(), k=ymd(new Date());
    const seen=S.get('praySeen',{});
    PRAY.forEach(([key,name])=>{ if(key==='sunrise') return;
      const t=m[key]; if(t==null) return;
      const id=k+':'+key;
      if(n>=t && n<t+3 && !seen[id]){
        seen[id]=1; S.set('praySeen',seen);
        showHint(`<b>الصلاة</b><span>حان وقت صلاة ${esc(name)}</span><small>${clock(t)}</small>`,'task',6000);
        try{ beep(); }catch(e){}
      }
    });
  }catch(e){}
}
function taskHint(){
  const {cur,nxt,left}=nowNext();
  if(cur) return `<b>الآن</b><span>${esc(cur.t.title)}</span><small>حتى ${clock(cur.e)}</small>`;
  if(nxt){
    const before=+plan.hint.before||10;
    const d=nxt.s-nowMin();
    if(d<=before) return `<b>بعد ${AR(Math.max(1,Math.round(d)))} دقيقة</b><span>${esc(nxt.t.title)}</span><small>${clock(nxt.s)}</small>`;
    return null;                      /* لا نزعجك قبل وقته */
  }
  if(left) return `<b>اليوم</b><span>بقي ${AR(left)} من مهامك</span>`;
  return null;
}
function museHint(){
  const pool=[];
  /* ما اخترتَه ليمرّ عليك أوّلًا */
  const picked=quotes.filter(q=>q.hint);
  if(picked.length){ const x=picked[Math.floor(Math.random()*picked.length)];
    return `<b>${esc(x.src||'اقتباسك')}</b><span>${esc(noteText(x.t).slice(0,120))}</span>`; }
  plan.goals.forEach(g=>pool.push({b:'هدفك',t:g.title}));
  quotes.slice(0,40).forEach(q=>pool.push({b:'اقتباسك',t:noteText(q.t).slice(0,120)}));
  Object.keys(notes).slice(0,40).forEach(k=>{ const t=noteText(notes[k]); if(t) pool.push({b:'فائدتك',t:t.slice(0,120)}); });
  plan.prios.forEach(p=>pool.push({b:'أولويتك',t:p.t}));
  if(!pool.length) return null;
  const x=pool[Math.floor(Math.random()*pool.length)];
  return `<b>${x.b}</b><span>${esc(x.t)}</span>`;
}
function hintTick(){
  /* الذكر هو الأصل، والمهمّة تقطعه إن حان وقتها */
  const t=taskHint();
  if(t){ showHint(t,'task'); return; }
  if(hintKind++%3===2){ const m=museHint(); if(m){ showHint(m,'muse'); return; } }
  zikrHint();
}
let minTimer=null;
function startHints(){
  clearInterval(hintTimer); clearInterval(minTimer);
  const e=document.getElementById('nowhint'); if(e) e.classList.remove('on');
  if(!plan.hint.on) return;
  if(typeof uiOn==='function'&&!uiOn('hint')) return;
  setTimeout(()=>{ const h=taskHint(); if(h) showHint(h,'task'); }, 5000);
  /* إن كان تنبيه الصلاة مفتوحًا ولا موقع — ذكّره مرّة واحدة */
  setTimeout(()=>{ try{
    if(plan.hint.pray===false) return;
    if(prayTimes(new Date())) return;
    if(S.get('prayAsk',false)) return;
    S.set('prayAsk',true);
    showHint('<b>أوقات الصلاة</b><span>اختر مدينتك ليُنبّهك الموقع بدخول الوقت</span><small>الجدول ← أوقات الصلاة</small>','task',8000);
  }catch(e){} }, 9000);
  hintTimer=setInterval(hintTick, Math.max(1,+plan.hint.every||10)*60000);
  minTimer=setInterval(()=>{ try{ prayWatch(); const t=taskHint(); if(t) showHint(t,'task'); }catch(e){} }, 60000);
}

/* ---------- الزر العائم ---------- */
function planFab(){
  let f=document.getElementById('planfab');
  if(typeof uiOn==='function'&&!uiOn('fab')){ if(f) f.remove(); return null; }
  /* في الصفحة الأولى الشارة موجودة في الشريط الصغير — فلا نكرّرها */
  const h=location.hash||'#/';
  if((h==='#/'||h==='#')&&(typeof uiOn!=='function'||uiOn('pill'))){ if(f) f.remove(); return null; }
  if(!f){ f=document.createElement('a'); f.id='planfab'; f.className='planfab'; f.href='#/plan';
    f.addEventListener('click',e=>{ e.preventDefault(); location.hash='#/plan'; });
    document.body.appendChild(f); }
  f.href='#/plan';
  const p=planPill();
  f.classList.toggle('live',p.on);
  f.innerHTML=`${ICON.cal}<span><b>${esc(p.t)}</b>${p.sub?`<small>${esc(p.sub)}</small>`:''}</span>`;
  return f;
}
setInterval(()=>{ try{ planFab(); }catch(e){} }, 60000);

/* ---------- ربط الأحداث ---------- */
document.addEventListener('click',ev=>{
  const ho=ev.target.closest('[data-ho]');
  if(ho){ document.querySelectorAll('#hintOn .seg').forEach(x=>x.classList.toggle('on',x===ho)); return; }
  const hz=ev.target.closest('[data-hz],[data-hp]');
  if(hz){ hz.classList.toggle('on'); return; }
  const b=ev.target.closest('[data-p]'); if(!b) return;
  const k=b.dataset.p;
  if(k==='etask'){ editTask(b.dataset.id||null); }
  else if(k==='eev'){ editEvent(b.dataset.id||null, b.dataset.d||null); }
  else if(k==='ics'){ icsAll(); }
  else if(k==='taskfor'){ pendGoal=b.dataset.g; editTask(null); }
  else if(k==='notif'){
    if(!window.Notification){ toast('متصفحك لا يدعم الإشعارات'); return; }
    Notification.requestPermission().then(r=>toast(r==='granted'?'تعمل الإشعارات الآن':'لم تُمنح الإذن')); }
  else if(k==='egoal'){ editGoal(b.dataset.id||null); }
  else if(k==='eprio'){ editPrio(b.dataset.i!=null?+b.dataset.i:null); }
  else if(k==='praycfg'){ prayConfig(); }
  else if(k==='tick'){
    const id=b.dataset.id, d=new Date(b.dataset.d+'T12:00:00');
    setTaskDone(id,!isDone(id,d),d);
    const row=b.closest('.trow'); if(row) row.classList.toggle('done',isDone(id,d));
    planFab();
  }
  else if(k==='hintsave'){
    const on=document.querySelector('#hintOn .seg.on'); 
    plan.hint.on = on? on.dataset.ho==='1' : true;
    plan.hint.every=Math.max(1,Math.min(240,+document.getElementById('hintEvery').value||10));
    plan.hint.secs=Math.max(2,Math.min(30,+document.getElementById('hintSecs').value||3));
    plan.hint.before=Math.max(1,Math.min(120,+document.getElementById('hintBefore').value||10));

function icsPad(n){ return (n<10?'0':'')+n; }
function icsDT(date,time){
  const d=new Date(date+'T'+(time||'09:00')+':00');
  return d.getFullYear()+icsPad(d.getMonth()+1)+icsPad(d.getDate())+'T'+icsPad(d.getHours())+icsPad(d.getMinutes())+'00';
}
function icsBody(list){
  const now=new Date();
  const stamp=now.getFullYear()+icsPad(now.getMonth()+1)+icsPad(now.getDate())+'T'+icsPad(now.getHours())+icsPad(now.getMinutes())+'00';
  const esc2=s=>String(s||'').replace(/([,;\\\\])/g,'\\\\$1').replace(/\n/g,'\\\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//masahati//AR','CALSCALE:GREGORIAN']
    .concat(list.flatMap(e=>{
      const st=icsDT(e.date,e.time), en=icsDT(e.date, e.time? m2hm(hm2m(e.time)+60) : '10:00');
      const al=['BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+esc2(e.title),'END:VALARM'];
      const al2=e.remind!==0? ['BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+esc2('غدًا: '+e.title),'END:VALARM'] : [];
      return ['BEGIN:VEVENT','UID:'+(e.id||uid('e'))+'@masahati','DTSTAMP:'+stamp,
        'DTSTART:'+st,'DTEND:'+en,'SUMMARY:'+esc2(e.title),
        e.note?'DESCRIPTION:'+esc2(e.note):null].filter(Boolean)
        .concat(al,al2,['END:VEVENT']);
    }))
    .concat(['END:VCALENDAR']).join('\r\n');
}

/* يقبل أي صيغة: @اسم — اسم — t.me/اسم — رابط منشور — t.me/s/اسم — رابط embed — نسخ من التطبيق */
function parseTgLink(s){
  s=(s||'').trim();
  if(!s) return {u:'',id:0,priv:false};
  /* رابط دعوة أو قناة خاصّة: لا يمكن عرضها */
  if(/(t|telegram)\.me\/(\+|joinchat\/|c\/)/i.test(s)) return {u:'',id:0,priv:true};
  let t=s.replace(/^https?:\/\//i,'')
         .replace(/^(www\.)?(t|telegram)\.me\//i,'')
         .replace(/^s\//i,'')
         .replace(/^@/,'');
  const m=/^([A-Za-z0-9_]{3,})(?:\/(\d{1,12}))?/.exec(t);
  if(!m) return {u:'',id:0,priv:false};
  let id=+(m[2]||0);
  if(!id){ const q=/[?&](?:post|single|comment)=?(\d{1,12})/.exec(s); if(q) id=+q[1]; }
  return {u:m[1], id, priv:false};
}
function chanU(s){ return parseTgLink(s).u; }
function parseChannel(html, u){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const wraps=[...doc.querySelectorAll('.tgme_widget_message_wrap, .tgme_widget_message')];
  const seen={}, posts=[];
  wraps.forEach(w=>{
    const msg=w.classList.contains('tgme_widget_message')? w : w.querySelector('.tgme_widget_message');
    if(!msg) return;
    const post=msg.getAttribute('data-post')||'';
    const id=+((post.split('/')[1])||0); if(!id||seen[id]) return; seen[id]=1;
    const o={id, url:'https://t.me/'+u+'/'+id};
    const tx=msg.querySelector('.tgme_widget_message_text');
    if(tx){ o.html=tx.innerHTML; o.text=(tx.textContent||'').trim(); }
    const ph=msg.querySelector('.tgme_widget_message_photo_wrap');
    if(ph){ const m=/url\(['"]?([^'")]+)/.exec(ph.getAttribute('style')||''); if(m) o.photo=m[1]; }
    const vp=msg.querySelector('video.tgme_widget_message_video, video[src]');
    if(vp) o.video=vp.getAttribute('src');
    const vth=msg.querySelector('.tgme_widget_message_video_thumb');
    if(vth){ const m=/url\(['"]?([^'")]+)/.exec(vth.getAttribute('style')||''); if(m) o.thumb=m[1]; }
    const aud=msg.querySelector('audio[src]');
    if(aud) o.audio=aud.getAttribute('src');
    const voice=msg.querySelector('.tgme_widget_message_voice');
    if(!o.audio&&voice&&voice.getAttribute('src')) o.audio=voice.getAttribute('src');
    const at=msg.querySelector('.tgme_widget_message_audio_title, .tgme_widget_message_document_title');
    if(at) o.title=(at.textContent||'').trim();
    const ad=msg.querySelector('.tgme_widget_message_audio_duration, .tgme_widget_message_voice_duration');
    if(ad) o.durTxt=(ad.textContent||'').trim();
    const dw=msg.querySelector('a.tgme_widget_message_document_wrap, .tgme_widget_message_document_wrap');
    if(dw&&dw.getAttribute('href')) o.doc=dw.getAttribute('href');
    const ds=msg.querySelector('.tgme_widget_message_document_extra');
    if(ds) o.size=(ds.textContent||'').trim();
    const tm=msg.querySelector('time[datetime]');
    if(tm) o.at=tm.getAttribute('datetime');
    const vw=msg.querySelector('.tgme_widget_message_views');
    if(vw) o.views=(vw.textContent||'').trim();
    if(o.text||o.photo||o.audio||o.video||o.doc) posts.push(o);
  });
  posts.sort((a,b)=>b.id-a.id);
  const ttl=doc.querySelector('.tgme_channel_info_header_title, meta[property="og:title"]');
  const desc=doc.querySelector('.tgme_channel_info_description');
  const img=doc.querySelector('.tgme_page_photo_image img, .tgme_channel_info_header_photo img');
  return {posts,
    name: ttl? (ttl.textContent||ttl.getAttribute('content')||'').trim() : u,
    about: desc? (desc.textContent||'').trim() : '',
    photo: img? img.getAttribute('src') : ''};
}
/* نسخة محفوظة من آخر جلب ناجح — تُعرض فورًا وإن انقطع الإنترنت */
function tgSaved(u){ const all=S.get('tgcache',{}); return all[u]||null; }
function tgSave(u,d){
  const all=S.get('tgcache',{});
  all[u]={t:Date.now(), name:d.name, about:d.about, photo:d.photo,
    posts:d.posts.slice(0,25).map(p=>{ const o=Object.assign({},p);
      if(o.html&&o.html.length>4000) o.html=o.html.slice(0,4000)+'…'; return o; })};
  const keys=Object.keys(all);
  if(keys.length>12){ keys.sort((a,b)=>(all[a].t||0)-(all[b].t||0)); delete all[keys[0]]; }
  try{ S.set('tgcache',all); }catch(e){}
}
async function loadChannel(u, force){
  const c=chanCache[u];
  if(!force && c && Date.now()-c.t < 120000) return c.d;
  let html=null, err=null;
  for(const url of ['https://t.me/s/'+u, 'https://t.me/'+u]){
    try{ html=await grabAny(url, 9000); if(html) break; }catch(e){ err=e; }
  }
  if(!html) throw err||new Error('fail');
  const d=parseChannel(html,u);
  if(!d.posts.length) throw new Error('empty');
  chanCache[u]={t:Date.now(), d};
  tgSave(u,d);
  const ch=chans.find(x=>x.u===u);
  if(ch){ ch.name=d.name||ch.name; ch.photo=d.photo||ch.photo; ch.about=d.about||ch.about;
    if(d.posts[0]) ch.top=d.posts[0].id; saveChans(); }
  return d;
}
function tgDate(s){
  if(!s) return '';
  const d=new Date(s); if(isNaN(d)) return '';
  const now=new Date(), diff=(now-d)/60000;
  if(diff<1) return 'الآن';
  if(diff<60) return 'قبل '+AR(Math.round(diff))+' د';
  if(diff<1440) return 'قبل '+AR(Math.round(diff/60))+' س';
  return AR(d.getDate())+' '+MONTHS[d.getMonth()];
}

function paintFeed(){

async function fillFeed(force){
  const box=document.getElementById('chFeed'); if(!box) return;
  const u=box.dataset.u, auto=box.dataset.mode!=='read';
  const c=chans.find(x=>x.u===u)||{u};
  const sv=tgSaved(u);
  /* اعرض المحفوظ فورًا ثم حدّثه في الخلفية */
  if(sv&&sv.posts&&sv.posts.length){ box.innerHTML=feedHTML(u,sv,true); paintFeed(); }
  else box.innerHTML=`<div class="pcardx">جارٍ جلب آخر المنشورات…</div>`;
  if(inSandbox()&&!(sv&&sv.posts&&sv.posts.length)){ box.innerHTML=frameFallback(u,c,'sandbox'); watchPosts(); return; }
  try{
    const d=await loadChannel(u,force);
    const ch=chans.find(x=>x.u===u);
    if(ch){ const top=d.posts[0]?d.posts[0].id:0;
      ch.newN=Math.max(0,d.posts.filter(p=>p.id>(ch.seen||0)).length);
      ch.seen=top; saveChans(); }
    const ab=document.getElementById('chAbout'); if(ab&&d.about) ab.textContent=d.about;
    box.innerHTML=feedHTML(u,d,false); paintFeed();
  }catch(e){
    if(sv&&sv.posts&&sv.posts.length) return;          /* المحفوظ معروض أصلًا */
    if(auto){ box.innerHTML=frameFallback(u,c,'net'); watchPosts(); return; }
    box.innerHTML=`<div class="pcardx">
      <b>تعذّر جلب المنشورات</b>
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.9">
        القراءة داخل الموقع تمرّ عبر وسيط عام، وهذه الوسطاء تتعطّل كثيرًا.
        جرّب «منشورات أصلية» فهو لا يحتاج وسيطًا، أو ضع وسيطك الخاص في الإعدادات.</p>
      <div class="tgstat" dir="ltr" style="text-align:left">${lastGrabLog.map(esc).join('<br>')}</div>
      <div class="sheetrow" style="margin:10px 0 0">
        <button class="btn pri" data-c="mode" data-m="live">المنشورات الأصلية</button>
        <button class="btn" data-c="refresh">أعد المحاولة</button>
        <a class="btn" href="https://t.me/${esc(u)}" target="_blank" rel="noopener">${ICON.ext} في تيليجرام</a></div></div>`;
  }
}
/* حين يتعذّر الجلب: منشورات تيليجرام الأصلية بلا وسيط */
function frameFallback(u,c,why){
  const top=+(c.top||0), show=+(c.show||CH_STEP);
  const why2 = why==='sandbox'
    ? 'أنت داخل صفحة claude.ai وهي تمنع الاتصال الخارجي — وهذه المنشورات الأصلية قد لا تظهر أيضًا. افتح الملف أو رابط استضافتك.'
    : 'تعذّر الوصول إلى تيليجرام عبر الوسطاء، فانتقلنا إلى المنشورات الأصلية — وهي لا تحتاج وسيطًا.';
  return `<div class="pcardx note2">${ICON.info} ${why2}</div>
    ${top? postFrames(u,top,show)+
      `<div class="sheetrow" style="margin:0 16px 20px"><button class="btn" data-c="more" data-u="${esc(u)}">اعرض أقدم</button>
        <button class="btn" data-c="refresh">أعد محاولة الجلب</button></div>`
     : topBox(u,0)}`;
}

/* ---------- الأحداث ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-c]'); if(!b) return;
  const k=b.dataset.c;
  if(k==='add'){
    ev.preventDefault();
    const inp=document.getElementById('chAdd');
    const p=parseTgLink(b.dataset.u || (inp?inp.value:''));
    if(p.priv){ toast('قناة خاصّة أو رابط دعوة — تيليجرام لا يسمح بعرضها خارج التطبيق'); return; }
    const u=p.u;
    if(!u){ toast('اكتب اسم القناة أو الصق أي رابط منها'); return; }
    let c=chans.find(x=>x.u===u);
    if(!c){ c={u,name:u,seen:0}; chans.push(c); toast('أُضيفت — جارٍ الجلب…'); }
    else toast('القناة مضافة');
    if(p.id){ c.top=p.id; c.show=CH_STEP; }
    saveChans();
    location.hash='#/tg/'+u;
    if(location.hash==='#/tg/'+u) render();
  }
  else if(k==='del'){
    ev.preventDefault(); ev.stopPropagation();
    chans=chans.filter(x=>x.u!==b.dataset.u); saveChans(); render();
  }
  else if(k==='refresh'){ fillFeed(true); }
  else if(k==='settop'){
    const v=((document.getElementById('chTop')||{}).value||'').trim();
    const u=b.dataset.u;
    let id=parseTgLink(v).id;
    if(!id && /^\d{1,12}$/.test(v)) id=+v;                    /* الرقم وحده يكفي */
    if(!id){ const m=/(\d{1,12})/.exec(v); if(m) id=+m[1]; }
    if(!id){ toast('الصق رابط منشور أو اكتب رقمه'); return; }
    let c=chans.find(x=>x.u===u);
    if(!c){ c={u,name:u,seen:0}; chans.push(c); }
    c.top=id; c.show=CH_STEP; saveChans(); render();
  }
  else if(k==='more'){
    const c=chans.find(x=>x.u===b.dataset.u); if(!c) return;
    c.show=(+c.show||CH_STEP)+CH_STEP; saveChans(); render();
  }
  else if(k==='mode'){ S.set('chmode', b.dataset.m); render(); }
  else if(k==='reload'){ const f=document.getElementById('chFrame'); if(f) f.src=f.src; }
  else if(k==='chfull'){ const box=document.getElementById('chLive');
    if(box){ const on=!box.classList.contains('full');
      box.classList.toggle('full',on); document.body.style.overflow=on?'hidden':'';
      const btn=document.getElementById('chFullBtn'); if(btn) btn.textContent=on?'خروج':'ملء الشاشة'; } }
  else if(k==='playp'){
    const url=b.dataset.u, name=b.dataset.n;
    const id='tgp:'+btoa(unescape(encodeURIComponent(url))).slice(0,24);
    au.src=url; P.el.classList.add('up');
    P.title.innerHTML=`<b>${esc(name)}</b><small>من تيليجرام</small>`;
    P.title.href=location.hash;
    au.playbackRate=S.get('rate',1);
    au.play().catch(()=>toast('تعذّر التشغيل — قد يمنع المتصفح الوصول'));
    if('mediaSession' in navigator){ try{
      navigator.mediaSession.metadata=new MediaMetadata({title:name,artist:site.name||'مساحتي',artwork:artwork(name)});
    }catch(e){} mediaInit(); }
  }
  else if(k==='imp'){
    const url=b.dataset.url;
    if(!tree.length){ toast('أنشئ قسمًا في المكتبة أولًا'); location.hash='#/lib'; return; }
    sheet(`<h3>استيراد المنشور</h3>
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">اختر القسم الذي يُضاف إليه.</p>
      <div class="rows" style="display:flex;flex-direction:column;gap:8px">
        ${tree.map(sec=>`<button class="tile" data-tgt="${sec.id}"><div class="ic">${ICON.lib}</div>
          <div><b>${esc(sec.name)}</b><small>${AR(secCount(sec))} عنصر</small></div></button>
          ${(sec.subs||[]).map(sub=>`<button class="tile" data-tgt="${sec.id}:${sub.id}" style="margin-inline-start:18px">
            <div class="ic" style="background:var(--bg2);color:var(--muted)">${ICON.lib}</div>
            <div><b>${esc(sub.name)}</b><small>داخل ${esc(sec.name)}</small></div></button>`).join('')}`).join('')}
      </div><div class="tgstat" id="impStat"></div>`, el=>{
      el.addEventListener('click',async e2=>{
        const t=e2.target.closest('[data-tgt]'); if(!t) return;
        const st=el.querySelector('#impStat');
        try{ await tgImport(url, t.dataset.tgt, st); closeSheet(); render(); toast('أُضيف إلى مكتبتك'); }
        catch(err){ if(st){ st.textContent='تعذّر الاستيراد — جرّب وسيطًا آخر من الإعدادات.'; st.style.color='#c0392b'; } }
      });
    });
  }
});

/* مراقبة إطار العرض المباشر */
function watchChanFrame(){
  const f=document.getElementById('chFrame'); if(!f) return;
  let ok=false;
  f.addEventListener('load',()=>{ ok=true; });
  setTimeout(()=>{ if(!ok){ const fl=document.getElementById('chFall'); if(fl) fl.classList.add('show','warn'); } }, 7000);

/* ارتفاع إطارات منشورات تيليجرام + إخفاء ما لا يوجد */
(function(){
  addEventListener('message',ev=>{
    if(!/t\.me|telegram/.test(ev.origin||'')) return;
    let d=ev.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(e){ return; }
    if(!d||!d.height) return;
    document.querySelectorAll('.tgpost-f').forEach(f=>{
      if(f.contentWindow===ev.source){ f.style.height=Math.max(90,+d.height)+'px'; f.dataset.ok='1';
        const cell=f.closest('.tgcell'); if(cell) cell.classList.add('ok'); }
    });
  });
})();
function watchPosts(){
  setTimeout(()=>{
    document.querySelectorAll('.tgcell').forEach(c=>{
      const f=c.querySelector('.tgpost-f');
      if(f&&!f.dataset.ok) c.classList.add('dim');
    });
  },6000);
}


/* ================= تخصيص الموقع: إظهار وإخفاء وترتيب وتسمية ================= */
/* الأقسام كلّها في الشريط السفلي — ولا «مزيد».
   الخرائط داخل الفوائد، والتأريخ داخل الإعدادات، والمفضلة أعلى الصفحة. */
const PARTS=[
  {h:'#/plan',   d:'جدولي',    ic:'cal'},
  {h:'#/lib',    d:'المكتبة',  ic:'lib'},
  {h:'#/notes',  d:'فوائدي',   ic:'pen'},
  {h:'#/boh',    d:'بوح',      ic:'boh'},
  {h:'#/quotes', d:'الجدار', ic:'quote'},
  {h:'#/tg',     d:'قنواتي',   ic:'tg'},
  {h:'#/cards',  d:'بطاقاتي',  ic:'card'},
  {h:'#/search', d:'بحث',      ic:'search'}
];
const GONE=['#/mind','#/time','#/fav'];   /* صارت داخل أقسامها */
const BITS=[
  ['today', 'جدول اليوم في الصفحة الأولى'],
  ['wall',  'ورقة الاقتباس الصغيرة بجانب العنوان'],
  ['hgoals','أهدافي في الصفحة الأولى'],
  ['pins',  'المثبّتات في الصفحة الأولى'],
  ['cont',  'شريط «تابع من حيث توقفت»'],
  ['secs',  'بطاقات أقسام المكتبة في الصفحة الأولى'],
  ['quick', 'روابط سريعة أسفل الصفحة الأولى'],
  ['hbtns', 'روابط الأهداف والأولويات والمهام تحت البانر'],
  ['pill',  'شارة «الآن/التالي» في الشريط الصغير'],
  ['fab',   'الزر العائم للجدول'],
  ['hint',  'التذكير العائم'],
  ['tabbar','شريط التبويب السفلي في الهاتف']
];
let UI=S.get('ui',null);
if(!UI||!UI.parts){
  UI={parts:PARTS.map(p=>({h:p.h,t:p.d,on:true})), bits:{}};
  BITS.forEach(([k])=>UI.bits[k]=true);
}
/* أي جزء جديد يُضاف لاحقًا يظهر تلقائيًا، وما انتقل إلى مكان آخر يُرفع من الشريط */
UI.parts=UI.parts.filter(p=>!GONE.includes(p.h));
UI.parts.forEach(p=>{ if(p.h==='#/quotes'&&(!p.t||p.t==='اقتباسات')) p.t='الجدار'; });
PARTS.forEach(p=>{ if(!UI.parts.find(x=>x.h===p.h)) UI.parts.push({h:p.h,t:p.d,on:true}); });
saveUIsafe();
BITS.forEach(([k])=>{ if(UI.bits[k]===undefined) UI.bits[k]=true; });
const saveUI=()=>S.set('ui',UI);
/* الصفحة الأولى أهدأ: شبكة «كل الأقسام» تُطفأ افتراضيًا (الأقسام كلّها في الشريط وقائمة «المزيد») — مرّة واحدة فقط */
if(!S.get('simpleHome',false)){ UI.bits.quick=false; S.set('simpleHome',true); saveUI(); }
function saveUIsafe(){ try{ S.set('ui',UI); }catch(e){} }
const uiOn=k=>UI.bits[k]!==false;
const partOn=h=>{ const p=UI.parts.find(x=>x.h===h); return !p||p.on!==false; };
const partName=h=>{ const p=UI.parts.find(x=>x.h===h); const d=PARTS.find(x=>x.h===h);
  return (p&&p.t)||(d&&d.d)||''; };

const partIcon=h=>{ const d=PARTS.find(x=>x.h===h); return d? ICON[d.ic] : ICON.home; };
function navList(){
  return [{h:'#/',t:'الرئيسية',ic:ICON.home}]

let ytPlayer = null, rangeStop = null;
function ytHook() {
  ytPlayer = null;
  const f = document.getElementById('ytframe');
  if (!f || ytMode() === 'alt') return;
  const boot = () => { try { ytPlayer = new YT.Player('ytframe', { events: {} }); } catch (e) {} };
  if (window.YT && YT.Player) { boot(); return; }
  if (!document.getElementById('ytapi')) {
    const s = document.createElement('script');
    s.id = 'ytapi'; s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => { if (prev) { try { prev(); } catch (e) {} } boot(); };
}
/* الوقت الحالي — null يعني أنّنا لا نعرفه فنسأل المستخدم */
function nowTime(it) {
  if (it.type === 'video') { const v = document.getElementById('vplayer'); return v ? (v.currentTime || 0) : null; }
  if (it.type === 'audio') {
    if (typeof current !== 'undefined' && current && current.id === it.id) return au.currentTime || 0;
    const p = S.get('pos', {})[it.id]; return p != null ? p : null;
  }
  if (it.type === 'youtube') {
    if (ytPlayer && ytPlayer.getCurrentTime) { try { const t = ytPlayer.getCurrentTime(); if (t >= 0) return t; } catch (e) {} }
    return null;
  }
  return null;
}
function seekItem(it, t, end) {
  rangeStop = (end && end > t) ? { id: it.id, end } : null;
  if (it.type === 'video') {
    const v = document.getElementById('vplayer');
    if (v) { try { v.currentTime = t; v.play().catch(() => {}); } catch (e) {} return true; }
  }
  if (it.type === 'audio') { play(it.id, t); return true; }
  if (it.type === 'youtube') {
    if (ytPlayer && ytPlayer.seekTo) {
      try { ytPlayer.seekTo(t, true); if (ytPlayer.playVideo) ytPlayer.playVideo(); return true; } catch (e) {}
    }
    const f = document.getElementById('ytframe');
    if (f && f.dataset.yid) { f.src = ytSrc(f.dataset.yid, ytMode()) + '&start=' + Math.floor(t) + '&autoplay=1'; return true; }
  }
  toast('شغّل المقطع أولًا');
  return false;
}
/* التوقّف عند نهاية المقطع المعلَّم */
function stopWatch(t, id) {
  if (!rangeStop || rangeStop.id !== id) return;
  if (t >= rangeStop.end) {
    rangeStop = null;
    try { au.pause(); } catch (e) {}
    const v = document.getElementById('vplayer'); if (v) v.pause();
    if (ytPlayer && ytPlayer.pauseVideo) { try { ytPlayer.pauseVideo(); } catch (e) {} }
    toast('انتهى المقطع المعلَّم');
  }
}
try { au.addEventListener('timeupdate', () => { if (current) stopWatch(au.currentTime, current.id); }); } catch (e) {}

/* ---------- تحويل الوقت ---------- */
function toSec(s) {
  s = (s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return +s;
  const p = s.split(':').map(x => +x);
  if (p.some(isNaN)) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0];
}

function txPaste(it) {

      const segs = parseTxText(v);
      if (!segs.length) { toast('اكتب شيئًا'); return; }
      saveTx(it.id, { how: 'paste', at: Date.now(), segs });

function parseTxText(v) {
  return (v || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = /^[\[\(]?([\d٠-٩]{1,2}:[\d٠-٩]{2}(?::[\d٠-٩]{2})?)[\]\)]?\s*[-—:]?\s*(.*)$/.exec(l);
    if (m && m[2]) return { s: toSec(m[1]), t: m[2] };
    return { s: null, t: l };
  });
}
/* ترجمة يوتيوب المكتوبة */
async function txCaptions(it) {
  const yid = ytId(it.url);
  if (!yid) { toast('رابط يوتيوب غير صالح'); return; }
  const box = txProgress('جارٍ البحث عن ترجمة الفيديو…');
  try {
    const html = await grabAny('https://www.youtube.com/watch?v=' + yid, 12000);
    const m = /"captionTracks":(\[.*?\])/.exec(html);
    if (!m) throw new Error('لا ترجمة');
    const tracks = JSON.parse(m[1].replace(/\\u0026/g, '&'));
    const pick = tracks.find(t => /^ar/i.test(t.languageCode)) || tracks[0];
    if (!pick || !pick.baseUrl) throw new Error('لا ترجمة');
    const xml = await grabAny(pick.baseUrl.replace(/\\u0026/g, '&'), 12000);
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const segs = [...doc.querySelectorAll('text')].map(t => ({
      s: +t.getAttribute('start') || 0,
      t: (t.textContent || '').replace(/&#39;/g, '\'').replace(/\s+/g, ' ').trim()
    })).filter(x => x.t);
    if (!segs.length) throw new Error('لا ترجمة');
    saveTx(it.id, { how: 'auto', model: 'ترجمة يوتيوب', at: Date.now(), segs });
    closeSheet(); render(); toast('جُلبت الترجمة');
  } catch (e) {
    if (box) box.innerHTML = `<h3>تعذّر جلب الترجمة</h3>
      <p class="mkempty">قد لا يكون للفيديو ترجمة مكتوبة، أو منع الوسيط الوصول.
        تستطيع لصق النصّ بنفسك، أو رفع الصوت كملف في مكتبتك وتفريغه آليًّا.</p>
      <div class="sheetrow"><button class="btn pri" data-txp2="paste">ألصق نصًّا</button>
        <button class="btn" onclick="closeSheet()">إغلاق</button></div>`;
    if (box) box.addEventListener('click', ev => {
      if (ev.target.closest('[data-txp2]')) { closeSheet(); txPaste(it); }
    });
  }
}

/* فحصٌ يقول أين تعطّل التفريغ بالضبط، لا «تعذّر» فحسب */
async function txDiag(out) {
  if (!out) return;
  const L = [];
  const say = () => out.innerHTML = L.join('<br>');
  const ok = '<b style="color:var(--acc)">✓</b>', no = '<b style="color:#b4472e">✗</b>';
  L.push('جارٍ الفحص…'); say();
  L.length = 0;
  L.push(`المصدر: <b dir="ltr">${esc(location.protocol + '//' + (location.host || 'ملف من الجهاز'))}</b>`);
  L.push(`عزل المصدر (COOP/COEP): ${self.crossOriginIsolated ? ok + ' مفعّل' : no + ' غير مفعّل — نستعمل خيطًا واحدًا'}`);
  L.push(`بطاقة رسوميّة (WebGPU): ${navigator.gpu ? ok : '—'}`);
  say();
  let r = null;
  try {
    const w = txWorkerStart();
    r = (await txAsk({ cmd: 'probe', model: 'Xenova/whisper-tiny' }, null, 120000)).r;
  } catch (e) {
    L.push(`${no} تعذّر تشغيل عامل الخلفية: ${esc(String(e.message || e))}`); say(); return;
  }
  L.push(`${ok} عامل الخلفية يعمل`);
  if (r.libErr) L.push(`${no} تنزيل مكتبة التفريغ من cdn.jsdelivr.net: ${esc(r.libErr)}`);
  else L.push(`${ok} مكتبة التفريغ وصلت (${AR(Math.round(r.lib / 1000))} ثانية)`);
  if (r.hfErr) L.push(`${no} الوصول إلى huggingface.co: ${esc(r.hfErr)}`);
  else if (r.hfStatus != null) L.push(`${r.hfStatus === 200 ? ok : no} خادم النماذج huggingface.co — الحالة ${AR(r.hfStatus)}`);
  if (r.libErr || r.hfErr || r.hfStatus !== 200)
    L.push('<br>أكثر ما يمنعه: شبكة تحجب هذين العنوانين (شبكة عمل أو مدرسة أو مزوّد)، أو مانع إعلانات، أو تصفّح خفيّ. جرّب شبكة أخرى أو متصفّحًا آخر.');
  else L.push('<br>كل شيء سليم — ابدأ التفريغ، وأوّل مرّة يُنزَّل النموذج فاصبر عليه.');
  say();
}

async function txAudio(it) {
  let blob = null;
  if (it.file) blob = await getFile(it.file);
  if (!blob && it.url) {
    try { const r = await fetch(it.url); blob = await r.blob(); }
    catch (e) { blob = await grab(it.url, false, 20000); }
  }
  if (!blob) throw new Error('لم أجد ملف الصوت في هذا المتصفح');
  const ab = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let buf;
  try { buf = await ctx.decodeAudioData(ab); }
  catch (e) { ctx.close(); throw new Error('تعذّر فكّ ترميز الصوت — جرّب ملف mp3 أو m4a'); }
  ctx.close();
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const out = await off.startRendering();
  return out.getChannelData(0);
}
